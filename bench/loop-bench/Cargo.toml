[package]
name = "loop-bench"
# Deliberately NOT `version.workspace = true`: this is a dev harness, not a
# shipped artifact, so it stays off the release train that syncs the product
# crates in lockstep.
version = "0.1.0"
edition = "2024"
# Inherited so the harness is held to the same MSRV as the crates it measures
# — it uses edition-2024 let-chains, which the workspace floor already covers.
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Inexpensive turn-loop + context-query correctness harness over Terminal-Bench"
publish = false

[lib]
name = "loop_bench"
path = "src/lib.rs"

[[bin]]
name = "loop-bench"
path = "src/main.rs"

[dependencies]
# The A/B comparison shape `--compare` emits (#876). Deliberately NOT a
# harness-local report type: the promotion gates that read it — an adapter
# (#836), a tuned knob (#831/#1065), an eval-gated skill (#1067) — must be
# reading the same aggregates, the same guard set, and the same significance
# test the offline harness applied, and two report types is two standards.
stella-core = { path = "../../stella-core" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
