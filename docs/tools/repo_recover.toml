description = '''
Find committed work that no branch points at, judged against a reference you name (`target`, default HEAD). Searches the whole object store (git fsck) UNIONed with the position log, so it is the only tool that reaches commits the reflog has already expired, and the only one that answers "unreferenced relative to THIS ref". Returns each commit's sha, subject, author, date, parents, and `sits_on_target` (true when it sits directly on the target and can be integrated by fast-forward rather than a merge that could conflict); commits already contained in the target are omitted as found, not lost. This is the slow last resort — scanning every object is why `repo_status` does not do it on every call — so reach for it only once `repo_status` has shown no shelved change, no detached position and nothing under `unreachable`. Stella's own candidate-workspace snapshot commits are excluded and counted separately — they are unreachable by construction and are never the user's lost work.
'''

