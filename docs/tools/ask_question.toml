description = '''
Ask whoever is driving you to settle a decision you cannot settle yourself, and wait for the answer. Deciding for yourself is the default; this is the exception. The call stops the work until someone answers, so the bar has two halves and needs both: you genuinely do not know something you need to know, and the readings lead to materially different work. That is a product or design choice where several options all work, a preference, a constraint only they know — never anything the codebase, the tests, or one search call would answer. Read first; ask only what reading cannot settle. Under that bar the move is not silence: decide, keep going, and say in your final report which way you went and what would change it — a stated assumption a human can correct beats a question that stopped them. Pose 4 questions at most, in one call rather than one per turn, each with 2-4 concrete options that name what would actually happen. Put your recommendation first and say so in its label. Never offer a free-text or 'other' option: one is always added for you. The answer comes back with any notes the driver attached to it — read those, they usually carry the constraint the options could not. In an unattended run there may be nobody to ask: you will be told so plainly, and then you decide yourself and say which way you went.
'''

