description = '''
Ask whoever is driving you to settle a decision you cannot settle yourself, and wait for the answer. Use it when the answer is genuinely theirs to give — a product or design choice where several options all work, a preference, a constraint only they know, an ambiguity where two readings lead to materially different work. Do NOT use it for anything the codebase, the tests, or one search call would answer: read first, ask only what reading cannot settle. Pose 4 questions at most, in one call rather than one per turn, each with 2-4 concrete options that name what would actually happen. Put your recommendation first and say so in its label. Never offer a free-text or 'other' option: one is always added for you. The answer comes back with any notes the driver attached to it — read those, they usually carry the constraint the options could not. In an unattended run there may be nobody to ask: you will be told so plainly, and then you decide yourself and say which way you went.
'''

