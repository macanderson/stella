description = '''
Find code. This is the ONLY search you need: describe what you are looking for, in whatever form you have it, and get back the files that answer it with their symbols, callers, imports and source already attached — so one call usually replaces a run of grep/glob/read_file round trips.

It matches by MEANING, not just by text, so the words you use do not have to appear anywhere in the code. Ask it the question you actually have:
- `search("where are request headers sanitized before logging")` — finds the file even if it is called `hkey.rs` and says `scrub`
- `search("what calls resolve_provider")` — a symbol name works just as well as a sentence
- `search("the retry/backoff policy for failed HTTP requests")` — describe behaviour when you cannot name it
- `search("CredentialStore")` — a bare type name finds its definition and its neighbourhood

Reach for it the moment you are about to guess a spelling. An agent grepping `redact|scrub|sanitize|mask` in turn is describing something semantically to an index that only matches substrings; the spelling you did not think of is the one grep silently misses, and this call replaces that whole run. Use `read_file` afterwards when you need more of a file than the answer carried, and `bash` with `grep -n` when you need every occurrence of one exact literal string. The answer always states which strategies ran and whether it was truncated.
'''

