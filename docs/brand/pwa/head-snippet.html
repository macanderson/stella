<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">

<!-- Safari tints the pinned-tab mask itself, and its tab bar is light, so this
     takes the kit's light-ground mark stop (brand-700, 5.65:1 on white) rather
     than full brand (2.98:1) — the same rule the *-color-light.svg cuts
     follow, introduced in v3.0 and kept by v4.0. -->
<link rel="mask-icon" href="/safari-pinned-tab.svg" color="#8B5E1A">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#070B10">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#EEF1F5">
<meta property="og:image" content="/og-image.png">
