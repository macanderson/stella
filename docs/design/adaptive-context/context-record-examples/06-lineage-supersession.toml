# Revision identity without an allocated version counter.
#
# Both records below share one `lineage_id` and differ in `record_id`, which is
# derived from each revision's own content hash. Nothing had to read the store
# to decide "this is version 2" — which is what keeps extraction idempotent:
# re-ingesting unchanged content recomputes the same `record_id`, and the
# ledger's append becomes a no-op instead of a duplicate.
#
# That property is the entire refresh story. Re-running ingest IS refresh:
#
#   unchanged claim → same record_id → append no-ops
#   edited claim    → new record_id, same lineage_id → superseding revision
#   removed claim   → absent from extraction → status archived, never deleted
#
# Nothing is ever deleted, so `ut_` use records, `pev_` promotion events, and
# proposals' supporting-observation references never dangle.
#
# Note there is no `superseded` status: RecordStatus is frozen at active /
# retracted / archived. A replaced record is `archived`; the live revision
# points BACK at it with a `derived_from` link (the file surface has no
# forward `superseded_by` field — forward pointers live in the lifecycle
# ledger, whose append carries `supersedes`, so the immutable old record
# never needs editing when a successor lands). `retracted` is reserved for a
# claim that was *wrong* — the distinction matters, because an archived
# record was true for its window and `as_of` queries should still return it.

schema = "context-record/v0.1"
set_id = "acme.web"

[defaults]
sharing_scope = "repository"
origin        = "user"

[defaults.provenance]
source_kind = "authored"
repo        = "git@github.com:acme/web.git"


# ── The superseded revision, retained so old citations still resolve ─────────
[[record]]
lineage_id  = "ctx.acme.web.node-version"
record_id   = "rec_acme_web_node_version_06911686d7bf"
record_hash = "sha256:cf4cdc7905a24f58f5364a8d0119b9730cda690a881296471cc173a806db6339"
kind        = "constraint"
status      = "archived"
statement   = "Development runs on Node 20.x."

# When this revision was replaced, and by what, is NOT recorded here — the
# archived record is immutable, so a forward pointer would mean editing it the
# day its successor lands. The lifecycle ledger's append for the new revision
# carries `supersedes`, and the new record's `derived_from` link (below) is
# the git-visible projection of the same fact.

  [record.provenance]
  commit = "3ab77e1"

  [record.steering]
  force      = "must"
  precedence = 90
  applies_to = { paths = ["**"] }

  [record.enforcement]
  mode = "none"             # an archived record enforces nothing

  [record.truth]
  basis       = "decree"
  confidence  = 100
  verified_by = "@dana"
  valid_from  = "2025-04-18T00:00:00Z"


# ── The live revision ────────────────────────────────────────────────────────
[[record]]
lineage_id  = "ctx.acme.web.node-version"
record_id   = "rec_acme_web_node_version_27a072786d8c"
record_hash = "sha256:d89727651321730b9a7d6daf4d4bd9d88a6e954363cf2be3996954730193b06a"
kind        = "constraint"
status      = "active"
statement   = "Development runs on Node 22.x."

  [record.provenance]
  commit = "9f2c1ab"

  [record.steering]
  force         = "must"
  precedence    = 90
  applies_to    = { paths = ["**"] }

  [record.enforcement]
  mode         = "soft"
  check        = "model"
  rubric       = "Toolchain references target Node 22.x."
  severity     = "warn"
  on_violation = "Update the toolchain reference to Node 22.x."

  [record.truth]
  basis        = "decree"
  confidence   = 100
  verified_by  = "@dana"
  verified_at  = "2026-06-02T00:00:00Z"
  valid_from   = "2026-06-02T00:00:00Z"
  review_every = "P180D"

    [record.truth.probe]
    kind    = "file_contains"
    path    = ".nvmrc"
    pattern = "^22\\."

  # The revision chain, as the file surface expresses it: the live revision
  # was derived from the archived one it replaces. (LinkRelation is frozen at
  # derived_from / refines / requires / supports / contradicts — there is no
  # `supersedes` relation; that verb belongs to the lifecycle ledger.)
  [[record.link]]
  relation = "derived_from"
  target   = "rec_acme_web_node_version_06911686d7bf"

  # Records the governance decision that replaced the old revision. The
  # corresponding immutable `pev_` promotion event carries actor, reason, and
  # timestamp; this link is the projection of it that lives in git.
  [[record.link]]
  relation = "supports"
  target   = "evidence:pev_01J7Y2N8C4Q1XR5M0B3KD9WE6T"
