[package]
name = "stella-cli"
description = "The stella CLI — a fast, BYOK, model-agnostic terminal coding agent."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "stella"
path = "src/main.rs"

# This is the only shipped binary. `publish = false` is inherited from the
# workspace (we don't publish to crates.io), so dist needs an explicit opt-in.
# `formula = "stella"` names the Homebrew formula after the `stella` binary
# (not the `stella-cli` crate), so users run `brew install .../stella`.
[package.metadata.dist]
dist = true
formula = "stella"

[dependencies]
stella-protocol = { path = "../stella-protocol" }
contextgraph-types = { git = "https://github.com/macanderson/context-graph-protocol", rev = "eeba49cef9a7604bd910d4faa871702869144ed0" }
contextgraph-host = { git = "https://github.com/macanderson/context-graph-protocol", rev = "eeba49cef9a7604bd910d4faa871702869144ed0" }
# The host execution-trace journal + replay oracles (sketch stage) — the
# vocabulary `stella arena` records for the arena-bench runner to judge.
contextgraph-trace = { git = "https://github.com/macanderson/context-graph-protocol", rev = "eeba49cef9a7604bd910d4faa871702869144ed0" }
stella-core = { path = "../stella-core" }
stella-model = { path = "../stella-model" }
stella-tools = { path = "../stella-tools" }
stella-store = { path = "../stella-store" }
stella-observatory = { path = "../stella-observatory" }
stella-mcp = { path = "../stella-mcp" }
stella-media = { path = "../stella-media" }
stella-context = { path = "../stella-context" }
stella-graph = { path = "../stella-graph" }
stella-fleet = { path = "../stella-fleet" }
stella-pipeline = { path = "../stella-pipeline" }
stella-tui = { path = "../stella-tui" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hmac.workspace = true
reqwest.workspace = true
futures-util.workspace = true
tokio = { workspace = true, features = ["sync", "signal"] }
async-trait.workspace = true
clap.workspace = true
clap_complete.workspace = true
colored.workspace = true
# Not for rendering — `stella-tui` owns every ratatui surface. This is here so
# the two raw-truecolor banners in this crate (`tui.rs`'s wordmark,
# `init_fx.rs`'s cinematic) can read their stops OUT of `stella_tui::theme`
# instead of hard-coding hexes beside it. Two recolours' worth of drift got in
# through exactly that gap; a `Color::Rgb` match closes it.
ratatui.workspace = true
toml.workspace = true
dotenvy.workspace = true
libc.workspace = true
tempfile.workspace = true
# Masked TTY prompt for `stella connect … --token` (same crate stella-model
# uses for the interactive API-key prompt).
rpassword.workspace = true
# Wipes the raw prompt buffers `stella auth set` and `stella connect` read a
# secret into — the copies the caller never sees, which would otherwise be
# dropped intact into freed heap. `stella-model` already zeroizes the `ApiKey`
# these become; this closes the same hole one layer up, at the terminal.
zeroize.workspace = true
# The protocol's own conformance suite (SPEC.md 3.6), pinned to the same rev as
# the types/host we consume. A RUNTIME dependency, not just a dev one: #453
# makes conformance an install/enable-time ADMISSION GATE for external
# stdio/HTTP providers, so a non-conformant source is refused before it can
# serve a turn. The same suite still audits the in-tree providers in tests.
contextgraph-conformance = { git = "https://github.com/macanderson/context-graph-protocol", rev = "eeba49cef9a7604bd910d4faa871702869144ed0" }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
rusqlite.workspace = true
