<svg viewBox="0 0 680 584" width="680" height="584" xmlns="http://www.w3.org/2000/svg" font-family="DejaVu Sans Mono, JetBrains Mono, monospace">
<!-- Frame 1: browse — a bare `/` shows relevant now, the domain groups, then recent. -->
<rect x="0" y="0" width="680" height="318" rx="6" fill="#0A0A0C" stroke="#26262C" stroke-width="1"/>
<rect x="40" y="16" width="600" height="230" fill="#0F0F12" stroke="#2C2C33" stroke-width="1"/>
<text x="54" y="36" font-size="11" fill="#EFC53F">/ commands</text>
<text x="150" y="36" font-size="11" fill="#4B4B56">browse · 31 commands</text>
<text x="420" y="36" font-size="11" fill="#4B4B56">↑↓ move · ↵ run · ⇥ args · esc</text>
<line x1="40" y1="44" x2="640" y2="44" stroke="#26262C" stroke-width="1"/>
<text x="54" y="64" font-size="11" fill="#4B4B56">relevant now · a turn is running</text>
<rect x="41" y="70" width="598" height="18" fill="#17171B"/>
