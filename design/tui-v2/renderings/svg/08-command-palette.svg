<text x="54" y="105" font-size="11" fill="#EFC53F">/</text>
<text x="61" y="105" font-size="11" fill="#A9AAB5">inspect</text>
<text x="180" y="105" font-size="11" fill="#777782">the context sent to the model…</text>
<text x="54" y="127" font-size="11" fill="#EFC53F">/</text>
<text x="61" y="127" font-size="11" fill="#A9AAB5">budget</text>
<text x="180" y="127" font-size="11" fill="#777782">set or clear the session spend cap</text>
<text x="468" y="127" font-size="11" fill="#4B4B56">run $0.12 · set a cap</text>
<text x="54" y="151" font-size="11" fill="#4B4B56">session</text>
<text x="54" y="171" font-size="11" fill="#EFC53F">/</text>
<text x="61" y="171" font-size="11" fill="#A9AAB5">help</text>
<text x="180" y="171" font-size="11" fill="#777782">show commands</text>
<text x="54" y="191" font-size="11" fill="#EFC53F">/</text>
<text x="61" y="191" font-size="11" fill="#A9AAB5">clear</text>
<text x="180" y="191" font-size="11" fill="#777782">reset the conversation</text>
<text x="54" y="215" font-size="11" fill="#4B4B56">recent</text>
<text x="54" y="235" font-size="11" fill="#EFC53F">/</text>
<text x="61" y="235" font-size="11" fill="#A9AAB5">theme</text>
<text x="180" y="235" font-size="11" fill="#777782">switch colour theme</text>
<text x="360" y="235" font-size="11" fill="#4B4B56">2m ago</text>
<text x="40" y="274" font-size="12" fill="#EFC53F" font-weight="500">&gt;&gt;&gt;</text>
<text x="70" y="274" font-size="12" fill="#E8E8EC">/</text>
<rect x="80" y="264" width="7" height="13" fill="#E8E8EC"/>
<text x="40" y="302" font-size="11" fill="#4B4B56">browse — relevant now, the domain groups, then recent · anchored, opening upward</text>
<!-- Frame 2: a typed query is one flat ranked list, no section headings. -->
<rect x="0" y="330" width="680" height="254" rx="6" fill="#0A0A0C" stroke="#26262C" stroke-width="1"/>
<rect x="40" y="346" width="600" height="148" fill="#0F0F12" stroke="#2C2C33" stroke-width="1"/>
<text x="54" y="366" font-size="11" fill="#EFC53F">/ commands</text>
<text x="150" y="366" font-size="11" fill="#4B4B56">5 of 31 · fuzzy</text>
<text x="420" y="366" font-size="11" fill="#4B4B56">↑↓ move · ↵ run · ⇥ args · esc</text>
<line x1="40" y1="374" x2="640" y2="374" stroke="#26262C" stroke-width="1"/>
<rect x="41" y="382" width="598" height="18" fill="#17171B"/>
<text x="54" y="396" font-size="11" fill="#EFC53F">/in</text>
<text x="74" y="396" font-size="11" fill="#E8E8EC">fo</text>
