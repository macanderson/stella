<text x="74" y="418" font-size="11" fill="#A9AAB5">it</text>
<text x="180" y="418" font-size="11" fill="#777782">index the workspace: domains + code graph</text>
<text x="54" y="440" font-size="11" fill="#EFC53F">/in</text>
<text x="74" y="440" font-size="11" fill="#A9AAB5">spect</text>
<text x="180" y="440" font-size="11" fill="#777782">the context sent to the model on any call</text>
<text x="54" y="462" font-size="11" fill="#EFC53F">/in</text>
<text x="74" y="462" font-size="11" fill="#A9AAB5">box</text>
<text x="180" y="462" font-size="11" fill="#777782">notifications — messages persist until read</text>
<text x="516" y="462" font-size="11" fill="#F7D96B">3 unread</text>
<text x="54" y="484" font-size="11" fill="#EFC53F">/</text>
<text x="61" y="484" font-size="11" fill="#A9AAB5">sess</text>
<text x="87" y="484" font-size="11" fill="#EFC53F">i</text>
<text x="94" y="484" font-size="11" fill="#A9AAB5">o</text>
<text x="100" y="484" font-size="11" fill="#EFC53F">n</text>
<text x="107" y="484" font-size="11" fill="#A9AAB5">s</text>
<text x="180" y="484" font-size="11" fill="#777782">every stella session on this machine</text>
<text x="40" y="522" font-size="12" fill="#EFC53F" font-weight="500">&gt;&gt;&gt;</text>
<text x="70" y="522" font-size="12" fill="#E8E8EC">/in</text>
<rect x="93" y="512" width="7" height="13" fill="#E8E8EC"/>
<text x="40" y="550" font-size="11" fill="#4B4B56">a typed query is one flat ranked list · no section headings · scattered letters light gold</text>
</svg>
