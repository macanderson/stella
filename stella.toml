# stella.toml — generated by `stella migrate config`.
#
# <repo>/stella.toml — this repository. Commit it; it is reviewed like source.
#
# Values were serialized from the settings.json beside it, not
# transcribed, so nothing here can disagree with what stella read.
# Comments you add below survive every future write.
#
# The original settings.json was NOT deleted. Check this file, then
# remove the JSON — until you do, stella reads this one and says so.
#
# Full reference: docs/spec/config-system/stella.today.toml

[meta]
schema_version = 1
scope = "project"

[agents]
default_model = "openrouter/moonshotai/kimi-k3"
pipeline_verifier_model = "openrouter/anthropic/claude-opus-5"
pipeline_worker_model = "openrouter/moonshotai/kimi-k3"
pipeline_triage_model = "openrouter/anthropic/claude-haiku-4.5"
auto_mode = "off"
effort_auto = "off"
reasoning_auto = "off"

[agents.default]
effort = "xhigh"
reasoning = "on"

[agents.worker]
provider = "openrouter"
prompt = "do not overthink how to solve problems - if you have multiple approaches you are considering don't waste time deliberating and reasoning choose an approach and know if it fails you can always go back and try the other approache(s)"
effort = "xhigh"
reasoning = "on"

[agents.verifier]
provider = "openrouter"
prompt = "you are not to solve for completing the task - you are only verifying the task was completed by executing a test that must fail in the environment and pass with the workers code implemented to solve for the task."
effort = "xhigh"
reasoning = "on"

[agents.triage]
provider = "openrouter"
reasoning = "off"
