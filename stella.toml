# stella.toml — generated by `stella migrate config`.
#
# <repo>/stella.toml — this repository. Commit it; it is reviewed like source.
#
# Values were serialized from the settings.json beside it, not
# transcribed, so nothing here can disagree with what stella read.
# Comments you add below survive every future write.
#
# The original settings.json was NOT deleted. Check this file, then
# remove the JSON — until you do, stella reads this one and says so.
#
# Full reference: stella.example.toml at the repository root — every section,
# commented, copy-pasteable. (It used to point at
# docs/spec/config-system/stella.today.toml, which is a design-era artifact and
# was missing five sections outright.)

[meta]
schema_version = 1
scope = "project"

[agents]
default_model = "openrouter/moonshotai/kimi-k3"
auto_mode = "off"
effort_auto = "off"
reasoning_auto = "off"

[agents.default]
effort = "xhigh"
reasoning = "on"

# ── Retired by #3908 ─────────────────────────────────────────────────────────
#
# This file used to carry `pipeline_verifier_model`, `pipeline_worker_model`
# and `pipeline_triage_model`, plus `[agents.worker]`, `[agents.verifier]` and
# `[agents.triage]`. They were pins on the staged pipeline deleted in #3865,
# and by the time that crate left the workspace they steered nothing — stella
# now recognizes them, ignores them, and names them on load.
#
# `[agents.default]` above is unchanged, so what this repository actually runs
# is exactly what it ran before. The two prompts below are kept verbatim rather
# than dropped, because they are the part a migration cannot regenerate — but
# note that NEITHER was reaching the step loop: the worker prompt was read only
# by the pipeline's system-prompt builder, and the verifier's only by a stage
# that no longer exists.
#
# To bring one back deliberately:
#   - as the session's own instruction, set `prompt` under `[agents.default]`;
#   - as a participant in an installed plugin's process, assign that plugin's
#     seat a model under `[seats]` and give the plugin its own prompt.
#
# worker:
#   "do not overthink how to solve problems - if you have multiple approaches
#    you are considering don't waste time deliberating and reasoning choose an
#    approach and know if it fails you can always go back and try the other
#    approache(s)"
#
# verifier:
#   "you are not to solve for completing the task - you are only verifying the
#    task was completed by executing a test that must fail in the environment
#    and pass with the workers code implemented to solve for the task."
