[package]
name = "stella-tui"
description = "ratatui terminal UI for stella: the single-session event-log REPL (streaming render, diff view + files-touched panel, scope-review card, live-budget HUD) and the multi-agent Command Deck it grew into (session · agents · traces · graph · files · skills · mcp · issues · settings). Per-session state is folded exclusively from AgentEvents; the deck's management tabs layer labeled out-of-band snapshots on top."
