[package]
name = "stella-runtime"
description = "The construction sequence, once: provider, tool registry, stores, MCP, system prompt, budget and engine ports assembled from explicit inputs into a SessionRuntime any surface can drive — the CLI, the serve sidecar, or a test."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
stella-protocol = { path = "../stella-protocol" }
stella-core = { path = "../stella-core" }
stella-model = { path = "../stella-model" }
stella-tools = { path = "../stella-tools" }
stella-store = { path = "../stella-store" }
stella-mcp = { path = "../stella-mcp" }
stella-context = { path = "../stella-context" }
stella-graph = { path = "../stella-graph" }
stella-pipeline = { path = "../stella-pipeline" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync"] }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "test-util"] }
