[package]
name = "stella-model"
description = "Provider trait + adapters (Z.ai/GLM 5.2, Anthropic, OpenAI, Gemini direct, Vertex, Bedrock, OpenAI-compatible gateways). Owns per-vendor SSE parsing, tool-call dialect translation, request signing, credential resolution, and model-catalog lookups."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
stella-protocol = { path = "../stella-protocol" }
# The single implementation of `~/.stella` resolution, so `credentials.toml`
# moves with `STELLA_HOME` like every other user-tier file (#2178). A leaf with
# an empty `[dependencies]` block, which is what makes it depend-able here.
stella-home = { path = "../stella-home" }
# The single "is a human present to answer?" derivation (#3036) — the
# credential prompt's interactive gate reads it rather than re-deriving the
# fact from only stdin, which `stella-cli`'s approval prompts already
# learned is not enough on its own.
stella-tty = { path = "../stella-tty" }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
reqwest.workspace = true
futures-util.workspace = true
toml.workspace = true
rpassword.workspace = true
zeroize.workspace = true
hmac.workspace = true
sha2.workspace = true
# Staging an inline video payload for the frame sampler (#4800): `ffmpeg` can
# only seek in a file, and a pasted attachment has bytes but no path. Promoted
# from a dev-dependency rather than hand-rolling the write, because the parts
# that are easy to get wrong — an owner-only mode, a name nothing else can
# collide with, and deletion on every path including a panic — are exactly
# what this crate already does correctly.
tempfile.workspace = true

# `tests/credential_prompt_dev_tty.rs`'s fixture binary — prints
# `TerminalPrompt.can_prompt(true)` from inside a real pseudo-terminal the
# test harness constructs, which is the only way to observe `/dev/tty`
# reachability (rather than `stdin`/`stdout`) without risking the whole
# suite blocking on a real keystroke. `tests/` locate it with
# `env!("CARGO_BIN_EXE_tty-probe")`; cargo builds it for them.
[[bin]]
name = "tty-probe"
path = "tests/fixtures/tty_probe.rs"

# A test fixture, never a shipped surface — keep it out of dist.
[package.metadata.dist]
dist = false

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock.workspace = true
# `tests/credential_prompt_dev_tty.rs` hand-rolls its pty harness on
# `libc::openpty`/`setsid`/`TIOCSCTTY` — the same construction
# `stella-tui`'s `tests/deck_pty_smoke.rs` uses, already a workspace
# dependency; integration tests only see dev-dependencies.
libc.workspace = true
