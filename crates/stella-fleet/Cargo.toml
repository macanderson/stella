[package]
name = "stella-fleet"
# A worktree per task is the crate's actual contract (see `plan::Isolation` and
# ADR 0027): every worker gets a tree of its own, and a plan that wants one
# root under cooperative claims names the shared tree itself.
description = "Multi-agent fleet: planner DAG, a git worktree per task with an opt-in shared tree, SQLite commit ledger, PR/CI monitor with capped deferred waits."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
stella-autonomy = { path = "../stella-autonomy" }
stella-protocol = { path = "../stella-protocol" }
stella-core = { path = "../stella-core" }
stella-store = { path = "../stella-store" }
stella-tools = { path = "../stella-tools" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
rusqlite.workspace = true
futures-util.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
# `test-util` gives the task-timeout tests paused time (start_paused), so a
# 60s stop-grace elapses instantly instead of stalling the suite.
tokio = { workspace = true, features = ["test-util"] }
