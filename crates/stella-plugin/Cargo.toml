[package]
name = "stella-plugin"
description = "The plugin manifest: parsing and validation of a plugin's declared say in the turn loop — participation grades, hook grants, requirements, oracle, and subloop — pure functions over borrowed text, no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Near-leaf, deliberately: the engine never learns plugins exist (#3245 — the
# host binds the grants to the engine's gates), so this crate must not depend
# on stella-core, and stella-core must never depend on it.
#
# stella-protocol is the one workspace crate it does take, and only because
# that direction is what *removes* a hand-kept mirror rather than adding an
# edge between the two crates the mirror spanned (#3310): `HookEvent` is a
# vocabulary this crate and stella-core both spell, and keeping two copies
# identical was a review obligation with nothing red when it was missed.
# Sharing one type through the crate underneath both is invariant #1 applied
# literally. stella-protocol is types-only with no I/O, so it costs this crate
# no behaviour — but it is a real edge, so a *second* workspace dependency
# here wants the same argument made again, not this one cited.
[dependencies]
serde.workspace = true
# The wire envelope's own decoder (#3500). `{"point": …, "body": …}` is
# adjacently tagged, and serde's derived reader for that shape ignores every
# other key — so the host accepted garbage while every manifest table refused
# it. Refusing an unknown envelope key needs the body held while the point is
# read, and serde's own buffer for that is private; `serde_json::Value` is the
# supported one. It is a real edge for a near-leaf crate, so note what it is
# not: this crate still performs no I/O, and it was already a dev-dependency
# here (invariant #4's round-trip tests), so the lockfile and the license
# allow-list are unchanged by the move.
serde_json.workspace = true
stella-protocol = { path = "../stella-protocol" }
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
# The wrapper resolver's claim is universal — "a manifest that loads resolves
# for every set of signal values" — so it is asserted over generated manifests
# rather than a handful of examples, matching how the rest of the workspace
# tests pure engine logic (AGENTS.md § Testing approach). Dev-only: it is not
# a workspace dependency of this near-leaf crate.
proptest.workspace = true
