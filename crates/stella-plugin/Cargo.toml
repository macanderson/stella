[package]
name = "stella-plugin"
description = "The plugin manifest and the wrapper socket's wire contract: parsing, validation, and consent rendering for what a plugin declares and what it ships — pure functions over borrowed text, no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# OFF by default, exactly as stella-protocol's feature of the same name: it
# gates `export-wrapper-wire`, which writes docs/wire/wrapper.{wire.json,
# schema.json}, so a default `cargo build -p stella-plugin` — i.e. every build
# of the shipping binary — never compiles the exporter, the corpus it prints,
# or schemars.
schema = ["dep:schemars", "stella-protocol/schema"]

# Near-leaf, deliberately: the engine never learns plugins exist (#3245 — the
# host binds the grants to the engine's gates), so this crate must not depend
# on stella-core, and stella-core must never depend on it.
#
# stella-protocol is the one workspace crate it does take, and only because
# that direction is what *removes* a hand-kept mirror rather than adding an
# edge between the two crates the mirror spanned (#3310): `HookEvent` is a
# vocabulary this crate and stella-core both spell, and keeping two copies
# identical was a review obligation with nothing red when it was missed.
# Sharing one type through the crate underneath both is invariant #1 applied
# literally. stella-protocol is types-only with no I/O, so it costs this crate
# no behaviour — but it is a real edge, so a *second* workspace dependency
# here wants the same argument made again, not this one cited.
[dependencies]
serde.workspace = true
# The wire envelope's own decoder (#3500). `{"point": …, "body": …}` is
# adjacently tagged, and serde's derived reader for that shape ignores every
# other key — so the host accepted garbage while every manifest table refused
# it. Refusing an unknown envelope key needs the body held while the point is
# read, and serde's own buffer for that is private; `serde_json::Value` is the
# supported one. It is a real edge for a near-leaf crate, so note what it is
# not: this crate still performs no I/O, and it was already a dev-dependency
# here (invariant #4's round-trip tests), so the lockfile and the license
# allow-list are unchanged by the move.
serde_json.workspace = true
# The second workspace edge this manifest's own comment asked to be argued
# again rather than to cite the first one (#3532). It is a different kind of
# edge from stella-protocol's:
#
#   * it is **optional and off by default**, so no build of the shipping binary
#     compiles it — `[[bin]] required-features` keeps the only consumer behind
#     the same switch. A default `cargo tree -p stella-plugin` is unchanged;
#   * it is already a workspace dependency (`stella-protocol` and `stella-serve`
#     both take it under a `schema` feature of their own), so it adds nothing to
#     the license allow-list and no new vendor to audit;
#   * it removes a copy rather than adding one, which is the test the
#     stella-protocol edge was admitted on. `wrapper.wire.json` is a corpus
#     because a `JsonSchema` impl can only be written where the type is defined
#     and `wire.rs` was held elsewhere at the time; the alternative to this
#     dependency is a hand-written schema beside the types, which is the second
#     copy of the contract docs/wire/ exists to prevent.
schemars = { workspace = true, optional = true }
stella-protocol = { path = "../stella-protocol" }
thiserror.workspace = true
toml.workspace = true

# The wrapper socket's wire-contract exporter. `required-features` keeps it out
# of a default build entirely, so the binary only exists when someone asks for
# the contract.
[[bin]]
name = "export-wrapper-wire"
path = "src/bin/export_wrapper_wire.rs"
required-features = ["schema"]

[dev-dependencies]
# The wrapper resolver's claim is universal — "a manifest that loads resolves
# for every set of signal values" — so it is asserted over generated manifests
# rather than a handful of examples, matching how the rest of the workspace
# tests pure engine logic (AGENTS.md § Testing approach). Dev-only: it is not
# a workspace dependency of this near-leaf crate.
proptest.workspace = true
