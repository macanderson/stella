[package]
name = "stella-diff"
description = "A pure line-oriented unified diff — git's exact hunk shape, zero dependencies. The shared differ behind `stella inspect --diff` and the Observatory's prompt-diff view."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Deliberately empty by default: this crate is pure functions over borrowed
# strings, the `stella-home` shape (#1139) — which is what lets
# `stella-observatory` (which links almost nothing) and `stella-cli` share one
# differ instead of keeping acknowledged copies (#1511).
#
# `json` is opt-in and off by default, so a caller that only wants the differ
# still links nothing. It exists because the alternative was worse: three
# crates were about to hand-serialize the same hunk shape for the same
# dashboard renderer, which is the acknowledged copy this crate was extracted
# to end.
[features]
json = ["dep:serde_json"]

[dependencies]
serde_json = { workspace = true, optional = true }
