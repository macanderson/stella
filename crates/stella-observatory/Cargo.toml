[package]
name = "stella-observatory"
description = "Local telemetry dashboard: a loopback-only web view over the workspace's .stella stores — executions, tokens, cost, tools, memory, rules, reflections, skills, MCP, the code graph, the settings scope chain, and every other stella project on the machine. Read-only; serves embedded assets; no outbound traffic ever."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# `~/.stella` resolution, shared rather than copied (#1139). This crate used to
# carry its own `data_dir()` with a comment asking readers to keep it equal to
# `stella_store::usage::data_dir` by hand. `stella-home` has no dependencies at
# all, so depending on it costs none of the isolation the dev-dependency note
# below protects — it is path arithmetic over env vars and opens nothing.
stella-home = { path = "../stella-home" }
# The self-driving fold and its signal thresholds, shared rather than copied
# (#1613). This crate carried its own `fold_runs` and `self_improvement`,
# written when the only other implementation was shell — and the two had
# already drifted: the dashboard and `stella self-driving metrics` disagreed about
# whether the loop was NOISY for every odd cycle count.
#
# It does NOT weaken the isolation the dev-dependency note below protects.
# That rule is about the WRITE path: the observatory re-reads artifacts instead
# of linking the crates that produce them, which is why it opens store.db with
# rusqlite rather than linking stella-store. `stella-core::self_driving` is the
# opposite shape — pure decision logic over owned data, no I/O by invariant 2,
# with the clock passed in as a parameter. Linking it opens nothing.
stella-core = { path = "../stella-core" }
# One syscall: `kill(pid, 0)` in `sessions::pid_alive`, the read-time liveness
# probe the session registry's readers all share (an acknowledged copy of
# `stella_store::sessions::pid_alive` — see that fn's doc). Probing a pid
# opens nothing and writes nothing, so the observer boundary holds.
libc.workspace = true
rusqlite.workspace = true
serde_json = { workspace = true }
# Re-hash exploration-map manifests for the /api/explorations freshness
# verdicts (the observatory re-reads artifacts rather than linking the
# stella crates that write them — same isolation as its store.db access).
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }
toml.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["net", "rt-multi-thread"] }
# The schema-drift gate (#827) only. This crate must NOT link stella-store in
# production: `Store::open` runs migrations, migrations are writes, and an
# observer must never mutate what it observes — which is exactly why the SQL
# here is hand-written and every file opens SQLITE_OPEN_READ_ONLY. As a dev
# dependency it buys the one thing that isolation cost: a test can build the
# database through the real migration path and prove these queries still
# resolve against it, so a renamed column fails at `cargo test` rather than
# on a user's dashboard. See tests/schema_conformance.rs.
stella-store = { path = "../stella-store" }
stella-protocol = { path = "../stella-protocol" }
