<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none" role="img" aria-label="stella"><defs><linearGradient id="stellaNebula" x1="10" y1="26" x2="86" y2="70" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#7C5CFF"/><stop offset="1" stop-color="#1FD8E6"/></linearGradient></defs>
  <!-- The comet logomark, from docs/brand/logo/svg/logomark-color.svg
       (nebula kit v2.0). The Nebula sweep #7C5CFF -> #1FD8E6 on transparent:
