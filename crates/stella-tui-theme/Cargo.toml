[package]
name = "stella-tui-theme"
description = "The stella TUI v2 palette: fourteen tokens, the hue clamp that keeps gold from drifting orange and the grays from drifting warm, the glyph vocabulary every panel shares, the `stella*` wordmark, and the 16-color fallback for terminals without truecolor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# `ratatui` alone, for `Color`, `Style` and `Span`. This crate is a leaf by
# contract — the stella-tty / stella-diff shape (#3036, #1511): every surface
# that paints a v2 cell depends on it, so it may depend on nothing that could
# ever want to paint one. A palette that pulls in the widgets it colours is a
# cycle waiting for its second consumer.
[dependencies]
ratatui.workspace = true
