[package]
name = "stella-protocol"
description = "Serde types + port traits shared by every stella-cli crate: agent events, tool schemas, attachments, model roles, provider request/response envelopes, the Provider trait. Zero I/O of its own — the stability contract of the workspace."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# OFF by default, and that is the point: `schema` adds the `schemars` derives
# that let `export-wire-schema` emit docs/wire/agentevent.schema.json and its
# TypeScript twin. A default `cargo build -p stella-protocol` — i.e. every
# build of the shipping binary — never compiles schemars, so describing the
# wire format costs the product nothing.
schema = ["dep:schemars"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
schemars = { workspace = true, optional = true }
# `hash::record_hash`: two crates hash with it, and `context_event.rs`
# pins the same bytes one file over.
sha2.workspace = true
serde_json_canonicalizer.workspace = true

# The wire-contract exporter. `required-features` keeps it out of a default
# build entirely, so the binary only exists when someone asks for the schema.
[[bin]]
name = "export-wire-schema"
path = "src/bin/export_wire_schema.rs"
required-features = ["schema"]

[dev-dependencies]
serde_json.workspace = true
