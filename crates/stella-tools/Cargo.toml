[package]
name = "stella-tools"
description = "Built-in agent tools — one shell, file CRUD, one unified code search, the sub-agent spawn tool, the session task board, the session scratch state plane, and the environment report — plus the tool mechanisms: the registry and its dispatch gates, the custom script-tool loader, the tool foundry, tool policy, skill grants, and the extension hook runner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
stella-protocol = { path = "../stella-protocol" }
stella-core = { path = "../stella-core" }
# The tool-foundry adoption ledger (`foundry_gate` re-exports
# `stella_store::AdoptedTool`) — the one persistence type this crate reads.
stella-store = { path = "../stella-store" }
# The single implementation of `~/.stella` resolution, so the user-global
# custom-tool directory moves with `STELLA_HOME` like every other user-tier
# file (#2178).
stella-home = { path = "../stella-home" }
# The code-graph index the `search` tool ranks over: symbols, callers,
# imports, and the stored file/chunk vectors.
stella-graph = { path = "../stella-graph" }
# The embedding seam plus its HTTP backend — `search`'s semantic rung. This
# crate is where the network is allowed to live: `stella-graph` stores vectors
# and ranks them, and never learns what produced them (invariant 1).
stella-embed = { path = "../stella-embed", features = ["http"] }
# The differ `write_file` and `edit_file` run over the bytes they read and the
# bytes they wrote (`own_change`), so a mutation the work-tree measurement
# cannot see — a gitignored path, a workspace with no journal — still renders
# its diff. A leaf with no dependencies, so linking it costs nothing (#1511).
stella-diff = { path = "../stella-diff" }
# `${plugin_dir}` — the one substitution a package's `tools/*.toml` shares with
# a plugin's `[runtime].argv`. The convention is specified in `stella-plugin`
# and carried out by whichever host knows where the package was installed, so
# the expander belongs there and the literal exists once (#4301). A near-leaf
# (stella-protocol only) and pure, so this edge costs this crate no behaviour;
# the engine still never learns plugins exist, because `stella-core` does not
# take it.
stella-plugin = { path = "../stella-plugin" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
libc.workspace = true
# Foundry manifest/script digests (`foundry_gate::digest`).
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true
# `buffer_unordered` — the chunk embedding pass keeps a bounded number of
# backend requests in flight instead of one serial round trip per file (#4144).
# Promoted from a dev-dependency, where it was already carried for `poll!`: the
# cancellation-safety witness drops a tool future mid-await, the way an elapsed
# dispatch timeout does. Tests see a normal dependency, so the witness keeps
# compiling with no second entry below.
futures-util.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "fs", "io-util"] }
# Property tests for foundry authorship and the approval precedence ladder.
proptest.workspace = true
