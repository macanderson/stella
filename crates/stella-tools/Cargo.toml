[package]
name = "stella-tools"
description = "Built-in agent tools — the sub-agent spawn tool, the session task board, the session scratch state plane, and the environment report — plus the tool mechanisms: the registry and its dispatch gates, the custom script-tool loader, the tool foundry, tool policy, skill grants, and the extension hook runner."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
stella-protocol = { path = "../stella-protocol" }
stella-core = { path = "../stella-core" }
# The tool-foundry adoption ledger (`foundry_gate` re-exports
# `stella_store::AdoptedTool`) — the one persistence type this crate reads.
stella-store = { path = "../stella-store" }
# The single implementation of `~/.stella` resolution, so the user-global
# custom-tool directory moves with `STELLA_HOME` like every other user-tier
# file (#2178).
stella-home = { path = "../stella-home" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
libc.workspace = true
# Foundry manifest/script digests (`foundry_gate::digest`).
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
toml.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "process", "fs", "io-util"] }
# Property tests for foundry authorship and the approval precedence ladder.
proptest.workspace = true
