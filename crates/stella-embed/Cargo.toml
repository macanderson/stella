[package]
name = "stella-embed"
description = "The embedding seam: the `Embedder` trait, the fingerprint that stamps every stored vector, pure cosine ranking, and the two backends — an offline hashing projection and an OpenAI-shaped HTTP embedder."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# A leaf: no workspace crate appears here, which is what lets `stella-context`
# (the retrieval plane) and `stella-graph` (the code graph) share one seam and
# one vector space without either linking the other. The `stella-diff` /
# `stella-home` precedent (#1511, #1139).
[dependencies]
serde.workspace = true
thiserror.workspace = true
async-trait.workspace = true
# The HTTP backend only. Off by default so `stella-context` and `stella-graph`
# pay nothing for a transport they do not use; `stella-tools` turns it on.
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[features]
default = []
http = ["dep:reqwest", "dep:serde_json"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
proptest.workspace = true
wiremock.workspace = true
