[package]
name = "stella-tui"
description = "ratatui terminal UI for stella: the single-session event-log REPL (streaming render, diff view + files-touched panel, scope-review card, live-budget HUD) and the multi-agent Command Deck it grew into (session · agents · traces · graph · files · skills · mcp · issues · settings). Per-session state is folded exclusively from AgentEvents; the deck's management tabs layer labeled out-of-band snapshots on top."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
stella-protocol = { path = "../stella-protocol" }
stella-tools = { path = "../stella-tools" }
# Only for `TerminalHold` — while this crate owns the screen, the diagnostic
# plane's stderr sink must not write to it (see `term::TerminalGuard`).
# stella-diag is a leaf crate by construction, so this adds no cycle.
stella-diag = { path = "../stella-diag" }
# Only for `view` — the shared "how much of a diff is shown, and which part"
# policy, so the deck, the plain surface, the Observatory and an export all
# elide one edit identically. Also a dependency-free leaf, so no cycle.
stella-diff = { path = "../stella-diff" }
# The shared transcript information model. Taken for the two policies the deck
# and the export surfaces must not answer differently: how much of a tool
# result a collapsed fold shows (`digest::PREVIEW_LINES`) and how a JSON body
# is lexed for colouring (`syntax::json_runs`). Both used to live here, which
# meant the Observatory and an exported transcript got neither (#3644).
#
# The edge goes this way round because `stella-transcript` is a near-leaf by
# contract — its only workspace dependency is `stella-diff`, which this crate
# already carries — so the shared policy had to move down rather than the
# renderer reach up. It is also the direction #3578 wants: rendering the deck's
# own session view through `stella_transcript::grid`.
#
# This crate also owns the fold from `AgentEvent` into `stella_transcript::Run`
# (`transcript_build`), for the same near-leaf reason: the model must not learn
# about the protocol, so the adapter lives on this side of the edge.
stella-transcript = { path = "../stella-transcript" }
# The palette, glyph vocabulary and wordmark (`src/views/`). A leaf whose only
# dependency is `ratatui`, so it costs this crate nothing and costs every other
# consumer nothing either.
stella-tui-theme = { path = "../stella-tui-theme" }
arboard.workspace = true
png.workspace = true
serde_json.workspace = true
libc.workspace = true
tokio.workspace = true
ratatui.workspace = true
unicode-width.workspace = true
crossterm.workspace = true
sysinfo.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
# The colour-bearing goldens only (`tests/status_bar_goldens.rs`). The deck's
# whole-frame golden harness stays hand-rolled and style-stripping; see that
# suite's module doc for why, and `tests/status_bar_goldens.rs` for why a
# claim about metal cannot accept the same blindness.
insta.workspace = true
# tests/deck_pty_smoke.rs hand-rolls its pty harness on openpty — already a
# direct dependency above; integration tests only see dev-dependencies.
libc.workspace = true
