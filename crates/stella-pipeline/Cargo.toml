[package]
name = "stella-pipeline"
# Keep the stage list in step with the one in `src/lib.rs`; it is the first
# thing a reader sees on the crate's registry page.
description = "evaluate -> enhance -> route -> execute -> witness -> verify -> verdict -> revise orchestration; triage fast paths; scope-review gate; flip-oracle + deterministic verification ladder; evidence-based verifier; best-of-N."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
stella-protocol = { path = "../stella-protocol" }
stella-core = { path = "../stella-core" }
# The wrapper manifest (`src/variant.rs`, #3408): this crate is the HOST half —
# it gathers the facts a manifest's conditions read and consults the resolved
# stage order. The edge only goes this way. `stella-plugin` is a near-leaf that
# must never depend on the engine, and `stella-core` must never depend on it
# (invariant 1: the engine never learns plugins exist), so the orchestration
# plane is the lowest crate that may hold this dependency.
stella-plugin = { path = "../stella-plugin" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
async-trait.workspace = true
futures-util.workspace = true
# Failure fingerprints (witness::airlock): the same SHA-256 the workspace already
# uses for record_hash, so one hashing primitive covers the tree.
sha2.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
