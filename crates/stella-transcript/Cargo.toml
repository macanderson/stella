[package]
name = "stella-transcript"
description = "The shared transcript information model and its two renderers — jet-black HTML for the Observatory and a character grid for the TUI. Pure functions over owned data; no I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Near-leaf by contract: one workspace edge, to the differ, so a file-mutation
# call renders the same hunks the Observatory's prompt-diff view already shows
# rather than a second acknowledged copy (the `stella-diff` extraction argument
# in #1511, applied a second time). Nothing here reads a file, spawns a
# process, or touches the network — invariant #2.
[dependencies]
stella-diff = { path = "../stella-diff" }
serde = { workspace = true }
# The grid renderer pads every row to constant gutter widths, and a "width" a
# terminal disagrees with is not a width at all: one CJK character or emoji
# occupies two columns, so counting `chars()` under-counts it and every column
# to its right walks. `stella-tui` already carries this crate for exactly that
# reason, so it is resident in the tree rather than new supply chain, and it is
# a pure table lookup over `&str` — no I/O, no allocation, invariant #2 intact.
unicode-width = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
proptest = { workspace = true }
