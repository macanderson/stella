#
#   python3 ~/.stella/bin/mk-command-toml.py \
#     .stella/commands/triage-sweep.md .stella/commands/triage-sweep.toml
#
# The .md and .toml are ONE command in two spellings, and stella parses both
# through a single field-extraction path (`CommandDef`). Editing the markdown
# and regenerating is what stops the two prompt bodies from drifting apart.
#
