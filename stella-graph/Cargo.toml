[package]
name = "stella-graph"
description = "Code-graph indexer: tree-sitter parsers (native), symbol + import-edge extraction, incremental re-index on file change. Implemented AS a built-in CGP provider; recall reaches it through the CGP host, and it owns codegraph.db independently of stella-context."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
contextgraph-types.workspace = true
# For the workspace's single durable-write + schema-version contract
# (`stella_store::durable`, #617) — one implementation of temp + fsync +
# rename, not one per crate.
stella-store = { path = "../stella-store" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
rusqlite.workspace = true
sha2.workspace = true
notify.workspace = true
tree-sitter.workspace = true
# Grammars are optional (#1268): each is C compiled through `cc`, and an
# unconditional set means every build of the workspace pays for every language
# whether or not the tree being indexed contains one file in it. `default`
# below keeps the full set, so nothing changes for anyone who does not opt out.
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-sequel = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-php = { workspace = true, optional = true }
toml.workspace = true

[features]
# Every grammar, which is what the shipping binary wants: a general-purpose
# agent meets arbitrary repositories, and a language it cannot index is a
# capability hole the user did not ask for. The features exist so a *consumer*
# embedding stella-graph for one known stack does not pay for the other eight.
default = [
  "lang-rust",
  "lang-python",
  "lang-typescript",
  "lang-javascript",
  "lang-sql",
  "lang-go",
  "lang-java",
  "lang-c",
  "lang-php",
]
lang-rust = ["dep:tree-sitter-rust"]
lang-python = ["dep:tree-sitter-python"]
# Covers both `TypeScript` and `Tsx` — one crate, two grammars.
lang-typescript = ["dep:tree-sitter-typescript"]
lang-javascript = ["dep:tree-sitter-javascript"]
lang-sql = ["dep:tree-sitter-sequel"]
lang-go = ["dep:tree-sitter-go"]
lang-java = ["dep:tree-sitter-java"]
lang-c = ["dep:tree-sitter-c"]
lang-php = ["dep:tree-sitter-php"]

[dev-dependencies]
tempfile.workspace = true
# `test-util` enables tokio's paused clock (`start_paused`), which makes the
# live-index pipeline tests deterministic: the debounce window auto-advances
# only while every task is idle, so a burst can never be split by scheduling.
tokio = { workspace = true, features = ["test-util"] }
