# cargo-deny configuration — https://embarkstudios.github.io/cargo-deny/
#
# CI runs `cargo deny check advisories bans sources licenses` as a REAL gate
# (no `|| true`).
#
# `licenses` became a hard gate when the workspace moved to AGPL-3.0-only.
# Under the old MIT/Apache posture a stray oddly-licensed dependency was a
# tidiness problem; under the AGPL it is a correctness problem in two
# directions. A dependency carrying ANY further restriction (a non-commercial
# clause, a field-of-use limit, no license at all) cannot legally be
# redistributed as part of an AGPL combined work, AND it blocks the commercial
# license track in LICENSING.md — we cannot sell what we do not have the right
# to sublicense. This is not hypothetical: `ratatui-comfy-tabs` was a
# source-available, non-commercial-only crate that sat in the tree undetected
# precisely because nothing gated on licenses.
#
# Only version-stable lint-level keys are set here so the config parses across
# cargo-deny releases; `cargo audit` (a separate CI step) is the primary
# advisory gate, and defaults already fail the build on a known vulnerability.

[licenses]
# Every license here is compatible with distributing the combined work under
# AGPL-3.0-only, and none of them restricts sublicensing under commercial terms.
#
# On the two non-obvious entries:
# - MPL-2.0 is file-scoped copyleft and its §3.3 explicitly authorises
#   distributing a larger work under a "Secondary License" (GPL/LGPL/AGPL), so
#   it composes cleanly here. MPL'd files themselves stay MPL.
# - BSL-1.0 (Boost) is permissive and GPL-compatible, despite the confusing
#   name — it is NOT the Business Source License (BUSL-1.1), which would be
#   disqualifying.
#
# ADDING TO THIS LIST IS A LICENSING DECISION, NOT A BUILD FIX. If cargo-deny
# rejects a new dependency, the default answer is to drop the dependency. Any
# license with a non-commercial clause, a field-of-use restriction, or an
# "all rights reserved" fallback must never be added — see LICENSING.md.
allow = [
  "AGPL-3.0-only",       # the workspace's own crates
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "BSL-1.0",             # Boost, permissive — not BUSL
  "MPL-2.0",             # see §3.3 note above
  "Unlicense",
  "CC0-1.0",
  "0BSD",
  "WTFPL",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CDLA-Permissive-2.0",
]
# `unused-allowed-license` fires when an entry in `allow` above matches no
# license actually used in the dependency graph. "allow" keeps that quiet:
# the list is a curated licensing policy, and an entry may legitimately
# outlive the dependency that motivated it.
unused-allowed-license = "allow"
confidence-threshold = 0.9

[licenses.private]
# Workspace members are `publish = false` and carry the workspace AGPL license;
# they do not need to satisfy the allow-list against themselves.
ignore = true

[advisories]
# A yanked crate is a hard failure. Crates are most often yanked *because*
# something is wrong with them — a broken build, a semver violation, or a
# security problem that has not yet been written up as a RUSTSEC advisory — and
# this workspace ships a signed binary that executes model-directed code, so
# "we are shipping a version its own author withdrew" is something to learn
# before a release, not after. The cost is that an upstream yank can turn CI
# red with no local change; the fix in that case is to bump the dependency (or,
# in a genuine emergency, set this back to "warn" for the one PR).
yanked = "deny"
# Report unmaintained-crate advisories for the WHOLE graph, not just the
# workspace's own direct dependencies (cargo-deny's default is "workspace").
# The unmaintained crates that actually reach a binary are almost always
# transitive — the last one here was `fxhash`, four levels down under
# `scraper`→`selectors` — so the default setting would not have seen it.
unmaintained = "all"
# No advisories are currently suppressed, and the default answer to a new one
# is to fix or drop the dependency rather than add an entry here.
#
# Both former entries are gone because the crates they covered left the tree,
# not because the advisories were re-judged: RUSTSEC-2024-0436 (`paste`) went
# with the `ratatui-comfy-tabs` removal, and RUSTSEC-2025-0057 (`fxhash`,
# unmaintained) went when `selectors` moved to `rustc-hash` — verified absent
# from Cargo.lock and from `cargo tree`. A stale entry is not free: cargo-deny
# warns on an ignore that matches nothing, and a suppression left lying around
# silently re-arms the moment the crate returns by another path.
ignore = []

[bans]
# Multiple versions of the same crate is a warning, not a failure. Every
# duplicate in the tree today has been traced to a transitive edge the
# workspace cannot flatten from here, and the honest way to record that is a
# warning plus this inventory — NOT a list of `skip` entries, which would
# suppress these and any future duplicate alike:
#
#   base64    0.22 (reqwest, hyper-util, wiremock)  vs 0.23 (workspace)
#   sha2      0.10 (contextgraph-host, pinned rev)  vs 0.11 (workspace)
#   rand      0.9  (proptest, dev-only)             vs 0.10 (workspace)
#   getrandom 0.2  (ring, under rustls)             vs 0.3/0.4
#   itertools 0.14 (ratatui-core)                   vs 0.15
#   syn       2    (clap_derive, darling, cssparser) vs 3 (async-trait,
#                  thiserror-impl) — an ecosystem-wide transition, not ours
#
# plus the digest/block-buffer/crypto-common/cpufeatures cluster, which tracks
# the sha2 0.10-vs-0.11 split above. Re-audit this list before tightening to
# "deny"; a duplicate that is NOT on it is a real regression worth chasing.
multiple-versions = "warn"
wildcards = "warn"

[sources]
# Every dependency must come from a known registry (crates.io by default). An
# unknown registry or an unvetted git source fails the build.
unknown-registry = "deny"
unknown-git = "deny"
# Vetted git sources. The Context Graph Protocol crates (contextgraph-types,
# contextgraph-host) live in their own repo and are consumed directly at a
# pinned rev until they are published to crates.io.
allow-git = ["https://github.com/macanderson/context-graph-protocol"]
