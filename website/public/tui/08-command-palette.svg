<text x="40" y="302" font-size="11" fill="#474C56">browse — relevant now, the domain groups, then recent · anchored, opening upward</text>
<!-- Frame 2: a typed query is one flat ranked list, no section headings. -->
<rect x="0" y="330" width="680" height="254" rx="6" fill="#090A0D" stroke="#222529" stroke-width="1"/>
<rect x="40" y="346" width="600" height="148" fill="#0F1115" stroke="#40444A" stroke-width="1"/>
<text x="54" y="366" font-size="11" fill="#D4AF37">/ commands</text>
<text x="150" y="366" font-size="11" fill="#474C56">5 of 31 · fuzzy</text>
<text x="420" y="366" font-size="11" fill="#474C56">↑↓ move · ↵ run · ⇥ args · esc</text>
<line x1="40" y1="374" x2="640" y2="374" stroke="#222529" stroke-width="1"/>
<rect x="41" y="382" width="598" height="18" fill="#222529"/>
<text x="54" y="396" font-size="11" fill="#D4AF37">/in</text>
