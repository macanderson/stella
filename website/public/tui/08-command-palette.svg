<text x="74" y="462" font-size="11" fill="#9A9FA6">box</text>
<text x="180" y="462" font-size="11" fill="#737882">notifications — messages persist until read</text>
<text x="516" y="462" font-size="11" fill="#E3C45B">3 unread</text>
