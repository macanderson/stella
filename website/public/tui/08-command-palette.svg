<text x="107" y="484" font-size="11" fill="#9A9FA6">s</text>
<text x="180" y="484" font-size="11" fill="#737882">every stella session on this machine</text>
<text x="40" y="522" font-size="12" fill="#D4AF37" font-weight="500">&gt;&gt;&gt;</text>
<text x="70" y="522" font-size="12" fill="#FCFCFE">/in</text>
<rect x="93" y="512" width="7" height="13" fill="#FCFCFE"/>
<text x="40" y="550" font-size="11" fill="#474C56">a typed query is one flat ranked list · no section headings · scattered letters light gold</text>
