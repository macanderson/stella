[workspace]
resolver = "3"
members = [
  "crates/stella-diag",
  "crates/stella-home",
  "crates/stella-protocol",
  "crates/stella-core",
  "crates/stella-model",
  "crates/stella-store",
  "crates/stella-tools",
  "crates/stella-context",
  "crates/stella-graph",
  "crates/stella-pipeline",
  "crates/stella-mcp",
  "crates/stella-media",
  "crates/stella-engine",
  "crates/stella-runtime",
  "crates/stella-fleet",
  "crates/stella-observatory",
  "crates/stella-serve",
  "crates/stella-parity",
  "crates/stella-tui",
  "crates/stella-cli",
  "bench/loop-bench",
  "bench/request-bench",
]

[workspace.package]
version = "0.6.100"
edition = "2024"
rust-version = "1.90"
license = "AGPL-3.0-only"
repository = "https://github.com/macanderson/stella"
homepage = "https://stella.oxagen.sh"
publish = false

[workspace.dependencies]
# Context Graph Protocol — the wire types, host runtime, conformance suite, and
# execution-trace vocabulary stella speaks (#819). Declared ONCE here so a
# version bump is a one-line edit rather than six scattered across three member
# manifests, which is how these drifted onto a git rev in the first place.
#
# These were `{ git = ..., rev = ... }` until #819. That pin named a commit
# living on a history line this repository's upstream had since re-rooted away
# from: it was on no branch and no PR, reachable only by raw SHA, and eligible
# for garbage collection — a cold cargo cache away from breaking every build.
# Registry versions get us a reviewable release, a checksum in Cargo.lock, and
# an audit trail (`cargo audit`/`cargo vet` cannot see a git rev).
#
# `contextgraph-trace` is SKETCH STAGE and deliberately exempt from the
# protocol's stability promise — its journal wire format may change in any 0.x
# release. Gate behaviour on its `TRACE_FORMAT` constant, not on this version.
# Hence exact `=` requirements: a silent minor bump here would change a wire
# format `stella arena` writes to disk.
contextgraph-types = "=0.1.2"
contextgraph-host = "=0.1.2"
contextgraph-trace = "=0.1.2"
contextgraph-conformance = "=0.1.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# RFC 8785 JSON Canonicalization Scheme — pinned to the SAME version the Context
# Graph Protocol crates use (contextgraph-conformance), so stella's record_hash
# preimage is byte-identical to CGP's for future export interop.
serde_json_canonicalizer = "0.3.2"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "fs", "io-util", "sync"] }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
futures-util = "0.3"
clap = { version = "4", features = ["derive", "env"] }
# Shell completion generation for `stella completions <shell>`. Same major
# version line as `clap` itself (they release in lockstep and the generator
# reads clap's own `Command` tree), MIT OR Apache-2.0, and it pulls in nothing
# beyond `clap_builder`, which is already resident.
clap_complete = "4"
colored = "3"
libc = "0.2"
rand = "0.10"
proptest = "1"
toml = "1.1"
# Format-preserving TOML editing. `toml` alone can only re-render a parsed
# document, which discards every comment in it — and a config file whose
# comments do not survive a `/theme` save has lost the one advantage it moved
# to TOML for. `toml_edit` keeps comments, key order, and whitespace across a
# read-modify-write, so a settings editor can change one key and leave the rest
# of the user's file byte-identical. MIT OR Apache-2.0, same license pair and
# same maintainer as `toml` itself. See stella-cli/src/settings/toml_io.rs.
toml_edit = { version = "0.25", features = ["serde"] }
# Vetted dotenv parser (quotes, escapes, multi-line values, `export` prefixes),
# used as a non-mutating iterator so the CLI keeps control of precedence and
# never overrides the live shell. See stella-cli/src/env_files.rs.
dotenvy = "0.15"
rpassword = "7"
# Compiler-resistant zeroing of secret plaintext on drop. Apache-2.0 OR MIT
# (both already on deny.toml's allow-list), zero dependencies, no C code, and
# already resident in the tree transitively via rustls — so this promotes a
# vetted crate to a direct dependency rather than widening the supply chain.
# Without it an API key, a masked prompt's buffer, or an `Authorization` header
# built from one stays legible in freed heap for the rest of the process.
# The `derive`/`zeroize_derive` feature is deliberately NOT enabled: every
# impl in this workspace is a hand-written `Drop` over a newtype's one secret
# field, so the extra proc-macro dependency would buy nothing.
zeroize = "1"
base64 = "0.23"
arboard = { version = "3", default-features = false, features = ["image-data"] }
png = "0.18"
crossterm = "0.29"
notify = "8"
ratatui = "0.30"
unicode-width = "0.2"
roxmltree = "0.21"
# `default-features = false` drops scraper's `main` feature, which exists only
# to build scraper's OWN command-line binary and drags `getopts` into the
# workspace with it — an argument parser compiled into a coding agent that
# already uses clap, reachable from nothing. `errors` is kept (it is
# dependency-free and only enables richer parse diagnostics); the library API
# stella-tools actually uses — `Html`, `Selector`, `ElementRef`, `Node` — lives
# outside any feature gate.
scraper = { version = "0.27", default-features = false, features = ["errors"] }
# Held at 0.39 by the declared MSRV, not by anything this workspace needs from
# it. rusqlite 0.40 requires libsqlite3-sys ^0.38, whose build script calls
# `cfg_select!` — a library feature that stayed unstable through 1.94 and
# stabilized in 1.95, five releases above the `rust-version` above (probed
# directly on 1.90, 1.91, 1.93, 1.94 and 1.95). It arrived in a *patch* release
# (0.38.1), so it reached every open branch at once through the lockfile and
# failed the msrv job on all of them; 0.38.0 carries it too, which is why the
# pin has to be on rusqlite rather than on libsqlite3-sys.
#
# The pin also has to be on rusqlite because 0.40.1 calls `cfg_select!` from
# its OWN source — lib.rs, statement.rs, raw_statement.rs, inner_connection.rs
# — not only from the build script. That is why selecting different
# libsqlite3-sys features cannot avoid it (#1112 tried; the swap moved the
# failure from the build script into the crate and the job still went red).
#
# Raising `rust-version` would also fix the job, and is the wrong trade: it
# spends a five-version jump in a public compatibility promise to satisfy a
# transitive build script. Revisit when the MSRV moves for a reason of its own.
rusqlite = { version = "0.39", features = ["bundled"] }
hmac = "0.13"
sha2 = "0.11"
tempfile = "3"
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-sequel = "0.3"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-php = "0.24"

# stella-tui reads process stats and nothing else (`Pid`, `ProcessRefreshKind`,
# `ProcessesToUpdate`, `System` — see stella-tui/src/resource.rs). sysinfo's
# default set additionally compiles `component`, `disk`, `network` and `user`,
# each of which drags in platform bindings this workspace never calls:
# objc2-io-kit and a pile of objc2-core-foundation submodules on macOS, and the
# WMI/COM/OLE/RPC/Variant surface of the `windows` crate elsewhere. Scoping to
# `system` keeps exactly the API in use.
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
wiremock = "0.6"
# Derive-driven JSON Schema emission for the `AgentEvent` wire contract, behind
# stella-protocol's OPTIONAL `schema` feature so a default `cargo build` never
# compiles it. Derived rather than hand-written on purpose: a hand-maintained
# schema is exactly the drift class docs/design/serve-surface.md warns about,
# and a derive cannot fall out of step with the type it is attached to.
# MIT, and its proc-macro half is the same syn/quote already resident via serde.
schemars = { version = "1", default-features = false, features = ["derive"] }

# Config for 'dist'
[workspace.metadata.dist]
# The installers to generate for each app
installers = ["shell", "homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "macanderson/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
