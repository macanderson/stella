[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "arenabench"
version = "0.1.0"
description = "Coding-agent benchmarks as a live, side-by-side contest."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
keywords = ["benchmark", "agents", "terminal-bench", "harbor", "llm", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]

# Deliberately empty. ArenaBench is standard library only: the tool that
# measures your agent should be small enough to read, and installing it should
# never be the reason a comparison did not happen. Running a match additionally
# needs `harbor` and Docker on PATH, but those are the benchmark's
# dependencies rather than this package's.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
arenabench = "arenabench.cli:main"

[project.urls]
Homepage = "https://arenabench.org"
Source = "https://github.com/macanderson/arenabench"

[tool.hatch.build.targets.wheel]
packages = ["arenabench"]

[tool.hatch.build.targets.sdist]
include = ["arenabench", "recorder", "tests", "README.md", "LICENSE", "NOTICE"]

[tool.ruff]
line-length = 96
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
