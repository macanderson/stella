# arenabench match — Sonnet 5, Stella's full tool catalog vs the four basics
#
#   local:  arenabench run matches/sonnet5-stella-tool-set-baseline.toml --progress
#   cloud:  arenabench cloud run matches/sonnet5-stella-tool-set-baseline.toml
#
# The first arm of the tool-effectiveness experiment #3032 asks for. One
# worker model on both seats and one difference between them: what the agent
# was offered. The control advertises the shipping catalog; the treatment
# advertises `bash`, `read_file`, `write_file` and `edit_file` — plus the
# `apply_edits` the prompt commands and the discovery tools the lean layer
# always mounts.
#
# `tool_set = [...]` becomes `STELLA_LEAN_TOOLS=<names>` in the seat's
# environment, which Stella's lean frontloading reads to filter the advertised
# schema list. Hiding is a prompt-budget measure and never a capability gate:
# a withheld tool is one `tool_search` away, and a hidden tool called by name
# still executes, so no version of this arm can wedge a turn. That property is
# what makes the comparison about *selection* rather than about capability.
#
# `apply_edits` is in the list on purpose and is not optional. The system
# prompt commands "A change touching several files is ONE apply_edits call,
# not a chain of edit_file calls", so a set carrying `edit_file` without it
# ships a session whose own instructions name a tool it cannot see — and the
# round trip the model then spends looking for it would be charged to the
# restriction rather than to the omission.
#
# What #3032 measures, and what it must NOT report without: the token half
# (tool-schema tokens per request, input tokens per trial, the cache_read /
# cache_write split) is expected to move and only verifies the mechanism. The
# hypothesis is the selection half — `bash` share of all tool calls, distinct
# non-`bash` tools per trial, `tool_search` calls and how many activated tools
# were subsequently called. A cheaper menu that produces the same `bash`
# collapse has saved tokens and fixed nothing.
#
# Twenty trials cannot resolve anything smaller than a catastrophe, so solve
# rate here is a guardrail and not the measurement. A dead arm scores as a
# win — a trial that aborts early has few tool calls and low cost — so read
# calls per *solved* trial beside the raw mean and name operational aborts.
#
# Both seats run the same model on the same route, so the routing confound
# does not apply: the only declared difference is the tool set, and it is
# recorded per seat in the match's `provenance.json` (`tool_set_seats`) and in
# each arm's comparability key, so the two can never average into one number.
#
# This file carries no secrets. Export OPENROUTER_API_KEY before running.

[match]
name = "Sonnet 5 — full catalog vs four basics"
dataset = "terminal-bench-2.1"
sut_ref = "main"
attempts = 2
concurrency = 2

# The same ten tasks the bare-loop match races, so this experiment's numbers
# sit beside that one's rather than starting a panel of their own. Task ids
# are not validated by any test, so they are copied from a template that has
# run rather than composed here.
tasks = [
  "fix-git",
  "regex-log",
  "sqlite-with-gcov",
  "large-scale-text-editing",
  "openssl-selfsigned-cert",
  "nginx-request-logging",
  "query-optimize",
  "cancel-async-tasks",
  "dna-assembly",
  "write-compressor",
]

[[contestant]]
id = "full"
name = "Stella (full catalog)"
agent = "stella"
color = "#4C8DFF"

  [contestant.engine]
  api = "openrouter"
  model = "anthropic/claude-sonnet-5"
  reasoning = true
  effort = "high"
  # No `tool_set` key at all. Omission is the control: it advertises exactly
  # what a released Stella advertises, which is what every measurement taken
  # before #3032 was taken against. An empty list would mean something else
  # entirely and is refused.

  [contestant.env]
  required = ["OPENROUTER_API_KEY"]

[[contestant]]
id = "lean"
name = "Stella (four basics)"
agent = "stella"
color = "#EFC53F"

  [contestant.engine]
  api = "openrouter"
  model = "anthropic/claude-sonnet-5"
  reasoning = true
  effort = "high"
  # The whole point of this file. Named tools and never a preset word, so the
  # arm's provenance records the set rather than a word whose meaning is
  # whichever binary it happened to launch. Add one name per subsequent arm to
  # measure that tool's effect against this baseline.
  tool_set = ["bash", "read_file", "write_file", "edit_file", "apply_edits"]

  [contestant.env]
  required = ["OPENROUTER_API_KEY"]
