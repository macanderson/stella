name: diff-view-parity

# The transcript's rendering policies have two implementations each, and they
# must not drift. Two are guarded here; the workflow keeps its original name so
# a run history stays continuous.
#
#   1. the diff *view* policy — how much of a diff is drawn, and which part;
#   2. word-level *highlighting* — which spans of a modified line pair get the
#      stronger tint, and which removal is paired with which addition (#3676).
#
# Both follow the same shape, described below in terms of the first.
#
# **How much of a diff is drawn** — `crates/stella-diff/src/view.rs::plan`.
# Four surfaces consume it in Rust (the Command Deck, the plain `stella run`
# scrollback, the Observatory, `stella export`); the arena transcript
# reimplements it in TypeScript (`arenabench/ui/lib/diff-view.ts`).
#
# **What inside a changed line is tinted** —
# `crates/stella-transcript/src/word.rs::highlight`. The deck's character grid
# and the jet-black web transcript consume it in Rust; the arena transcript
# reimplements it in `arenabench/ui/lib/word-highlight.ts`.
#
# Both ports exist for the same reason: the arena UI is a Next.js client with
# no way to call into the workspace. And both matter for the same reason: an
# arena transcript is read *beside* the deck and the Observatory when someone
# is arguing about what a run did, which is exactly when one edit must not look
# like two.
#
# Neither pair can share a test runner, so each shares a file — a golden matrix
# generated from the Rust and pinned by a `cargo test` that `make gate` already
# runs (`view_plan_matrix`, `word_highlight_matrix`). This job runs each
# TypeScript port over its own matrix and asserts it reproduces that file — so
# a re-blessed golden fails here until the port catches up.
#
# Why not a `make gate` step: the gate is toolchain-free guards plus cargo, and
# this needs Node (AGENTS.md § "The gate"). The Rust half of the check IS in
# the gate; only the cross-language half needs a runtime the gate does not have.
#
# Why its own workflow: `ci.yml` ignores `docs/**` and does not trigger on
# `arenabench/ui/**`, and `docs-guards.yml` triggers on `**/*.rs`, so a job
# there would install Node on essentially every pull request. That is the same
# disjoint-paths reasoning that gave `wire-schema.yml` and `deck-fit.yml` their
# own files (#1439). Filed and fixed as #3558.
#
# The check itself has NO dependencies: Node strips the type annotations from
# the imported `.ts` natively, so there is no `npm install` here at all.
on:
  pull_request:
    paths:
      - "crates/stella-diff/**"
      - "crates/stella-transcript/**"
      - "arenabench/ui/lib/diff-view.ts"
      - "arenabench/ui/lib/word-highlight.ts"
      - "arenabench/ui/scripts/check-diff-view-parity.mjs"
      - "arenabench/ui/scripts/check-word-highlight-parity.mjs"
      - ".github/workflows/diff-view-parity.yml"
  push:
    branches: [main]
    paths:
      - "crates/stella-diff/**"
      - "crates/stella-transcript/**"
      - "arenabench/ui/lib/diff-view.ts"
      - "arenabench/ui/lib/word-highlight.ts"
      - "arenabench/ui/scripts/check-diff-view-parity.mjs"
      - "arenabench/ui/scripts/check-word-highlight-parity.mjs"
      - ".github/workflows/diff-view-parity.yml"
  workflow_dispatch:

# Checkout plus a read-only comparison.
permissions:
  contents: read

jobs:
  parity:
    name: the TypeScript ports match the Rust policies
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # 22.6+ strips TypeScript type annotations natively, which is what lets
      # this run against a bare checkout instead of installing a Next.js app to
      # test one pure function.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: the diff-view port reproduces the committed matrix
        working-directory: arenabench/ui
        run: node scripts/check-diff-view-parity.mjs

      # Deliberately not gated behind the step above: when both ports have
      # drifted, one run should name both, not send the reader back for a
      # second.
      - name: the word-highlight port reproduces the committed matrix
        if: '!cancelled()'
        working-directory: arenabench/ui
        run: node scripts/check-word-highlight-parity.mjs
