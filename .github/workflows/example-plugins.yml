# Track C rule 4, enforced from *this* side (#3523).
#
# `macanderson/stella-examples` already grades its three `verify-{rs,py,ts}`
# plugins against its own vectors in its own CI. What that cannot catch is the
# direction this workflow exists for: the socket's grammar and wire types live
# *here*, so a change to `stella-plugin` can invalidate all three examples with
# every check in the examples repository green, because nothing over there ran.
# Before this, `rg 'verify-rs' --glob '!docs/**'` returned no hit in this
# repository at all.
#
# Its own file rather than a job in ci.yml, for the reason wire-schema.yml has
# one: the paths are disjoint. This needs to run when the plugin grammar, the
# wrapper socket, or the pin moves — and not on the overwhelming majority of
# PRs, which touch none of those and would pay for two toolchains and a second
# checkout for nothing.
#
# Deliberately not a required check yet, on deck-fit.yml's precedent (#2425):
# it depends on a second repository being reachable, and a required check that
# can go red for a reason no PR author can fix is worse than an advisory one
# that gets read.

name: example plugins

on:
  pull_request:
    paths:
      - "crates/stella-plugin/**"
      - "crates/stella-runtime/src/wrapper/**"
      - "crates/stella-runtime/tests/example_plugins_smoke.rs"
      - "scripts/stella-examples-pin.txt"
      - ".github/workflows/example-plugins.yml"
  push:
    branches: [main]
    paths:
      - "crates/stella-plugin/**"
      - "crates/stella-runtime/src/wrapper/**"
      - "crates/stella-runtime/tests/example_plugins_smoke.rs"
      - "scripts/stella-examples-pin.txt"
      - ".github/workflows/example-plugins.yml"

permissions:
  contents: read

concurrency:
  group: example-plugins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: verify-{rs,py,ts} against this grammar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read the pin
        id: pin
        run: |
          set -euo pipefail
          repo="$(sed -n 's/^repo *= *//p' scripts/stella-examples-pin.txt)"
          sha="$(sed -n 's/^sha *= *//p' scripts/stella-examples-pin.txt)"
          test -n "$repo" && test -n "$sha"
          echo "repo=$repo" >>"$GITHUB_OUTPUT"
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "grading $repo at $sha"

      # A pinned SHA, never a branch: the whole point is that the bump is a
      # reviewable diff rather than a moving target. The harness re-checks this
      # against the checkout's own HEAD, so a drift here is caught rather than
      # silently grading the wrong tree.
      - name: Check out the examples at the pin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.sha }}
          path: .stella-examples

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # Rust and Python are graded unconditionally, so both are built before
      # the harness runs and `STELLA_EXAMPLES_REQUIRE` below makes skipping
      # either one a failure rather than a printed line nobody reads.
      # `python3` is already on the runner and needs no build.
      - name: Build verify-rs
        working-directory: .stella-examples/plugins/verify-rs
        run: |
          set -euo pipefail
          cargo build --release
          mkdir -p bin
          cp target/release/verify-rs bin/verify-rs

      # TypeScript is the one that may legitimately skip: it needs a build
      # step, and a build that fails here must not fail the PR for a reason
      # unrelated to it. `|| true` is the skip, and the harness prints the
      # reason — which is why the skip is loud rather than silent.
      - name: Build verify-ts (best effort)
        working-directory: .stella-examples/plugins/verify-ts
        run: npm install --no-audit --no-fund && npm run build || true

      - name: Grade them against this repository's grammar and wire types
        env:
          STELLA_EXAMPLES_DIR: ${{ github.workspace }}/.stella-examples
          # Both languages the runner can always provide. Naming them here is
          # what turns "verify-py did not run" from a printed line into a red
          # job — a silently skipped language check is how "we support three
          # languages" becomes false with no PR ever being red.
          STELLA_EXAMPLES_REQUIRE: rs,py
        run: cargo test -p stella-runtime --test example_plugins_smoke -- --nocapture
