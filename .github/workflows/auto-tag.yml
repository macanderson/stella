name: auto-tag

# Every merge to main cuts a release. This job computes the next semantic
# version from the latest tag and the merge commit's message, creates the tag,
# and kicks off `release.yml` (build + GitHub Release + Homebrew) for it.
#
#   (default)            patch bump    0.1.3 -> 0.1.4
#   'release.minor: …'   minor bump    0.1.3 -> 0.2.0   (patch reset to 0)
#   'release:major …'    major bump    0.1.3 -> 1.0.0   (minor + patch reset)
#
# Put the prefix at the START of the PR title — a squash-merge uses the PR
# title as the commit subject, and the marker is only recognized there (see
# "Read the bump marker from EVERY commit" below for why it is anchored).
# `release.minor`/`release:minor` and `release:major`/`release.major` are both
# accepted. Add `[skip release]` to the title to land a change without cutting
# a release (docs/chore merges).
#
# The marker is read from every commit since the last tag, not just the one
# being tagged, so a release whose own merge never triggered this job is
# picked up by the next one instead of being silently downgraded to a patch.
#
# The tag points at a RELEASE COMMIT: one commit on top of the exact commit
# CI validated, containing only the version stamp (scripts/sync-versions.sh —
# manifests, lockfile, formula, changelog roll). Nothing is pushed to main;
# the commit is reachable only through the tag. This is what makes the tagged
# tree carry its own version (#786): any from-tag source build — release.yml,
# `cargo install --git … --tag`, Homebrew, a distro packager — reports the
# right version with no build-time stamping, and release.yml merely verifies
# the manifest matches the tag instead of rewriting it.
#
# AFTER tagging, the released version is written back to main so the Cargo
# manifests always match the newest release: a `bot/version-sync` branch bumps
# `[workspace.package].version` (every crate inherits it), the workspace-member
# entries in Cargo.lock, and the local build-from-source Homebrew formula, then
# lands via a tiny PR. A PR (not a direct push) because branch protection
# requires changes to arrive by PR with the required checks green.
#
# That PR's own workflow runs are created and then parked: the repository's
# Actions approval policy is `first_time_contributors`, and its author —
# `github-actions[bot]` — is one, so every run sits at `action_required` until
# somebody presses "Approve and run". Three releases in ninety minutes needed
# that click, thirteen runs at a time (#5589). This workflow approves them
# itself, and the PR then satisfies branch protection the ordinary way instead
# of being merged past it. The bump commit carries `[skip release]`, so its
# merge can never cut another release — the loop terminates after exactly one
# sync per release.
#
# Merging past protection is what this used to do, with a maintainer PAT
# (`RELEASE_ADMIN_TOKEN`). That path is dead: `enforce_admins` is on for main,
# so the admin merge is refused like any other and the step warned while
# reporting success. It stays only as a fallback for a repository that still
# grants a bypass.
#
# Nothing required asks whether the branch and main compose, because `strict`
# is off and every check runs on the branch rather than on the merge result. So
# the last step re-asks the lockfile question against the MERGE RESULT before
# merging: `Cargo.lock` is a shared cell, and a sync branch cut before a new
# crate landed composes into a lock that resolves for neither side (#3336).
# scripts/sync-versions.sh asks the same question about its own output at both
# call sites, so the tag cannot carry an unresolvable lock either.
#
# GATED ON GREEN CI. This runs via `workflow_run` after the `ci` workflow
# finishes on main, and only tags when that run *succeeded* — a commit that
# fails to compile or fails tests can never become a tagged release (which is
# exactly how a non-compiling commit shipped as a tag before this gate).
# Because `ci` is path-ignored for docs-only changes, those merges never run
# `ci` and so never trigger a release either — previously they tagged blindly.
# A docs-only merge therefore does not release *at the moment it lands*; if it
# carried a bump marker, the range scan above hands that marker to the next
# release instead. The bump is deferred, never dropped.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

concurrency:
  # Serialize so rapid merges compute their version off the previous tag.
  # Waiting out the sync PR's required checks (below) stretches each queued
  # run from ~1 minute to the length of the slowest one — on a "shared,
  # contested" main this can back the auto-tag queue up under a burst of
  # merges. Not dangerous (still serialized, every failure path warns and
  # exits 0 rather than jamming), just slower than before. The wait is capped
  # at 45 minutes so a stuck check cannot hold the queue indefinitely.
  group: auto-tag
  cancel-in-progress: false

permissions:
  contents: write # push the tag + the version-sync branch
  actions: write # dispatch release.yml + approve the sync PR's parked runs
  pull-requests: write # open/auto-merge the version-sync PR
  issues: write # open/comment/close the version-writeback-deferred issue (#3842)

jobs:
  tag:
    runs-on: ubuntu-latest
    # Only cut a release for a *successful* CI run triggered by a push to main.
    # Guarding on the job (not just inside the step) keeps a red build from ever
    # reaching the tag push.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tag the exact commit CI validated, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%B)"
          printf 'HEAD commit message:\n%s\n\n' "$msg"

          if printf '%s' "$msg" | grep -qiE '\[skip (release|ci)\]'; then
            echo "skip marker present — not cutting a release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Base off the newest v-prefixed tag; if there is none yet, off the
          # workspace version in Cargo.toml.
          last="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
          if [ -z "$last" ]; then
            base="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
            base="${base:-0.0.0}"
            range="HEAD"
          else
            base="${last#v}"
            range="${last}..HEAD"
          fi
          IFS=. read -r major minor patch <<< "$base"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}

          # Read the bump marker from EVERY commit this tag is about to
          # release, not just HEAD. A marker rides on one commit's subject,
          # but that commit's own `ci` run may never happen: `ci` is
          # path-ignored for `docs/**`, `website/**` and `*.md`, so a
          # release-marker PR that only edits release notes produces no
          # `workflow_run` completion and never reaches this job at all. When
          # the next code merge finally does, reading only `git log -1` sees
          # that unrelated subject, cuts a patch bump, and the intended minor
          # release is gone for good — exactly how `release.minor: v0.6.0`
          # (#758, #761) was swallowed twice while tags marched 0.5.55→0.5.59.
          #
          # Scanning `${last}..HEAD` makes the intent durable rather than
          # instantaneous: a marker that misses its own release is honored by
          # the next one. It cannot re-fire, because cutting the tag moves
          # `last` past the marker and out of the range.
          #
          # Subjects only, anchored: squash-merge subjects are PR titles, and
          # the convention documented above is that the prefix leads the
          # title. Matching mid-message across a whole range would let a
          # commit that merely *mentions* release.major cut a major release.
          subjects="$(git log --format=%s "$range")"
          printf 'Commit subjects since %s:\n%s\n\n' "${last:-<no tag>}" "$subjects"

          if printf '%s\n' "$subjects" | grep -qiE '^release[.:]major'; then
            major=$((major + 1)); minor=0; patch=0; kind="major"
          elif printf '%s\n' "$subjects" | grep -qiE '^release[.:]minor'; then
            minor=$((minor + 1)); patch=0; kind="minor"
          else
            patch=$((patch + 1)); kind="patch"
          fi
          version="${major}.${minor}.${patch}"
          tag="v${version}"
          echo "Next release: ${tag} (${kind} bump from ${base})"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::tag ${tag} already exists — aborting to avoid clobbering a release."
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "kind=${kind}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Draft the CHANGELOG section, once, into a file both sync-versions.sh
      # call sites read (the tagged release commit below and the
      # bot/version-sync PR after it), so the tag and main roll identical text.
      # This is the sole author of CHANGELOG.md entries — the roll overwrites
      # [Unreleased] with this draft regardless of what (if anything) a PR put
      # there, so changelog authorship lives entirely in this CI job and never
      # in a coding agent or contributor hand-editing the file.
      #
      # MINOR AND MAJOR ONLY, and the range is the whole SERIES — the previous
      # X.Y.0 tag to HEAD, not the previous tag. CHANGELOG.md records one
      # section per minor line (scripts/changelog-roll.sh explains why: a roll
      # per patch left 77 of 180 sections empty), so a patch release has no
      # section to draft and does not pay for the call. Per-tag detail still
      # ships as GitHub Release notes, which release.yml generates separately.
      #
      # The script prints nothing when it can't draft (no key, API failure);
      # changelog-roll.sh then writes a releases-page pointer rather than an
      # empty section, and the release proceeds either way.
      - name: Draft the changelog section from the series diff
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.kind != 'patch'
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          CHANGELOG_AI_MODEL: ${{ vars.RELEASE_NOTES_MODEL || 'anthropic/claude-sonnet-5' }}
        run: |
          set -euo pipefail
          # The newest X.Y.0 tag opens the series this release closes. Falling
          # back to the newest tag of any shape keeps the very first minor
          # release (no X.Y.0 predecessor yet) from drafting the entire history.
          last_minor="$(git tag -l 'v*.0' --sort=-v:refname | head -n1 || true)"
          last="${last_minor:-$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)}"
          echo "Drafting the ${{ steps.ver.outputs.tag }} section from ${last:-<no tag>}..HEAD"
          entries="${RUNNER_TEMP}/changelog-entries.md"
          ./scripts/changelog-ai.sh ${last:+"${last}..HEAD"} > "${entries}" || true
          if [ -s "${entries}" ]; then
            echo "CHANGELOG_ENTRIES_FILE=${entries}" >> "$GITHUB_ENV"
            echo "----- drafted entries -----"; cat "${entries}"
          else
            echo "::warning::no changelog entries drafted; the roll will write a releases-page pointer."
          fi

      # Needed before the tag now: the release commit syncs Cargo.lock.
      - name: Install Rust (Cargo.lock sync)
        if: steps.ver.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Create the release commit and tag it
        if: steps.ver.outputs.skip != 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        # One commit on top of the CI-validated head_sha carrying the version
        # stamp, so the tagged tree reports its own version (#786). It rides
        # only on the tag — main's copy of the same stamp arrives via the
        # bot/version-sync PR below.
        run: |
          set -euo pipefail
          version="${TAG#v}"

          NEW_VERSION="${version}" ./scripts/sync-versions.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock packaging/homebrew/stella.rb
          if [ -f CHANGELOG.md ]; then git add CHANGELOG.md; fi
          # Commit even if empty-diff is impossible in practice (the tagged
          # tree is always one version behind at this point); tolerate a
          # no-op so a re-run cannot wedge the release.
          git commit -m "stella ${version}" || echo "nothing to stamp; tagging HEAD as-is."
          git tag -a "${TAG}" -m "stella ${version}"
          git push origin "${TAG}"

      - name: Trigger the release build for the new tag
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag pushed with GITHUB_TOKEN does not itself trigger `on: push:
        # tags`, so dispatch release.yml explicitly at the tag ref.
        run: gh workflow run release.yml --ref "${{ steps.ver.outputs.tag }}"

      # ── Write the released version back to main ──────────────────────────

      - name: Open the version-sync PR
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          branch="bot/version-sync"

          # Base on the current tip of main, not head_sha: if another merge
          # already landed, the bump must apply cleanly on top of it. Rapid
          # merges converge — each serialized run force-updates this same
          # branch to the newest tag's version.
          git fetch origin main
          git checkout -B "${branch}" FETCH_HEAD

          # The same stamp the tagged release commit carries — one script,
          # two call sites, no drift (#786).
          NEW_VERSION="${version}" ./scripts/sync-versions.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock packaging/homebrew/stella.rb
          # An `if`, not `[ -f … ] && git add …`: under `set -e` a false test
          # in a bare `&&` chain is a non-zero status for the whole line and
          # would abort the release job.
          if [ -f CHANGELOG.md ]; then git add CHANGELOG.md; fi
          if git diff --cached --quiet; then
            echo "manifests already at ${version}; nothing to sync."
            exit 0
          fi

          # Squash merges use the commit title here (single-commit PR,
          # COMMIT_OR_PR_TITLE), so [skip release] survives onto main and this
          # merge can never cut another release.
          title="chore(release): sync versions to ${version} [skip release]"
          git commit -m "${title}"
          git push -f origin "HEAD:refs/heads/${branch}"

          # Built as an array of whole lines rather than one multi-line quoted
          # string: this step is one YAML block scalar, so every SCRIPT line
          # has to stay indented to match it or YAML ends the block early and
          # reads the rest as new top-level content — but the PR body must NOT
          # carry that indentation into the rendered markdown, or GitHub reads
          # each paragraph as an indented code block rather than a normal one
          # (#4517; the same fix as the deferral issue body below). An array
          # element's own indentation (outside the quotes) satisfies YAML; the
          # quoted content (inside them) carries none of it into the body.
          body_lines=(
            "Automated write-back from auto-tag.yml: ${TAG} was just released, and this PR records that version everywhere the sources carry one —"
            ""
            "- \`[workspace.package].version\` in \`Cargo.toml\` (inherited by every crate)"
            "- the workspace-member entries in \`Cargo.lock\`"
            "- \`packaging/homebrew/stella.rb\` (build-from-source formula)"
            "- \`CHANGELOG.md\` — whatever was under \`[Unreleased]\` now sits under \`[${version}]\`"
            ""
            "The workflow approves this PR's parked workflow runs, waits for the required checks, and merges once they are green (#5589). No action is needed unless a check fails."
          )
          body="$(printf '%s\n' "${body_lines[@]}")"

          existing="$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${title}" --body "${body}"
            pr="${existing}"
          else
            gh pr create --base main --head "${branch}" --title "${title}" --body "${body}"
            pr="$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')"
          fi

          # `no-issue` is SCR-003's escape hatch, and this PR is what it is for:
          # a write-back of a version that was already released closes nothing,
          # so it can never name an issue whose definition of done a human
          # ticks. Without the label `dod` fails every release PR with "this PR
          # links no issue" — a red that recurs on each release and that no
          # author can clear, because there is no issue to link. The label keeps
          # the waiver auditable (`is:pr label:no-issue`) instead of exempting
          # the workflow somewhere only its own source records.
          #
          # Applied as its own non-fatal step rather than `gh pr create
          # --label`: that flag aborts the whole command when the label is
          # missing from the repository, which would turn a deleted label into
          # "the release write-back never opened" instead of "the write-back is
          # red on one advisory check". The weaker failure is the right one
          # here, so this warns and carries on.
          if [ -n "${pr}" ]; then
            gh pr edit "${pr}" --add-label no-issue \
              || echo "::warning::could not apply the no-issue label to #${pr}; dod will be red until it is applied by hand"
          else
            echo "::warning::could not resolve the write-back PR number; no-issue not applied"
          fi

      # The write-back PR's own workflow runs are created and then parked:
      # every one lands as `status: completed, conclusion: action_required`
      # and never starts. The repository's Actions approval policy is
      # `first_time_contributors`, and `github-actions[bot]` — the author of
      # this PR — is one, so the whole suite waits for a person to press
      # "Approve and run". Thirteen runs did that on #5571, #5576 and #5588,
      # and a maintainer cleared each set by hand (#5589).
      #
      # Approving them is the whole fix. Three of main's five required
      # contexts come from workflows this job cannot dispatch instead:
      # `harbor_adapter + analyzer pytest` (bench.yml), `main is not
      # known-broken` (main-red-hold.yml) and `gate steps no other workflow
      # runs` (guard-self-tests.yml). Once the parked runs start, all five
      # report and the PR merges under branch protection rather than past it.
      #
      # GITHUB_TOKEN first, RELEASE_ADMIN_TOKEN second: the narrower token is
      # the one to spend if it is enough, and the log then says which one the
      # repository actually needs. Never fatal — an unapproved run leaves the
      # PR blocked, which is where it was already.
      - name: Approve the version-sync PR's parked workflow runs
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
          BRANCH: bot/version-sync
        run: |
          set -euo pipefail

          head_sha="$(gh pr view "${BRANCH}" --json headRefOid --jq '.headRefOid // empty' 2>/dev/null || true)"
          if [ -z "${head_sha}" ]; then
            echo "no open ${BRANCH} PR — nothing to approve."
            exit 0
          fi
          echo "approving parked runs on ${head_sha}"

          approve_one() {
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/$1/approve" >/dev/null 2>&1 && return 0
            [ -n "${ADMIN_TOKEN:-}" ] || return 1
            GH_TOKEN="${ADMIN_TOKEN}" \
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/$1/approve" >/dev/null 2>&1
          }

          # The runs are created by the `opened`/`synchronize` event this job
          # just caused, so some of them do not exist yet on the first pass.
          # Poll for two minutes and approve whatever has appeared. Polling to
          # the end rather than stopping at the first empty pass: a straggler
          # left parked is a required context that never reports, which is the
          # failure this step exists to remove.
          approved=0
          for _ in $(seq 1 8); do
            parked="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${head_sha}&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion == "action_required") | .id')"
            for run_id in ${parked}; do
              if approve_one "${run_id}"; then
                approved=$(( approved + 1 ))
                echo "approved run ${run_id}"
              else
                echo "::warning::could not approve run ${run_id}; a required check may never report"
              fi
            done
            sleep 15
          done
          echo "approved ${approved} parked run(s) on ${head_sha}"

      # Merging a Cargo-only bot/version-sync PR used to need an admin bypass.
      # The PR's own checks were parked (see the step above), so the required
      # contexts never reported, and the workflow dispatched ci.yml onto the
      # branch to watch a run of its own instead. That covered two of the five
      # contexts main requires; the other three belong to workflows with no
      # `workflow_dispatch` trigger, so the bypass was doing the rest of the
      # work. On 2026-09-02 the bypass stopped working — `enforce_admins` is
      # on, so `mergePullRequest` refused the admin merge with "5 of 5
      # required status checks are expected", the step warned, and the job
      # still reported success (#5589, run 33666329889).
      #
      # Approving the parked runs makes all five contexts report, so this step
      # no longer dispatches anything and no longer bypasses anything: it
      # waits for the required checks, re-asks the lockfile question against
      # the merge result, and merges the ordinary way. The admin merge stays
      # as a fallback for a repository whose protection still permits one.
      - name: Wait for the required checks, then merge the version-sync PR
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_MERGE_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
          # Fixed by convention — see "Open the version-sync PR" above.
          BRANCH: bot/version-sync
          VERSION: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail

          # The previous step exits 0 early ("manifests already at ${version};
          # nothing to sync") when the bump was a no-op — a step exiting 0 is
          # a *success*, not a skip, so it doesn't stop this step from
          # running. Without this guard, a no-op cycle would merge whatever
          # bot/version-sync PR happens to be open — possibly a stale one left
          # over from an earlier cycle. Bail out if there's nothing open.
          if [ -z "$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')" ]; then
            echo "no open ${BRANCH} PR — nothing to merge."
            exit 0
          fi

          # `gh pr checks --required` reports on exactly the contexts branch
          # protection requires, so this waits for the real gate rather than
          # for a run of its own choosing. Its exit codes: 0 every required
          # context passed, 8 one is still pending, anything else one failed
          # or none has reported yet.
          #
          # "None has reported yet" is the normal state for the first minute
          # or two, while the approved runs create their check runs, and it is
          # indistinguishable from a red verdict by exit code alone. So a
          # non-pending verdict only ends the wait once the grace window is
          # over — before that it is treated as "not yet".
          now() { date +%s; }
          grace_until=$(( $(now) + 300 ))
          deadline=$(( $(now) + 2700 ))
          checks_green=false
          while [ "$(now)" -lt "${deadline}" ]; do
            rc=0
            gh pr checks "${BRANCH}" --required || rc=$?
            if [ "${rc}" -eq 0 ]; then
              checks_green=true
              break
            fi
            if [ "${rc}" -ne 8 ] && [ "$(now)" -ge "${grace_until}" ]; then
              echo "::warning::a required check on ${BRANCH} is red or never reported — NOT merging. Read the PR's checks, fix the failure, and re-run auto-tag.yml."
              exit 0
            fi
            sleep 30
          done
          if [ "${checks_green}" != true ]; then
            echo "::warning::the required checks on ${BRANCH} did not finish within 45 minutes — NOT merging. Merge it once they are green, or re-run auto-tag.yml."
            exit 0
          fi

          # Green is a claim about the BRANCH, not about the tree that lands.
          # Cargo.lock is one shared cell every version-bumping PR writes, so a
          # sync branch cut from an older main can merge textually clean and
          # still compose into a lock that resolves for neither side. That is
          # exactly how the 0.9.50 sync left stella-plugin alone at 0.9.49 while
          # 23 crates moved: the sync branch predated the crate, the branch
          # adding it was green on its own, git had no conflict to report, and
          # `main` was red for every `--locked` build until #3333 (#3336; the
          # shape is AGENTS.md § Gotchas' shared-cell collision, and #3332's
          # post-merge canary is the backstop for when it still gets through).
          #
          # No required check asks it. `strict` is off on main's protection, so
          # a sync branch is never made to catch up before it merges, and every
          # check above ran on the branch rather than on the merge result. The
          # question has to be asked here or it is not asked at all.
          #
          # Refusing rather than rebuilding the branch on the new tip: a rebuilt
          # head throws away every check that just reported and parks a fresh
          # set of runs to approve. Refusing costs one cycle instead — whatever
          # merge moved main starts another auto-tag run, which force-updates
          # this same branch from the then-current tip. The version write-back
          # is deferred, never dropped, and main stays green.
          git fetch origin main
          merge_verdict=0
          if git merge --no-commit --no-ff FETCH_HEAD >/dev/null 2>&1; then
            ./scripts/check-lockfile-sync.sh || merge_verdict=$?
          else
            merge_verdict=1
            echo "::warning::${BRANCH} no longer merges cleanly into main."
          fi
          # --abort is a no-op error when main was already an ancestor (nothing
          # was merged); the reset puts the tree back either way.
          git merge --abort 2>/dev/null || true
          git reset --hard HEAD >/dev/null

          # #3842: the refusal below used to be invisible outside this run's
          # log. `exit 0` is right — a stale sync branch is routine and
          # self-healing, and failing the job here would red the release
          # workflow on a condition that fixes itself — but nothing
          # distinguished "merged the write-back" from "silently skipped it",
          # and the recovery argument ("whatever merge moved main starts
          # another auto-tag run, which force-updates this branch") is an
          # ASSUMPTION: it holds only while commits keep landing on main. If
          # the refusal happens on the last merge before a quiet period, the
          # write-back never lands and every run still reports green.
          #
          # Report it the way main-canary.yml reports a broken tree: one
          # labelled issue, opened while the condition recurs and closed the
          # run it clears — scripts/main-canary.sh's header carries the full
          # argument for that shape, including why a monitor that only ever
          # files gets muted and ends up worse than none. A distinct label
          # from main-canary's own `main-red`: this is not "main is broken",
          # `main` compiles and its lock resolves fine — it is "this branch's
          # version write-back hasn't landed yet".
          defer_label="version-writeback-deferred"
          open_defer_issue="$(gh issue list --label "$defer_label" --state open --limit 1 \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)"

          if [ "${merge_verdict}" -ne 0 ]; then
            echo "::warning::merging ${BRANCH} would leave main's Cargo.lock unresolvable — NOT merging (#3336). main moved under this branch; the next release cycle rebuilds it from the current tip, or re-run auto-tag.yml by hand."

            short_sha="$(git rev-parse --short HEAD)"
            # Built as an array of whole lines rather than one multi-line
            # quoted string: this step is one YAML block scalar, so every
            # SCRIPT line has to stay indented to match it or YAML ends the
            # block early and reads the rest as new top-level content — but
            # the issue body must NOT carry that indentation, or GitHub's
            # markdown reads each paragraph as an indented code block. An
            # array element's own indentation (outside the quotes) satisfies
            # YAML; the quoted content (inside them) carries none of it into
            # the rendered body.
            defer_lines=(
              "Auto-tag refused to merge the \`${BRANCH}\` version-sync PR (writing back \`${VERSION}\`) at \`${short_sha}\`: merging it would leave \`main\`'s \`Cargo.lock\` unresolvable (#3336)."
              ""
              "This is usually self-healing — whatever merge moved \`main\` under this branch starts another \`auto-tag\` run, which force-updates \`${BRANCH}\` from the then-current tip and retries. That recovery only fires while commits keep landing on \`main\`, though: if this refusal happens on the last merge before a quiet period, the write-back never lands and nothing else would have said so (#3842)."
              ""
              "**If this is still open and no \`auto-tag\` run has retried recently**, run it by hand:"
              ""
              '```sh'
              "gh workflow run auto-tag.yml"
              '```'
              ""
              "Closes automatically the run the write-back merges."
            )
            defer_body="$(printf '%s\n' "${defer_lines[@]}")"

            if [ -n "${open_defer_issue}" ]; then
              gh issue comment "${open_defer_issue}" \
                --body "Still deferred at \`${short_sha}\`, branch \`${BRANCH}\`, writing back \`${VERSION}\`." \
                || echo "::warning::could not comment on deferral issue #${open_defer_issue}"
            else
              # `--force`: idempotent label creation, the same reason
              # main-canary.sh ensures its own label before its first issue.
              gh label create "$defer_label" \
                --color FBCA04 \
                --description "the version write-back to main was refused and has not since landed (#3842)" \
                --force \
                || echo "::warning::could not ensure the ${defer_label} label"
              gh issue create \
                --title "version write-back to main is deferred (${BRANCH})" \
                --label "$defer_label" \
                --body "$defer_body" \
                || echo "::warning::could not open a deferral issue"
            fi
            exit 0
          fi

          if [ -n "${open_defer_issue}" ]; then
            short_sha="$(git rev-parse --short HEAD)"
            gh issue comment "${open_defer_issue}" \
              --body "The write-back merges cleanly again as of \`${short_sha}\` — closing. Reopen if you disagree." \
              || true
            gh issue close "${open_defer_issue}" --reason completed \
              || echo "::warning::could not close deferral issue #${open_defer_issue}"
          fi

          # The ordinary merge, with the required checks green. Retried
          # because `gh pr checks --required` reports on the contexts that
          # have arrived, while branch protection also counts the ones that
          # have not: a context whose run is still spawning reads as green
          # here and as "expected" there. Ten tries over five minutes covers
          # that gap without turning a genuine refusal into a long wait.
          for _ in $(seq 1 10); do
            if gh pr merge "${BRANCH}" --squash; then
              exit 0
            fi
            sleep 30
          done

          # RELEASE_ADMIN_TOKEN: a maintainer PAT with bypass rights on this
          # branch's protection (documented in RELEASING.md). It is a fallback
          # now, not the path: `enforce_admins` is on for main, which makes
          # `mergePullRequest` refuse an admin merge on the same grounds it
          # refuses any other (#5589). Kept for a repository whose protection
          # still grants a bypass.
          if [ -n "${ADMIN_MERGE_TOKEN:-}" ]; then
            if GH_TOKEN="${ADMIN_MERGE_TOKEN}" gh pr merge "${BRANCH}" --squash --admin; then
              exit 0
            fi
            echo "::warning::admin merge of ${BRANCH} with RELEASE_ADMIN_TOKEN failed — falling back to auto-merge."
          fi

          # Last resort: arm auto-merge so a context that reports late still
          # lands the write-back with no human action, and say so, because a
          # step that reaches here has not merged anything.
          gh pr merge "${BRANCH}" --squash --auto \
            || echo "::warning::could not enable auto-merge — merge the ${BRANCH} PR manually once checks are green."
          echo "::warning::${BRANCH} did not merge in this run; auto-merge is armed. If it is still open, check that its workflow runs are not parked in action_required (#5589)."
