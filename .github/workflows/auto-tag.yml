name: auto-tag

# Every merge to main cuts a release. This job computes the next semantic
# version from the latest tag and the merge commit's message, creates the tag,
# and kicks off `release.yml` (build + GitHub Release + Homebrew) for it.
#
#   (default)            patch bump    0.1.3 -> 0.1.4
#   'release.minor: …'   minor bump    0.1.3 -> 0.2.0   (patch reset to 0)
#   'release:major …'    major bump    0.1.3 -> 1.0.0   (minor + patch reset)
#
# Put the prefix at the START of the PR title — a squash-merge uses the PR
# title as the commit subject, and the marker is only recognized there (see
# "Read the bump marker from EVERY commit" below for why it is anchored).
# `release.minor`/`release:minor` and `release:major`/`release.major` are both
# accepted. Add `[skip release]` to the title to land a change without cutting
# a release (docs/chore merges).
#
# The marker is read from every commit since the last tag, not just the one
# being tagged, so a release whose own merge never triggered this job is
# picked up by the next one instead of being silently downgraded to a patch.
#
# The tag points at a RELEASE COMMIT: one commit on top of the exact commit
# CI validated, containing only the version stamp (scripts/sync-versions.sh —
# manifests, lockfile, formula, changelog roll). Nothing is pushed to main;
# the commit is reachable only through the tag. This is what makes the tagged
# tree carry its own version (#786): any from-tag source build — release.yml,
# `cargo install --git … --tag`, Homebrew, a distro packager — reports the
# right version with no build-time stamping, and release.yml merely verifies
# the manifest matches the tag instead of rewriting it.
#
# AFTER tagging, the released version is written back to main so the Cargo
# manifests always match the newest release: a `bot/version-sync` branch bumps
# `[workspace.package].version` (every crate inherits it), the workspace-member
# entries in Cargo.lock, and the local build-from-source Homebrew formula, then
# lands via a tiny PR. A PR (not a direct push) because branch protection
# requires changes to arrive by PR with the required `ci` checks green; those
# checks are dispatched onto the branch explicitly because pushes made with
# GITHUB_TOKEN never trigger `on: push`/`on: pull_request` workflows. Despite
# the dispatched run going green, this same GITHUB_TOKEN-authored PR still
# ends up permanently `mergeable_state: blocked` (#264, #275) — most likely
# because the PR also picks up a second, unrunnable `action_required` check
# suite from ci.yml's natural `pull_request` trigger for the same reason, but
# rather than fully disambiguate every possible blocker (conversation
# resolution, staleness, that phantom suite), this workflow just verifies the
# run it dispatched itself is green and then bypasses whatever is blocking
# with an admin-privileged token (`RELEASE_ADMIN_TOKEN`, falling back to ordinary
# auto-merge — see the last step) rather than requiring a human `--admin`
# merge every release. The bump commit carries `[skip release]`, so its merge
# can never cut another release — the loop terminates after exactly one sync
# per release.
#
# GATED ON GREEN CI. This runs via `workflow_run` after the `ci` workflow
# finishes on main, and only tags when that run *succeeded* — a commit that
# fails to compile or fails tests can never become a tagged release (which is
# exactly how a non-compiling commit shipped as a tag before this gate).
# Because `ci` is path-ignored for docs-only changes, those merges never run
# `ci` and so never trigger a release either — previously they tagged blindly.
# A docs-only merge therefore does not release *at the moment it lands*; if it
# carried a bump marker, the range scan above hands that marker to the next
# release instead. The bump is deferred, never dropped.

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

concurrency:
  # Serialize so rapid merges compute their version off the previous tag.
  # Waiting out the dispatched ci run (below) stretches each queued run from
  # ~1 minute to the length of a full ci run (~4 minutes) — on a "shared,
  # contested" main this can back the auto-tag queue up under a burst of
  # merges. Not dangerous (still serialized, every failure path warns and
  # exits 0 rather than jamming), just slower than before.
  group: auto-tag
  cancel-in-progress: false

permissions:
  contents: write # push the tag + the version-sync branch
  actions: write # dispatch release.yml + ci.yml
  pull-requests: write # open/auto-merge the version-sync PR

jobs:
  tag:
    runs-on: ubuntu-latest
    # Only cut a release for a *successful* CI run triggered by a push to main.
    # Guarding on the job (not just inside the step) keeps a red build from ever
    # reaching the tag push.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Tag the exact commit CI validated, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Compute next version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          msg="$(git log -1 --pretty=%B)"
          printf 'HEAD commit message:\n%s\n\n' "$msg"

          if printf '%s' "$msg" | grep -qiE '\[skip (release|ci)\]'; then
            echo "skip marker present — not cutting a release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Base off the newest v-prefixed tag; if there is none yet, off the
          # workspace version in Cargo.toml.
          last="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
          if [ -z "$last" ]; then
            base="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
            base="${base:-0.0.0}"
            range="HEAD"
          else
            base="${last#v}"
            range="${last}..HEAD"
          fi
          IFS=. read -r major minor patch <<< "$base"
          major=${major:-0}; minor=${minor:-0}; patch=${patch:-0}

          # Read the bump marker from EVERY commit this tag is about to
          # release, not just HEAD. A marker rides on one commit's subject,
          # but that commit's own `ci` run may never happen: `ci` is
          # path-ignored for `docs/**`, `website/**` and `*.md`, so a
          # release-marker PR that only edits release notes produces no
          # `workflow_run` completion and never reaches this job at all. When
          # the next code merge finally does, reading only `git log -1` sees
          # that unrelated subject, cuts a patch bump, and the intended minor
          # release is gone for good — exactly how `release.minor: v0.6.0`
          # (#758, #761) was swallowed twice while tags marched 0.5.55→0.5.59.
          #
          # Scanning `${last}..HEAD` makes the intent durable rather than
          # instantaneous: a marker that misses its own release is honored by
          # the next one. It cannot re-fire, because cutting the tag moves
          # `last` past the marker and out of the range.
          #
          # Subjects only, anchored: squash-merge subjects are PR titles, and
          # the convention documented above is that the prefix leads the
          # title. Matching mid-message across a whole range would let a
          # commit that merely *mentions* release.major cut a major release.
          subjects="$(git log --format=%s "$range")"
          printf 'Commit subjects since %s:\n%s\n\n' "${last:-<no tag>}" "$subjects"

          if printf '%s\n' "$subjects" | grep -qiE '^release[.:]major'; then
            major=$((major + 1)); minor=0; patch=0; kind="major"
          elif printf '%s\n' "$subjects" | grep -qiE '^release[.:]minor'; then
            minor=$((minor + 1)); patch=0; kind="minor"
          else
            patch=$((patch + 1)); kind="patch"
          fi
          version="${major}.${minor}.${patch}"
          tag="v${version}"
          echo "Next release: ${tag} (${kind} bump from ${base})"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "::error::tag ${tag} already exists — aborting to avoid clobbering a release."
            exit 1
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # Draft CHANGELOG entries from the diff this tag is about to release,
      # once, into a file both sync-versions.sh call sites read (the tagged
      # release commit below and the bot/version-sync PR after it), so the tag
      # and main roll identical text. The script prints nothing when it can't
      # draft (no key, API failure) and sync-versions.sh skips injection when
      # a contributor already wrote [Unreleased] entries by hand — either way
      # the release proceeds exactly as it did before this step existed.
      - name: Draft changelog entries from the release diff
        if: steps.ver.outputs.skip != 'true'
        env:
          AI_GATEWAY_API_KEY: ${{ secrets.AI_GATEWAY_API_KEY }}
          CHANGELOG_AI_MODEL: ${{ vars.RELEASE_NOTES_MODEL || 'anthropic/claude-sonnet-5' }}
        run: |
          set -euo pipefail
          last="$(git tag -l 'v*' --sort=-v:refname | head -n1 || true)"
          entries="${RUNNER_TEMP}/changelog-entries.md"
          ./scripts/changelog-ai.sh ${last:+"${last}..HEAD"} > "${entries}" || true
          if [ -s "${entries}" ]; then
            echo "CHANGELOG_ENTRIES_FILE=${entries}" >> "$GITHUB_ENV"
            echo "----- drafted entries -----"; cat "${entries}"
          else
            echo "::warning::no changelog entries drafted; the roll will proceed without them."
          fi

      # Needed before the tag now: the release commit syncs Cargo.lock.
      - name: Install Rust (Cargo.lock sync)
        if: steps.ver.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Create the release commit and tag it
        if: steps.ver.outputs.skip != 'true'
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        # One commit on top of the CI-validated head_sha carrying the version
        # stamp, so the tagged tree reports its own version (#786). It rides
        # only on the tag — main's copy of the same stamp arrives via the
        # bot/version-sync PR below.
        run: |
          set -euo pipefail
          version="${TAG#v}"

          NEW_VERSION="${version}" ./scripts/sync-versions.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock packaging/homebrew/stella.rb
          if [ -f CHANGELOG.md ]; then git add CHANGELOG.md; fi
          # Commit even if empty-diff is impossible in practice (the tagged
          # tree is always one version behind at this point); tolerate a
          # no-op so a re-run cannot wedge the release.
          git commit -m "stella ${version}" || echo "nothing to stamp; tagging HEAD as-is."
          git tag -a "${TAG}" -m "stella ${version}"
          git push origin "${TAG}"

      - name: Trigger the release build for the new tag
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag pushed with GITHUB_TOKEN does not itself trigger `on: push:
        # tags`, so dispatch release.yml explicitly at the tag ref.
        run: gh workflow run release.yml --ref "${{ steps.ver.outputs.tag }}"

      # ── Write the released version back to main ──────────────────────────

      - name: Open the version-sync PR
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          branch="bot/version-sync"

          # Base on the current tip of main, not head_sha: if another merge
          # already landed, the bump must apply cleanly on top of it. Rapid
          # merges converge — each serialized run force-updates this same
          # branch to the newest tag's version.
          git fetch origin main
          git checkout -B "${branch}" FETCH_HEAD

          # The same stamp the tagged release commit carries — one script,
          # two call sites, no drift (#786).
          NEW_VERSION="${version}" ./scripts/sync-versions.sh

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock packaging/homebrew/stella.rb
          # An `if`, not `[ -f … ] && git add …`: under `set -e` a false test
          # in a bare `&&` chain is a non-zero status for the whole line and
          # would abort the release job.
          if [ -f CHANGELOG.md ]; then git add CHANGELOG.md; fi
          if git diff --cached --quiet; then
            echo "manifests already at ${version}; nothing to sync."
            exit 0
          fi

          # Squash merges use the commit title here (single-commit PR,
          # COMMIT_OR_PR_TITLE), so [skip release] survives onto main and this
          # merge can never cut another release.
          title="chore(release): sync versions to ${version} [skip release]"
          git commit -m "${title}"
          git push -f origin "HEAD:refs/heads/${branch}"

          body="Automated write-back from auto-tag.yml: ${TAG} was just released, and this PR records that version everywhere the sources carry one —

          - \`[workspace.package].version\` in \`Cargo.toml\` (inherited by every crate)
          - the workspace-member entries in \`Cargo.lock\`
          - \`packaging/homebrew/stella.rb\` (build-from-source formula)
          - \`CHANGELOG.md\` — whatever was under \`[Unreleased]\` now sits under \`[${version}]\`

          The workflow dispatches the required \`ci\` checks onto this branch and merges once they're green (past GitHub's phantom \`action_required\` check suite for this GITHUB_TOKEN-authored PR — see #275); no action is needed unless the dispatched run fails."

          existing="$(gh pr list --head "${branch}" --state open --json number --jq '.[0].number // empty')"
          if [ -n "${existing}" ]; then
            gh pr edit "${existing}" --title "${title}" --body "${body}"
          else
            gh pr create --base main --head "${branch}" --title "${title}" --body "${body}"
          fi

      # Merging a Cargo-only bot/version-sync PR the normal way never
      # resolves. Confirmed live on PR #287 (chore(release): sync versions to
      # 0.4.51): its `workflow_dispatch`-triggered ci run posted both required
      # check-runs as green, yet `mergeable_state` stayed "blocked" — most
      # likely because a GITHUB_TOKEN-triggered event can never trigger a
      # *new* workflow run (recursion guard), so ci.yml's *natural*
      # `pull_request` trigger on this same GITHUB_TOKEN-authored PR still
      # spawns a check suite that can only ever complete as a zero-job
      # "action_required" phantom, which branch protection's required-status-
      # check evaluation may treat as permanently unresolved. Rather than
      # fully disambiguate every possible blocker (that phantom suite,
      # conversation resolution, staleness), this step just verifies the run
      # it dispatched itself actually went green and then bypasses whatever
      # is blocking with an admin-privileged merge — every sync PR needed a
      # manual `--admin` merge before this (#264, #275).
      - name: Wait for the dispatched checks, then merge past the GITHUB_TOKEN phantom check suite
        if: steps.ver.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ADMIN_MERGE_TOKEN: ${{ secrets.RELEASE_ADMIN_TOKEN }}
          # Fixed by convention — see "Open the version-sync PR" above.
          BRANCH: bot/version-sync
        run: |
          set -euo pipefail

          # The previous step exits 0 early ("manifests already at ${version};
          # nothing to sync") when the bump was a no-op — a step exiting 0 is
          # a *success*, not a skip, so it doesn't stop this step from
          # running. Without this guard, a no-op cycle would still dispatch a
          # full ci run and then merge whatever bot/version-sync PR happens
          # to be open — possibly a stale one left over from an earlier
          # cycle. Bail out here if there's nothing open to merge.
          if [ -z "$(gh pr list --head "${BRANCH}" --state open --json number --jq '.[0].number // empty')" ]; then
            echo "no open ${BRANCH} PR — nothing to merge."
            exit 0
          fi

          latest_run_id() {
            gh run list --workflow=ci.yml --branch="${BRANCH}" \
              --event=workflow_dispatch --limit=1 --json databaseId \
              --jq '.[0].databaseId // empty'
          }

          # Capture whatever was already the newest workflow_dispatch run
          # for this branch (usually the previous sync's), so the poll below
          # can tell a genuinely new run apart from a stale one still cached
          # at dispatch time — the required checks must be validated against
          # *this* commit, not a leftover run id.
          previous_run_id="$(latest_run_id)"

          # Start the required checks — a GITHUB_TOKEN push doesn't trigger
          # ci.yml's own `on: pull_request`.
          gh workflow run ci.yml --ref "${BRANCH}"

          run_id=""
          for _ in $(seq 1 15); do
            candidate="$(latest_run_id)"
            if [ -n "${candidate}" ] && [ "${candidate}" != "${previous_run_id}" ]; then
              run_id="${candidate}"
              break
            fi
            sleep 4
          done
          if [ -z "${run_id}" ]; then
            echo "::warning::could not find the freshly dispatched ci run for ${BRANCH} — merge it manually once checks are green (see #275)."
            exit 0
          fi

          if ! gh run watch "${run_id}" --exit-status; then
            echo "::warning::the dispatched ci run for ${BRANCH} failed — NOT merging. Fix the failure and re-run ci.yml on the branch."
            exit 0
          fi

          # RELEASE_ADMIN_TOKEN: a maintainer PAT with bypass rights on this
          # branch's protection (documented in RELEASING.md). Without it,
          # fall back to arming ordinary auto-merge plus a manual-merge
          # warning — the phantom suite will still block it, but nothing
          # regresses for a repo that hasn't set the secret up yet.
          if [ -n "${ADMIN_MERGE_TOKEN:-}" ]; then
            if GH_TOKEN="${ADMIN_MERGE_TOKEN}" gh pr merge "${BRANCH}" --squash --admin; then
              exit 0
            fi
            echo "::warning::admin merge of ${BRANCH} with RELEASE_ADMIN_TOKEN failed — falling back to auto-merge."
          fi
          gh pr merge "${BRANCH}" --squash --auto \
            || echo "::warning::could not enable auto-merge — merge the ${BRANCH} PR manually once checks are green (see #275)."
