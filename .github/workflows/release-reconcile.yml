name: release-reconcile

# Break the silence around a failed release (#1464).
#
# `release.yml` failed on 31 consecutive tags (v0.6.75 → v0.6.108, about two
# days) and nothing anywhere said so. The repository kept cutting version
# numbers the whole time while shipping no binaries.
#
# It was invisible because every surface a maintainer glances at reported
# success: `ci` on main green, `auto-tag` succeeded (it tags, dispatches, and
# exits without ever looking at the outcome), the version-sync PR opened and
# auto-merged, CHANGELOG.md rolled, and the manifests were stamped. Only the
# last two jobs of `release.yml` skipped, and nothing reads `gh release list`
# on a cadence.
#
# ── Why a reconciler and not a watcher ───────────────────────────────────────
#
# The tempting fix is to have `auto-tag` watch the run it dispatches — it
# already does exactly that for the version-sync PR. But `auto-tag`'s
# concurrency group is serialized with `cancel-in-progress: false` and its
# comments are explicit that every failure path warns and exits 0 *specifically*
# so a bad release cannot jam the queue under a burst of merges. Holding that
# job open for an hour of full-LTO builds is the thing it was written to avoid.
#
# Comparing state instead of watching a run also catches strictly more: a
# dispatch that never started, a run cancelled by a runner outage, and a release
# deleted after the fact are all invisible to a watcher and all visible here.
#
# ── Cadence ──────────────────────────────────────────────────────────────────
#
# Hourly. The script's own 90-minute grace window is what keeps this quiet
# during a build — a red release run is indistinguishable at a glance from one
# still going, since full-LTO plus the independent rebuild arm takes the better
# part of an hour. Running more often than the grace window would just re-ask a
# question whose answer cannot have changed.
#
# ── Three hops, three jobs ────────────────────────────────────────────────────
#
# `reconcile` asks whether every tag has a published release. `tap` asks whether
# the Homebrew tap serves the newest one, which is a different question with a
# different remedy: a release can publish perfectly and still never reach
# `brew install` (#5551). `branch-drift` asks a question about pull requests
# rather than releases, but the same silent-until-somebody-looks shape: is a
# merged pull request's branch still on origin, moved past the commit that was
# actually merged? #2180's tail (seven commits) answered that "yes" for two
# days before anyone noticed, because nothing was reading it on a cadence
# either (#2658). It rides this workflow rather than a new one because the
# question fits the same hourly, state-comparing pattern the two release jobs
# already use.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      grace-secs:
        description: "Seconds a tag may go unpublished before it is reported"
        type: string
        default: "5400"

permissions:
  contents: read

concurrency:
  group: release-reconcile
  cancel-in-progress: true

jobs:
  reconcile:
    name: every tag has a published release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history and tags: the check reads tag creation dates out of git
      # (`gh api .../tags` carries no date at all), so a shallow clone would
      # see no tags and report a clean bill of health it had not earned.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Reconcile tags against published releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/check-releases-published.sh \
            --grace-secs "${{ inputs.grace-secs || '5400' }}"

  # The same question one hop further down the pipeline (#5551). A published
  # release does not mean `brew install macanderson/tap/stella` serves it: the
  # `homebrew` job in release.yml warns and exits 0 when neither tap credential
  # is set, so an expired deploy key would leave the tap frozen while the job
  # above, every release, and every tag all keep reporting success. Nothing
  # asked this question until now, which is why #5551 could be filed against a
  # tap that was in fact current — no surface could answer it either way.
  #
  # Its own job rather than a second step, so a frozen tap and an unpublished
  # tag are two findings a maintainer can see at once instead of whichever one
  # happens to fail first hiding the other.
  tap:
    name: the Homebrew tap serves the newest release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No history needed: this reads the release list and the tap's formula,
      # never a tag date.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Reconcile the tap formula against published releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/check-tap-current.sh \
            --grace-secs "${{ inputs.grace-secs || '5400' }}"

  # A merged pull request's branch is supposed to be dead the moment it
  # merges — GitHub deletes it automatically. When one is still on origin and
  # its tip no longer matches what actually merged, somebody pushed to a
  # branch after its work already landed, and those commits sit outside every
  # pull request and every branch main's history reaches. Deleting the branch
  # later, which nothing here stops from happening, is exactly how #2180's
  # tail was lost for two days.
  #
  # Its own job so a drifted branch and a release-pipeline finding are two
  # things a maintainer can see at once, the same reason `tap` is not a second
  # step of `reconcile`.
  branch-drift:
    name: no merged pull request's branch has moved past its own merge
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No tag history needed, but `git ls-remote --heads origin` below reads
      # the remote directly and needs `origin` to exist, which checkout sets
      # up regardless of depth.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for commits stranded on a merged pull request's branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/check-merged-branch-drift.sh
