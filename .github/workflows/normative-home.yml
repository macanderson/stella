name: normative-home

# Guards that keep doc references honest. Three checks, same failure mode:
# a pointer that looks authoritative and is not.
#
#  1. Boundary drift guard for context-graph-protocol#27: the adaptive-context
#     docs reference CGP as the normative home for frame/wire semantics instead
#     of restating them. This keeps the pinned CGP release in those docs in
#     sync with the exact contextgraph-* version stella actually builds against
#     (the root Cargo.toml's [workspace.dependencies]).
#  2. Citation guard (#652, #561): every `docs/**.md` path named in a Rust
#     comment must exist, and every cited `§N` must be a section that document
#     has. `docs/context-reuse.md` was cited 23 times while absent from the
#     repo. It also forbids markdown citing markdown by line number — five such
#     citations existed and every one had already drifted 16-27 lines.
#  3. Invariant guard (#630): the architectural invariants live in AGENTS.md
#     and nowhere else, and the numbering that Rust doc comments cite by
#     ("AGENTS.md invariant #3") must keep resolving. CONTRIBUTING.md and
#     README.md each carried a drifted second copy.
#
# Rust sources are in the path filter because check-doc-citations.sh reads
# them — a comment added in a .rs file is exactly how a citation goes stale.
# Isolated from ci.yml / docs.yml so it can never block the core build.
on:
  pull_request:
    paths:
      - "docs/**"
      - "**/*.md"
      - "**/*.rs"
      - "Cargo.toml"
      - "scripts/check-normative-home.sh"
      - "scripts/check-doc-citations.sh"
      - "scripts/check-invariants.sh"
      - ".github/workflows/normative-home.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "**/*.rs"
      - "Cargo.toml"
      - "scripts/check-normative-home.sh"
      - "scripts/check-doc-citations.sh"
      - "scripts/check-invariants.sh"
      - ".github/workflows/normative-home.yml"
  workflow_dispatch:

# Checkout + one read-only shell check.
permissions:
  contents: read

jobs:
  check:
    name: normative-home pin check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check NORMATIVE-HOME pins match the CGP rev stella builds against
        run: bash scripts/check-normative-home.sh

      - name: Check every docs/*.md cited from Rust source resolves
        run: bash scripts/check-doc-citations.sh

      - name: Check the architectural invariants have one home and stable numbering
        run: bash scripts/check-invariants.sh
