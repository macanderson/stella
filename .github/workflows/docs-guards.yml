name: docs-guards

# The guards over prose and colour, listed below and enumerated by the job's own
# steps. None needs a Rust toolchain, which is why they live here rather than in
# ci.yml -- that workflow deliberately skips its Rust jobs for a diff confined to
# `docs/**`, `website/**` and `*.md` (a job-level prose filter since #1892), and
# this one triggers on exactly those paths.
#
#  1. doc-links (scripts/check-doc-links.py): every citation resolves to a
#     document that has declared an identity. Documents are addressed by a
#     frontmatter `id`, not by path, so moving one cannot break a citation to
#     it; `docs/manifest.json` records id -> path so the tool can repoint the
#     legacy path-form citations by itself. This replaces check-doc-citations.sh
#     and check-normative-home.sh, which validated paths and so were brittle in
#     exactly the way their subject was -- and which only ever read Rust
#     comments, missing 16 dead markdown-to-markdown links.
#
#  2. invariants (scripts/check-invariants.sh): the architectural invariants
#     live in AGENTS.md and nowhere else, and the numbering that Rust doc
#     comments cite by ("AGENTS.md invariant #3") keeps resolving (#630).
#     CONTRIBUTING.md and README.md each carried a drifted second copy before
#     this existed.
#
#  3. command-docs (scripts/check-command-docs.sh): every `stella` subcommand
#     has a reference page the sidebar lists, and every page names a command
#     that still exists (#993). #928 found seven undocumented surfaces at once
#     precisely because nothing related the two.
#
#  4. brand-case (scripts/check-brand-case.sh): docs prose spells the
#     wordmark lowercase — "stella", never "Stella" (#1500). The rule was
#     documented in the brand kit and website/README.md and enforced nowhere;
#     389 capitalised uses accumulated, including inside `description:`
#     frontmatter, which becomes each page's meta description and llms.txt
#     entry. Code spans, fenced blocks, and URLs are exempt by construction.
#
#  5. gate-parity (scripts/check-gate-parity.sh): AGENTS.md and CONTRIBUTING.md
#     each restate what `make gate` runs, and both had drifted twice, each time
#     by omitting a guard that had just been added (#1437). The real list is
#     `GATE_STEPS` in the Makefile, which this reads via `make`.
#
#  6. god-files (scripts/check-god-files.sh): AGENTS.md's per-crate god-file
#     table and the twenty crate READMEs that restate it are held to
#     scripts/file-size-baseline.txt, which `make file-size-update` rewrites
#     without touching either (#1435).
#
#  7. design-refs (scripts/check-design-refs.sh): nothing outside the docs/design
#     scratchpad cites it, because anything in there may be rewritten, renamed
#     or deleted at any moment. It ran only in ci.yml's Rust job until #3888,
#     which a prose-only diff skips — so moving a document into that directory
#     could turn every Rust comment citing it into a violation and land green,
#     reddening main on a required check for everyone. It runs in both
#     workflows: its subject is Rust comments, so a Rust-only PR must run it
#     too.
#
#  8. website-inputs (scripts/check-website-inputs.sh): every `website/` path a
#     Rust source names is declared in scripts/website-rust-inputs.txt, and
#     every declared path still exists (#4632). ci.yml builds its prose
#     carve-out from the `read` entries, so the filter and the tests cannot
#     drift; this is the half that catches the move. A website-only PR is the
#     diff ci.yml's Rust job is skipped for, which is why the filter above
#     widened from `website/content/docs/**` to `website/**`.
#
#  9. the brand art's sources (docs/brand/social/build_social.py --check): the
#     banner's install line against README.md, and its tagline against the kit
#     page (#3631). Both are cross-file string claims that a render bakes into a
#     PNG a platform then caches, so drift is unfixable after the fact. The
#     script had never run in automation -- only a human following
#     docs/brand/README.md ever invoked it. `--check` returns before it reaches
#     rsvg-convert, so it needs no renderer and no desktop font.
#
# 10. the five colour rulers (scripts/check-tokens.py with gen-tokens.py
#     --check, check-hue-separation.py, check-contrast.py, check-css-vars.py,
#     check-light-clamp.py): what kind of colour a value is, whether two of
#     them can be told apart, whether one can be read on its ground, whether a
#     token sheet's every var() resolves, and whether a shipped light SURFACE
#     satisfies the clamp its family declares -- the fifth being the only one
#     that reads anything but the token table, which is why the light ground's
#     own clamp governed nothing that ships until #4941.
#     They ran only in ci.yml, whose `check` job is skipped
#     whole for a diff confined to `docs/**` and `website/**` -- the diff whose
#     subject is the brand kit, the standalone HTML documents, the two
#     hand-maintained token mirrors and the decks (#3653).
#
# 11. diagnostic-codes (scripts/check-diagnostic-codes.sh): every emitted
#     diagnostic code has a section in docs/reference/diagnostics.md, and every
#     code the website's curated table surfaces is still emitted at the level
#     that table claims (#3045). It runs in ci.yml too, and has to run here for
#     the same reason website-inputs does: the website table is `.mdx`, and a
#     PR that edits only it is the diff ci.yml's Rust job is skipped for. The
#     in-repo reference is generated and could not drift; the website copy is
#     hand-picked prose and could, which is the whole gap this closes.
#
# Rust sources are in the path filter because the first three read them: a
# citation added to a .rs comment is exactly how one goes stale, and the
# subcommand list the third guard checks is itself a Rust enum.
on:
  pull_request:
    paths:
      - "docs/**"
      - "**/*.md"
      - "**/*.rs"
      - "scripts/check-doc-links.py"
      - "scripts/check-invariants.sh"
      - "website/**"
      - "scripts/check-command-docs.sh"
      - "scripts/check-brand-case.sh"
      - "scripts/check-gate-parity.sh"
      - "scripts/check-god-files.sh"
      - "scripts/check-design-refs.sh"
      - "scripts/check-website-inputs.sh"
      - "scripts/website-rust-inputs.txt"
      - "scripts/check-diagnostic-codes.sh"
      - "scripts/diagnostic-codes.py"
      - "scripts/file-size-baseline.txt"
      - "README.md"
      - "scripts/check-tokens.py"
      - "scripts/gen-tokens.py"
      - "scripts/check-hue-separation.py"
      - "scripts/check-contrast.py"
      - "scripts/check-css-vars.py"
      - "scripts/check-light-clamp.py"
      - "scripts/contrast-baseline.txt"
      - "scripts/light-clamp-baseline.txt"
      - "design/tokens/**"
      - ".github/workflows/docs-guards.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "**/*.md"
      - "**/*.rs"
      - "scripts/check-doc-links.py"
      - "scripts/check-invariants.sh"
      - "website/**"
      - "scripts/check-command-docs.sh"
      - "scripts/check-brand-case.sh"
      - "scripts/check-gate-parity.sh"
      - "scripts/check-god-files.sh"
      - "scripts/check-design-refs.sh"
      - "scripts/check-website-inputs.sh"
      - "scripts/website-rust-inputs.txt"
      - "scripts/check-diagnostic-codes.sh"
      - "scripts/diagnostic-codes.py"
      - "scripts/file-size-baseline.txt"
      - "README.md"
      - "scripts/check-tokens.py"
      - "scripts/gen-tokens.py"
      - "scripts/check-hue-separation.py"
      - "scripts/check-contrast.py"
      - "scripts/check-css-vars.py"
      - "scripts/check-light-clamp.py"
      - "scripts/contrast-baseline.txt"
      - "scripts/light-clamp-baseline.txt"
      - "design/tokens/**"
      - ".github/workflows/docs-guards.yml"
  workflow_dispatch:

# Checkout plus read-only checks.
permissions:
  contents: read

jobs:
  check:
    name: docs guards
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The link checker rewrites files in `fix` mode, so the regexes deciding
      # what gets rewritten are tested before they are trusted on the tree.
      - name: doc-links selftest
        if: ${{ !cancelled() }}
        run: python3 scripts/check-doc-links.py selftest

      - name: every doc citation resolves to an identified document
        if: ${{ !cancelled() }}
        run: python3 scripts/check-doc-links.py check

      - name: the architectural invariants have one home and stable numbering
        if: ${{ !cancelled() }}
        run: bash scripts/check-invariants.sh

      # Also runs in ci.yml, which is where the important half is caught: a new
      # `Command` variant is a .rs change, so the required check sees it. This
      # copy covers the other direction, which ci.yml structurally cannot —
      # its prose filter means a PR that only deletes a reference page or
      # drops it from meta.json skips that workflow's Rust jobs.
      - name: every subcommand has a reference page
        if: ${{ !cancelled() }}
        run: bash scripts/check-command-docs.sh

      # Docs-only by nature — ci.yml also runs it for code PRs, but a
      # capitalised wordmark arrives in .mdx prose, which only this workflow
      # sees.
      - name: docs prose spells the wordmark lowercase
        if: ${{ !cancelled() }}
        run: bash scripts/check-brand-case.sh

      # The four colour rulers. They run in ci.yml, and ci.yml's `check` job is
      # skipped whole for a diff confined to `docs/**` and `website/**` — which
      # is the diff every one of them exists to judge. `docs/brand/`, the six
      # standalone HTML documents, the two hand-maintained token mirrors and the
      # decks are all inside the skipped paths, so a PR reintroducing a retired
      # hex into the brand kit, or darkening a licensed pairing, could land with
      # every reported check green (#3653). Same shape as #3888 and #4632 above,
      # one subject over.
      #
      # `--check` on the generator rides with them because it answers the
      # question the others assume: that the artifacts they read off the
      # authority are the ones the authority would produce.
      - name: the colour system is the one in the tree
        if: ${{ !cancelled() }}
        run: |
          python3 scripts/gen-tokens.py --check
          python3 scripts/check-tokens.py

      - name: no two web semantic roles sit within 30° of each other
        if: ${{ !cancelled() }}
        run: python3 scripts/check-hue-separation.py

      - name: every licensed colour pairing is readable on its ground
        if: ${{ !cancelled() }}
        run: python3 scripts/check-contrast.py

      - name: every var() in a token sheet resolves
        if: ${{ !cancelled() }}
        run: python3 scripts/check-css-vars.py

      # The four above read the token table. So did both enforcers of the
      # light ground's own `warm-paper` clamp, which is why that clamp
      # governed nothing that ships. This one reads the surfaces (#4941).
      - name: every shipped light surface satisfies its declared clamp
        if: ${{ !cancelled() }}
        run: python3 scripts/check-light-clamp.py

      # Both directions matter here, which is why it runs in ci.yml too. A new
      # guard is a Makefile change (ci.yml sees it); an edit that quietly drops
      # a step from AGENTS.md or CONTRIBUTING.md is an md change, and ci.yml's
      # prose filter means it structurally cannot see one (#1437).
      - name: the documented gate is the real gate
        if: ${{ !cancelled() }}
        run: bash scripts/check-gate-parity.sh

      # This is the copy that matters, and the reason the path filter above
      # widened from `website/content/docs/**` to `website/**` (#4632). A
      # website-only PR that renames, moves or deletes a file a Rust test reads
      # is precisely the diff ci.yml's Rust job is skipped for, so ci.yml
      # cannot report it — #4588 moved PROVIDER_CATALOG out of the file
      # `docs_sync` read and merged green, and `main` was red on a test nobody
      # had run until someone else's PR went red with it.
      - name: every website path a Rust source reads is declared, and present
        if: ${{ !cancelled() }}
        run: bash scripts/check-website-inputs.sh

      # Same two directions. The baseline moving is a non-md change ci.yml
      # catches; a README dropping a god file from its list, or a crate quietly
      # claiming it has none, arrives as pure markdown (#1435).
      - name: the god-file prose matches the baseline
        if: ${{ !cancelled() }}
        run: bash scripts/check-god-files.sh

      # The direction that bites is the docs-only one: a document moved into
      # the scratchpad turns every Rust comment citing it into a violation,
      # with no .rs file touched and ci.yml's Rust job skipped (#3888).
      - name: nothing outside docs/design cites docs/design
        if: ${{ !cancelled() }}
        run: bash scripts/check-design-refs.sh

      # The brand kit's two cross-file strings: the install line against
      # README.md, and now the tagline against the kit (#3631). `--check`
      # renders nothing and needs neither rsvg-convert nor a desktop font --
      # it returns before either is reached -- so it costs a second here.
      #
      # It had never run in automation at all. `check_install_line` has guarded
      # the banner's install command since the script was written, and the only
      # thing invoking it was a human following docs/brand/README.md. A guard
      # nobody runs is the same as no guard, which is the gap #4089 found for
      # five others.
      - name: the brand art's install line and tagline match their sources
        if: ${{ !cancelled() }}
        run: python3 docs/brand/social/build_social.py --check

      # The `.mdx` half. ci.yml runs this guard for the tree's own reference,
      # which is generated and cannot drift; the website's curated table is
      # hand-written, and a PR editing only it starts no Rust job at all
      # (#3045).
      - name: every emitted diagnostic code is documented
        if: ${{ !cancelled() }}
        run: ./scripts/check-diagnostic-codes.sh
