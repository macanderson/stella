name: tool-docs

# The server-side half of the same hole wire-schema.yml exists for (#1439).
#
# `docs/tools/` is generated from the tool declarations and committed, and
# `scripts/check-tool-docs.sh` is what makes committing it worth anything: it
# re-derives the directory and fails on any difference. That guard runs in
# ci.yml as part of `make gate` -- but ci.yml skips its Rust jobs for a diff
# confined to `docs/**`, so a pull request that hand-edits a generated page and
# nothing else never runs it. docs-guards.yml is deliberately toolchain-free
# and adding a Rust build to it would cost every prose PR a toolchain it has no
# use for.
#
# So the guard gets its own workflow on exactly the paths that can invalidate
# the pages: the pages themselves, the catalog that declares the tools, the
# generator, and the committed example fixture. A prose PR starts nothing here.
#
# The same gap exists in `.githooks/pre-push`, which drops to `make guards-fast`
# for a push reaching no crate -- and guards-fast compiles nothing, so it cannot
# run this. That is the case this workflow covers.
on:
  pull_request:
    paths:
      - "docs/tools/**"
      - "crates/stella-tools/src/catalog.rs"
      - "crates/stella-cli/src/tool_docs.rs"
      - "crates/stella-cli/tests/fixtures/tool_doc_examples.json"
      - "scripts/check-tool-docs.sh"
      - "scripts/build-tool-doc-examples.py"
      - ".github/workflows/tool-docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/tools/**"
      - "crates/stella-tools/src/catalog.rs"
      - "crates/stella-cli/src/tool_docs.rs"
      - "crates/stella-cli/tests/fixtures/tool_doc_examples.json"
      - "scripts/check-tool-docs.sh"
      - "scripts/build-tool-doc-examples.py"
      - ".github/workflows/tool-docs.yml"
  workflow_dispatch:

# Checkout plus a read-only re-derivation.
permissions:
  contents: read

concurrency:
  group: tool-docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: docs/tools still matches the declarations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Despite the action's name this does not build on `stable`:
      # rust-toolchain.toml pins the repo to a concrete toolchain and rustup
      # honors it for every cargo invocation inside the checkout. This step
      # exists to put *a* rustup on PATH.
      - name: Install Rust (rustup; the build uses the rust-toolchain.toml pin)
        id: rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        uses: Swatinem/rust-cache@258712b0b7b1ddf8bddc9fc3b0faca682b2736c3 # v2

      # Re-derives the pages and diffs them against the committed tree.
      # Regeneration is one command, named in the failure output:
      # `make tool-docs-update`.
      - name: docs/tools/ still matches the declarations
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: ./scripts/check-tool-docs.sh
