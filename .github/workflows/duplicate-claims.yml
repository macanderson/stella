name: duplicate-claims

# Two open pull requests claiming to close one issue are reported rather than
# both merged (#1722).
#
# #1616 was implemented three times by three parallel sessions and every one of
# them merged, producing two red-main incidents in under an hour and a witness
# test deleted twice. None of those merges conflicted: each branch was green on
# its own base, and only the merge product was broken — which is why no
# per-branch check could have caught it, and why this one reads the CLAIM
# rather than the diff.
#
# Its own workflow rather than a job in ci.yml, and with no paths-ignore, for
# the same reason empty-diff.yml is: this is a fact about the set of open pull
# requests, not about the files any one of them touches, so a path filter has
# nothing to reason about. It costs seconds and needs no toolchain.
#
# **Advisory on purpose.** It does not pass --strict, so it reports and exits
# 0. Two PRs may legitimately split one issue, and a guard that blocks the
# first time it is wrong is a guard people route around. Promote it to
# --strict once it has run clean for a while; the issue asks for exactly that
# order.

on:
  pull_request:

# Reads pull requests and nothing else.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: duplicate-claims-${{ github.ref }}
  cancel-in-progress: true

jobs:
  duplicate-claims:
    name: duplicate claims
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The guard's own tests first: they are hermetic (every case drives it
      # through --fixture) and they are what proves the guard can still FAIL.
      # A guard that has quietly become incapable of failing is the failure
      # mode this whole family of checks exists to prevent.
      - name: guard self-test
        run: ./scripts/test-duplicate-claims.sh

      - name: check open pull requests
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-duplicate-claims.sh
