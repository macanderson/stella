name: ci

on:
  pull_request:
    # Prose-only changes can't break the Rust build — don't spend an hour of
    # CI on them. Nothing here goes ungated: the site is built by docs.yml, and
    # `docs-guards.yml` triggers on `docs/**` and `**/*.md` to run the two
    # prose guards (doc citations resolve; the AGENTS.md invariant list has one
    # copy). It is deliberately isolated from this workflow.
    # (`*.md` matches the repo root only — GitHub's `*` stops at `/` — so a
    # crate's own README still pays the gate, which is what we want.)
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
  # Merge queue: GitHub tests each queued PR against the current queue tip
  # before it lands, so two individually-green PRs can't combine into a red
  # `main` (see #306). The queue evaluates the required checks on the
  # `merge_group` event, so `check` and `supply-chain` — the two required
  # contexts — must both fire here or the queue can never go green. Note
  # `merge_group` does NOT honor `paths-ignore`, so a docs-only PR that skips
  # the Rust gate on `pull_request` still runs the full gate once queued; that
  # is deliberate — the required check must report on the merged result.
  merge_group:
  workflow_dispatch:

concurrency:
  # Three event shapes, three behaviors — the ternary below routes each:
  #
  # - pull_request: group by PR ref, cancel-in-progress. A rapid string of
  #   pushes to the same PR only pays for the latest one.
  # - push to main: group by github.sha (per-commit), no cancel. GitHub keeps
  #   only one "in progress" and one "queued" run per group — a third push
  #   arriving while a prior main run is still queued would silently cancel
  #   that queued run, so a break could land with no red run to point at.
  #   Per-commit groups give every commit its own full-repo run to completion.
  # - merge_group (merge queue, #306): github.sha is the queued merge-group
  #   head, unique per queue entry, so each entry lands in its own group with
  #   no cancel — exactly what we want, since cancelling a merge_group run
  #   would fail that entry in the queue. The non-'pull_request' branch of the
  #   ternary already covers this; do not fold merge_group into the PR branch.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Both jobs only check out, build, and test — nothing here writes to the repo.
# Without the key, GITHUB_TOKEN falls back to the repository default, which on
# repos created before the 2023 default change is read/write on every scope.
permissions:
  contents: read

jobs:
  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    # Bundled SQLite (stella-store, rusqlite) and tree-sitter grammars are
    # heavy C compiles on a cold cache; rust-cache keeps warm runs fast.
    timeout-minutes: 60
    # Every gate below reports independently. A step here is a *verdict*, not a
    # prerequisite for the next one: fmt failing tells you nothing about clippy,
    # and the 1500-line ratchet tells you nothing about either. GitHub's default
    # — abort the job at the first non-zero exit — collapses all of them into
    # whichever happened to be ordered first, so a one-line baseline overage
    # ended a run in 9s with fmt, clippy, doc, test and the release smoke never
    # having run. You fix that, push, and only then learn what else was red:
    # one round trip per failure, serialized, at ~10 min a lap.
    #
    # So every gate carries `if: !cancelled()`, which runs it whether or not an
    # earlier gate failed. The job still goes red — these are not
    # `continue-on-error`, each failure is still a failure and `fmt + clippy +
    # test` is a required context — you just get the whole list in one run.
    #
    # Not `always()`: this workflow sets cancel-in-progress for pull_request
    # (see the concurrency block), and `always()` would keep a superseded run
    # grinding through the release build after a newer push had cancelled it.
    # `!cancelled()` respects cancellation and differs from `always()` only
    # there.
    #
    # Setup steps are the exception, and stay real prerequisites: the guards are
    # meaningless without a checkout, and the cargo gates are meaningless
    # without a toolchain — an ubuntu-latest runner ships a preinstalled Rust,
    # so a failed `Install Rust stable` would otherwise let fmt and clippy run
    # green on the wrong toolchain. Hence the explicit `steps.<id>.outcome`
    # guards rather than a bare `!cancelled()` on those.
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Cheap and toolchain-free, so it runs before the Rust setup: a tracked
      # file that matches .gitignore means agent scratch reached the remote
      # (#448), or an ignore rule is too broad to ever accept new files.
      - name: no tracked file is gitignored
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-no-scratch.sh

      # Toolchain-free, and first among equals: this repository is public, so a
      # tracked key is disclosed the moment it is pushed and a later deletion
      # does not undo it. .gitignore cannot cover a file added explicitly.
      - name: no private key material is tracked
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-no-secrets.sh

      # Also toolchain-free. The design scratchpad is work in flight and may be
      # rewritten at any time, so a citation into it is a reference with no
      # owner. Durable specs live in docs/spec.
      - name: nothing outside the design scratchpad cites it
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-design-refs.sh

      # Also toolchain-free, so it runs before the Rust setup: a floating
      # `uses:` ref lets the action's owner change what runs with this job's
      # secrets. Pinning is only durable if something re-checks it (#648).
      - name: every workflow action is pinned to a commit SHA
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-action-pins.sh

      # Also toolchain-free. `--locked` pins a tool's own dependency graph,
      # not the tool itself — this catches a `cargo install` that floats on
      # whatever version is newest at run time (#915).
      - name: every workflow cargo install is pinned to a version
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-cargo-install-pins.sh

      # Also toolchain-free. deny.toml and dependency-review.yml enforce the
      # same license allow-list at two different points; nothing else keeps
      # them in sync (#920).
      - name: deny.toml and dependency-review.yml license lists agree
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-license-allowlist-parity.sh

      # Also toolchain-free. The path remapping that makes a release binary
      # reproducible lives in scripts/repro-build.sh, and is worth nothing the
      # moment release.yml goes back to calling cargo directly — a regression
      # with no symptom until someone tries to rebuild a published tag (#910).
      # The bytes themselves are checked by release.yml's verify-reproducible
      # job, which needs two runners and an hour of LTO and so cannot run here.
      - name: release builds go through the reproducible builder
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-repro-wiring.sh

      # Also toolchain-free. Three fleet plans asserted a 1500-line file ratchet
      # that nothing enforced, so it decayed into decoration while the worst
      # offender grew past 4x the limit (#629). Existing offenders are
      # grandfathered with per-file ceilings; this blocks new bloat and any
      # further growth of the known ones.
      - name: no new .rs file over the 1500-line ratchet
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-file-size.sh

      # Also toolchain-free. #928 found seven CLI surfaces documented nowhere,
      # and the reason seven accumulated is that no gate related the `Command`
      # enum to the reference pages — a new subcommand could ship undocumented
      # and every check stayed green (#993). `doc-links` is a different
      # property: it checks that citations resolve, so a command nobody cited
      # was invisible to it.
      - name: every subcommand has a reference page
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-command-docs.sh

      # Also toolchain-free. The brand's lowercase rule was documented in two
      # places and enforced in none — 389 capitalised uses accumulated in the
      # docs tree, including inside `description:` frontmatter, which is what
      # search engines and model crawlers read first (#1500).
      - name: docs prose spells the wordmark lowercase
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-brand-case.sh

      # Also toolchain-free. #1394 renamed an agent-config role and the Rust
      # compiler found every Rust call site and none of the others — a Python
      # dict and a JavaScript literal kept the old spelling, and the arenabench
      # one failed *silently*: the seat ran with the verifier inheriting the
      # worker baseline while the scoreboard reported it as configured. A wrong
      # measurement, not a crash (#1449).
      - name: role names agree across Rust, Python and JavaScript
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-role-names.sh

      # Also toolchain-free. AGENTS.md requires that anything noticed and not
      # fixed becomes an issue written as a handoff; nothing checked it, and an
      # unenforced standard reads as one the codebase is meeting. The decidable
      # residue is a TODO/FIXME/XXX/HACK naming no issue (#1454). Unlike the
      # file-size ratchet this had nothing to grandfather — the baseline is
      # empty and is meant to stay empty.
      - name: every deferral marker names a tracking issue
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-left-behind.sh

      # Also toolchain-free. AGENTS.md and CONTRIBUTING.md each restate what
      # `make gate` runs, and both had drifted twice — each time by omitting a
      # newly added guard, which is the direction that misleads a reader into
      # thinking a short green list means a green gate (#1437). The list is
      # `GATE_STEPS` in the Makefile; this holds the prose to it.
      - name: the documented gate is the real gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-gate-parity.sh

      # Also toolchain-free (shellcheck ships preinstalled on ubuntu-latest).
      # install.sh is fetched over the network and piped into `sh` by
      # strangers before Stella is installed; the guard scripts are what the
      # rest of this gate's credibility rests on, and a quoting bug in one of
      # them fails open (#916).
      - name: shellcheck
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: shellcheck install.sh scripts/*.sh .githooks/*

      # NOTE: despite the action's name, this job does not build on `stable`.
      # rust-toolchain.toml pins the repo to a concrete toolchain (1.97.0), and
      # rustup honors that file for every cargo invocation inside the checkout —
      # so this step exists to put *a* rustup on PATH, and the pinned toolchain
      # (with the clippy/rustfmt components rust-toolchain.toml declares) is
      # what actually runs fmt, clippy, doc, test and the release smoke below.
      # The `components:` here apply to stable and are effectively inert; they
      # are kept so the step still works if the pin is ever removed.
      # The declared MSRV floor (rust-version = 1.90) is exercised separately,
      # by msrv.yml.
      - name: Install Rust (rustup; the build uses the rust-toolchain.toml pin)
        id: rust
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Nothing else in this job passes `--locked`, so a PR that edits a
      # manifest without committing the regenerated Cargo.lock builds green
      # here and breaks the paths that DO pin: install.sh's
      # `cargo install --locked --git --tag`, the Homebrew formula's
      # `cargo install --locked`, release.yml's `cargo build --release
      # --locked`, docker-serve.yml, and msrv.yml. Those all fail at release
      # time instead of review time.
      #
      # `cargo metadata` rather than `--locked` on the build steps: it is a
      # sub-second resolve that reports the drift precisely, instead of making
      # every later step's failure mode ambiguous between "lock is stale" and
      # "code is broken".
      - name: Cargo.lock is in sync with the manifests
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: |
          cargo metadata --locked --format-version 1 > /dev/null \
            || { echo "::error::Cargo.lock is out of sync with the manifests. Run 'cargo check --workspace' and commit the updated Cargo.lock."; exit 1; }

      - name: cargo fmt --check
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo fmt --check

      # DELIBERATELY UNSCOPED, and it must stay that way (#1135).
      #
      # The pre-push hook narrows these same three tiers — clippy, rustdoc,
      # test — to the crates a diff can reach, via scripts/impacted-crates.sh.
      # That is safe precisely because THIS job does not: the local gate can
      # afford to be clever because something unclever still compiles the whole
      # tree before anything merges.
      #
      # Scoping here too would leave no run anywhere that builds every member
      # pre-merge, and would make a bug in the impact graph invisible until
      # `main` goes red — the failure mode this repo pays for most often. The
      # graph has real escape hatches to get wrong: `include_str!` across crate
      # boundaries, and tests that climb out of CARGO_MANIFEST_DIR to read
      # `website/` or `docs/wire/` at run time.
      #
      # The cost argument does not apply here either. Runner time is parallel
      # and rust-cache keeps it warm, so it is not what blocks an author; the
      # two minutes the hook used to burn on every push is.
      - name: cargo clippy -D warnings
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      # docs/wire/ is generated from the types and committed, so it drifts the
      # moment `AgentEvent` changes — including its doc comments, which the
      # exporters carry into the schema verbatim (#971). This guard was the one
      # check-*.sh that no workflow ran: it lived only in `make gate`, so it
      # was enforced by the local pre-push hook and nothing else. A branch
      # pushed server-side never met it, which is how #1185 merged with a
      # rewritten `estimated_input_tokens` comment and stale artifacts. Needs
      # the toolchain — it runs the two exporters under `--features schema`.
      - name: docs/wire/ still matches the types
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: ./scripts/check-wire-schema.sh

      # Nothing gated rustdoc, so its warning count only grew — one crate's doc
      # link to a private fn had made `cargo doc` a hard failure, unnoticed
      # (#634). Gating is what stops it regrowing.
      - name: cargo doc -D warnings
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps

      # Prompt caching has no stale-read failure mode: a hit and a miss return
      # the same tokens, so a broken cache never fails a test that asserts on
      # output — it just quietly bills full price on every call. The golden
      # manifests record where the breakpoints fell (`cache_zone` per block),
      # which makes the drift checkable. `cargo test` below covers these too;
      # they run first, and by name, because "the system prefix stopped being
      # byte-stable" deserves better than being one line inside a full-suite
      # wall of output. Cheap: the compile is shared with the step after it.
      - name: prompt-cache correctness (golden fixtures)
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: make cache-correctness

      - name: cargo test
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo test --workspace

      # Context governance as a PR check (docs/context-pr.md section 12, #994):
      # when this repository publishes context records, every PR re-validates
      # them — truth probes, conflicts, and the promotion ledger's hash chain —
      # and fails on anything that must not steer. A workspace without records
      # skips in one stat call.
      - name: stella context validate
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: |
          if [ -d .stella/rules ] || [ -d .claude/rules ]; then
            cargo run -p stella-cli --quiet -- context validate
          else
            echo "no published context records — nothing to validate"
          fi

      - name: cargo build (release smoke, thin LTO)
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo build --workspace --release --config 'profile.release.lto="thin"' --config 'profile.release.codegen-units=16'

  supply-chain:
    # NOTE: name is pinned to main's branch-protection required-status-check
    # list (`cargo deny + cargo audit`) even though this job no longer runs
    # cargo-audit (#919 — cargo-deny with unmaintained="all"/yanked="deny" is
    # a strict superset of what cargo-audit contributed here, and two tools
    # reading advisory-suppression policy from two different files meant a
    # suppression added to deny.toml's `[advisories] ignore` never applied to
    # cargo-audit). Renaming it would make GitHub wait forever on a context
    # that never reports again — see bench/READINESS.md for the same failure
    # mode with a different check. Do not rename without updating branch
    # protection (repo admin, out of band) in the same change.
    name: cargo deny + cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      # Pinned by exact version, not just `--locked`: `--locked` fixes the
      # tool's own transitive graph but not the tool itself, so an unpinned
      # `cargo install` here resolves whatever cargo-deny is newest at run
      # time — the one job whose purpose is keeping untrusted code out is
      # also the only one fetching an unversioned executable from the
      # network (#915). Bump this deliberately, like the toolchain pin.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2

      # Real gate (no `|| true`): advisories + dependency bans + source
      # provenance + licenses, configured in deny.toml. The license check is a
      # hard gate because the workspace is AGPL-3.0-only and dual-licensed —
      # a dependency we cannot sublicense breaks both the AGPL distribution
      # and the commercial track (see deny.toml and LICENSING.md).
      - name: cargo deny check
        run: cargo deny check advisories bans sources licenses
