name: ci

on:
  # Deliberately NO `paths-ignore` here (#1892). Both jobs below are required
  # branch-protection contexts, and a workflow suppressed by a trigger-level
  # path filter reports nothing at all — GitHub then waits forever for the
  # missing contexts, and a docs-only PR is permanently BLOCKED with every
  # reported check green (#1863). A job skipped by an `if:` DOES report (as
  # `skipped`) and satisfies a required context, so the prose filter lives in
  # the `changes` job below instead: same cost saving — a prose-only PR pays
  # one diff, not an hour of Rust — but the contexts always report. bench.yml
  # solved the same trap the same way for its required context (#659).
  #
  # Prose changes still can't break the Rust build, and nothing goes ungated:
  # the site is built by docs.yml, and `docs-guards.yml` triggers on `docs/**`
  # and `**/*.md` to run the prose guards. It is deliberately isolated from
  # this workflow.
  pull_request:
  # A push to `main` is not gated by required contexts, so the trigger-level
  # filter is still safe here — a docs-only merge does not start the Rust
  # gate at all. Keep this list and the `changes` job's regex in agreement.
  push:
    branches: [main]
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
  # Merge queue: GitHub tests each queued PR against the current queue tip
  # before it lands, so two individually-green PRs can't combine into a red
  # `main` (see #306). The queue evaluates the required checks on the
  # `merge_group` event, so `check` and `supply-chain` — the two required
  # contexts — must both fire here or the queue can never go green. The
  # `changes` job answers `rust=true` for every non-pull_request event, so a
  # docs-only PR that skipped the Rust gate on `pull_request` still runs the
  # full gate once queued; that is deliberate — the required check must report
  # on the merged result.
  merge_group:
  workflow_dispatch:

concurrency:
  # Three event shapes, three behaviors — the ternary below routes each:
  #
  # - pull_request: group by PR ref, cancel-in-progress. A rapid string of
  #   pushes to the same PR only pays for the latest one.
  # - push to main: group by github.sha (per-commit), no cancel. GitHub keeps
  #   only one "in progress" and one "queued" run per group — a third push
  #   arriving while a prior main run is still queued would silently cancel
  #   that queued run, so a break could land with no red run to point at.
  #   Per-commit groups give every commit its own full-repo run to completion.
  # - merge_group (merge queue, #306): github.sha is the queued merge-group
  #   head, unique per queue entry, so each entry lands in its own group with
  #   no cancel — exactly what we want, since cancelling a merge_group run
  #   would fail that entry in the queue. The non-'pull_request' branch of the
  #   ternary already covers this; do not fold merge_group into the PR branch.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job only checks out, builds, and tests — nothing here writes to the repo.
# Without the key, GITHUB_TOKEN falls back to the repository default, which on
# repos created before the 2023 default change is read/write on every scope.
permissions:
  contents: read

jobs:
  # The prose filter that used to be a trigger-level `paths-ignore` (#1892).
  # It has to be a job so that the two required jobs below can skip — and a
  # skipped job still reports its context, which a path-suppressed workflow
  # does not (see the trigger comment above).
  changes:
    name: is this diff prose-only?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
    steps:
      # Full history, pull requests only: the scope check diffs against the PR
      # base, and a shallow clone may not contain the merge base. Every other
      # event runs the full gate without looking at the diff, so it needs no
      # checkout at all.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Does this diff reach past the prose paths?
        id: scope
        env:
          # Via env rather than inlined into the shell, so a ref name can
          # never be read as script (same shape as empty-diff.yml).
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # Anything that is not a PR — a push to main, the merge queue, a
          # manual dispatch — always runs the full gate: main and the queued
          # merge result are what the green claim is about.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The prose paths, mirroring the push trigger's paths-ignore above:
          # website/, docs/, .github/ISSUE_TEMPLATE/, and root-level *.md
          # only (`[^/]+\.md$` stops at the first `/`, like the glob `*.md` —
          # a crate's own README still pays the gate, which is what we want).
          # `grep -v` inverts: any changed file OUTSIDE those paths means the
          # gate runs. An empty diff runs nothing here — reporting that PR is
          # empty-diff.yml's job.
          #
          # The one prose path that is not prose-only: a command reference page
          # is asserted about by `stella-cli`'s own tests — the subcommand
          # index, the per-command summaries, and since #3041 every flag's card
          # — so editing one without running them is exactly the hole that
          # sends `check-command-docs.sh` to `docs-guards.yml` a second time.
          # A deleted card is a red test, and a test that never ran is green.
          if git diff --name-only "$BASE_SHA"...HEAD \
            | grep -Evq '^(website/|docs/|\.github/ISSUE_TEMPLATE/)|^[^/]+\.md$'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE_SHA"...HEAD \
            | grep -q '^website/content/docs/commands/'; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
            echo "Prose-only diff — the Rust gate is skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "Both required contexts still report (as skipped), so the PR can merge." >> "$GITHUB_STEP_SUMMARY"
          fi

  check:
    name: fmt + clippy + test
    needs: changes
    # Skip — never suppress — for a prose-only diff: a skipped job still
    # reports its required context (#1892). `!= 'false'` rather than
    # `== 'true'` so a failed `changes` job fails closed: no output reads as
    # "run the gate". `!cancelled()` (not the implicit success()) is what
    # lets this evaluate at all in that case.
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    # Job-level permissions REPLACE the workflow-level block above rather than
    # adding to it, so `contents: read` is restated here — the only addition
    # is `pull-requests: read`, which is what lets the deleted-test guard read
    # a PR's CURRENT description via `gh pr view` (#4495) instead of only the
    # stale payload snapshot every other step already had no need for.
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    # Bundled SQLite (stella-store, rusqlite) and tree-sitter grammars are
    # heavy C compiles on a cold cache; rust-cache keeps warm runs fast.
    timeout-minutes: 60
    # Every gate below reports independently. A step here is a *verdict*, not a
    # prerequisite for the next one: fmt failing tells you nothing about clippy,
    # and the 1500-line ratchet tells you nothing about either. GitHub's default
    # — abort the job at the first non-zero exit — collapses all of them into
    # whichever happened to be ordered first, so a one-line baseline overage
    # ended a run in 9s with fmt, clippy, doc, test and the release smoke never
    # having run. You fix that, push, and only then learn what else was red:
    # one round trip per failure, serialized, at ~10 min a lap.
    #
    # So every gate carries `if: !cancelled()`, which runs it whether or not an
    # earlier gate failed. The job still goes red — these are not
    # `continue-on-error`, each failure is still a failure and `fmt + clippy +
    # test` is a required context — you just get the whole list in one run.
    #
    # Not `always()`: this workflow sets cancel-in-progress for pull_request
    # (see the concurrency block), and `always()` would keep a superseded run
    # grinding through the release build after a newer push had cancelled it.
    # `!cancelled()` respects cancellation and differs from `always()` only
    # there.
    #
    # Setup steps are the exception, and stay real prerequisites: the guards are
    # meaningless without a checkout, and the cargo gates are meaningless
    # without a toolchain — an ubuntu-latest runner ships a preinstalled Rust,
    # so a failed `Install Rust stable` would otherwise let fmt and clippy run
    # green on the wrong toolchain. Hence the explicit `steps.<id>.outcome`
    # guards rather than a bare `!cancelled()` on those.
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Two, not one: on a `pull_request` event this checks out
          # `refs/pull/N/merge`, and the deleted-test guard below reads that
          # merge commit's first parent (the base branch tip) to ask what the
          # merge dropped. It compares two TREES, not two histories, so one
          # extra commit is the whole cost — a full-depth clone would buy
          # nothing and slow every run.
          fetch-depth: 2

      # Cheap and toolchain-free, so it runs before the Rust setup: a tracked
      # file that matches .gitignore means agent scratch reached the remote
      # (#448), or an ignore rule is too broad to ever accept new files.
      - name: no tracked file is gitignored
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-no-scratch.sh

      # Toolchain-free, and first among equals: this repository is public, so a
      # tracked key is disclosed the moment it is pushed and a later deletion
      # does not undo it. .gitignore cannot cover a file added explicitly.
      - name: no private key material is tracked
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-no-secrets.sh

      # Also toolchain-free. The design scratchpad is work in flight and may be
      # rewritten at any time, so a citation into it is a reference with no
      # owner. Durable specs live in docs/spec.
      - name: nothing outside the design scratchpad cites it
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-design-refs.sh

      # Also toolchain-free, so it runs before the Rust setup: a floating
      # `uses:` ref lets the action's owner change what runs with this job's
      # secrets. Pinning is only durable if something re-checks it (#648).
      - name: every workflow action is pinned to a commit SHA
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-action-pins.sh

      # Also toolchain-free. `--locked` pins a tool's own dependency graph,
      # not the tool itself — this catches a `cargo install` that floats on
      # whatever version is newest at run time (#915).
      - name: every workflow cargo install is pinned to a version
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-cargo-install-pins.sh

      # Also toolchain-free. deny.toml and dependency-review.yml enforce the
      # same license allow-list at two different points; nothing else keeps
      # them in sync (#920).
      - name: deny.toml and dependency-review.yml license lists agree
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-license-allowlist-parity.sh

      # Also toolchain-free. The path remapping that makes a release binary
      # reproducible lives in scripts/repro-build.sh, and is worth nothing the
      # moment release.yml goes back to calling cargo directly — a regression
      # with no symptom until someone tries to rebuild a published tag (#910).
      # The bytes themselves are checked by release.yml's verify-reproducible
      # job, which needs two runners and an hour of LTO and so cannot run here.
      - name: release builds go through the reproducible builder
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-repro-wiring.sh

      # Also toolchain-free. Three fleet plans asserted a 1500-line file ratchet
      # that nothing enforced, so it decayed into decoration while the worst
      # offender grew past 4x the limit (#629). Existing offenders are
      # grandfathered with per-file ceilings; this blocks new bloat and any
      # further growth of the known ones.
      - name: no new .rs file over the 1500-line ratchet
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-file-size.sh

      # Also toolchain-free. #928 found seven CLI surfaces documented nowhere,
      # and the reason seven accumulated is that no gate related the `Command`
      # enum to the reference pages — a new subcommand could ship undocumented
      # and every check stayed green (#993). `doc-links` is a different
      # property: it checks that citations resolve, so a command nobody cited
      # was invisible to it.
      - name: every subcommand has a reference page
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-command-docs.sh

      # Also toolchain-free. The brand's lowercase rule was documented in two
      # places and enforced in none — 389 capitalised uses accumulated in the
      # docs tree, including inside `description:` frontmatter, which is what
      # search engines and model crawlers read first (#1500).
      - name: docs prose spells the wordmark lowercase
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-brand-case.sh

      # Also toolchain-free. `make file-size-update` regenerates the baseline
      # and touches neither AGENTS.md's god-file table nor the twenty crate
      # READMEs that restate it, so a split or rename stranded all three
      # silently — the same duplicated-normative-prose shape as #630 (#1435).
      - name: the god-file prose matches the baseline
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-god-files.sh

      # Also toolchain-free. #1394 renamed an agent-config role and the Rust
      # compiler found every Rust call site and none of the others — a Python
      # dict and a JavaScript literal kept the old spelling, and the arenabench
      # one failed *silently*: the seat ran with the verifier inheriting the
      # worker baseline while the scoreboard reported it as configured. A wrong
      # measurement, not a crash (#1449).
      - name: role names agree across Rust, Python and JavaScript
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-role-names.sh

      # Also toolchain-free, and the reason it must be: `dev_t` is signed on
      # macOS and unsigned on Linux, so a raw `libc::stat` identity comparison
      # compiles on the author's machine and fails on this runner — or the
      # reverse. #1737 shipped that rewrite half-finished and `main` went red
      # behind it for every open PR (#1752). Catching it in a guard costs
      # milliseconds and runs on the author's own pre-push hook, which is an
      # hour earlier than here (#1758).
      - name: file identity goes through MetadataExt, not a raw libc::stat
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-stat-portability.sh

      # Toolchain-free, and it has to be: the three gates that would normally
      # catch a broken file all walk `mod` declarations from the crate root, so
      # deleting one line hides a file from rustc, rustfmt and clippy at the
      # same moment while `cargo test` still reports ok. #1739 lost 19 tests
      # that way and only a reviewer reading the diff noticed (#1750).
      - name: every src/ file is reachable from its crate root
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 ./scripts/check-module-reachability.py

      # Also toolchain-free. AGENTS.md requires that anything noticed and not
      # fixed becomes an issue written as a handoff; nothing checked it, and an
      # unenforced standard reads as one the codebase is meeting. The decidable
      # residue is a TODO/FIXME/XXX/HACK naming no issue (#1454). Unlike the
      # file-size ratchet this had nothing to grandfather — the baseline is
      # empty and is meant to stay empty.
      - name: every deferral marker names a tracking issue
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-left-behind.sh

      # Also toolchain-free, and the only gate here that is a question about
      # TWO trees rather than one — which is why it has no `make gate` step to
      # match. Three times a PR has landed that silently deleted a test another
      # PR added to the same file hours earlier: both sides green, the merge
      # textually clean, and a witness quietly gone from the tree (#1976). It
      # compares the base branch tip against the merge result, so it is quiet
      # on a merely stale branch, and it asks for an acknowledgement rather
      # than forbidding deletion — naming the test in this PR's description
      # passes it. `pull_request` only: on a squash-merged push to `main` there
      # is no merge to inspect and the report would arrive too late anyway.
      #
      # PR_NUMBER lets the guard fetch the description LIVE through the API
      # (`gh pr view`, with the job's own `pull-requests: read` grant below)
      # instead of only the PR_BODY snapshot frozen at trigger time — #4495:
      # a re-run of this job used to replay that same stale payload, so
      # editing the description and re-running never satisfied it, only a
      # new push did. PR_BODY stays wired as the fallback for when the live
      # fetch is unavailable (no `gh`, an unreachable API).
      - name: no test disappears in the merge unacknowledged
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' && github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: ./scripts/check-deleted-tests.sh

      # Also toolchain-free. AGENTS.md and CONTRIBUTING.md each restate what
      # `make gate` runs, and both had drifted twice — each time by omitting a
      # newly added guard, which is the direction that misleads a reader into
      # thinking a short green list means a green gate (#1437). The list is
      # `GATE_STEPS` in the Makefile; this holds the prose to it.
      - name: the documented gate is the real gate
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-gate-parity.sh

      # The five below were in `GATE_GUARDS_FAST` and in no workflow at all
      # (#4089). `gate-parity` above holds AGENTS.md and CONTRIBUTING.md to
      # `GATE_STEPS`, which is a question about the prose — it says nothing
      # about whether anything server-side runs a given step, and that is the
      # gap these close.
      #
      # It is not theoretical. `tokens` was red on `main` from #4066 until
      # #4086 — seven retired brand hexes and thirteen stray literals — and no
      # workflow said so, on a tree whose every PR was otherwise green. The
      # pre-push hook runs them, but it is advisory, per-clone, and bypassable
      # (`SKIP_GATE=1`, `--no-verify`), and with `enforce_admins` off an
      # auto-merge lands past it. AGENTS.md already says the hook "complements
      # the required server-side checks rather than replacing them"; for these
      # five there was no server-side check to complement.
      #
      # All toolchain-free (Python and shell over the tree), so they sit here
      # with the other guards rather than after the cargo setup, and cost about
      # a second each. Each carries the same `!cancelled()` as its neighbours,
      # so a red one reports independently instead of masking the next.
      - name: the colour system is the one in the tree
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: |
          python3 ./scripts/gen-tokens.py --check
          python3 ./scripts/check-tokens.py

      # The second colour ruler: the step above asks what kind of colour each
      # value is, one at a time; this asks whether any two of them can be told
      # apart. It was in `GATE_GUARDS_FAST` and in no workflow — the same gap
      # #4089 found for five other guards, and it went unnoticed here because
      # `gate-parity` above holds the *prose* to `GATE_STEPS` and says nothing
      # about whether anything server-side runs a step (#4071).
      - name: no two web semantic roles sit within 30° of each other
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 ./scripts/check-hue-separation.py

      # The third colour ruler, and the one that says whether a value can be
      # read at all. It existed in the tree for two releases with no make target
      # and no workflow step, exiting 1 by hand on four palette pairings while
      # two brand documents quoted figures it disagreed with (#4423). The four
      # are held at their exact measured ratio by a down-only ratchet, so this
      # is red the moment one of them gets darker.
      - name: every licensed colour pairing is readable on its ground
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 ./scripts/check-contrast.py

      # A sibling question the check above cannot answer: it reasons about hex
      # literals, and an unresolvable var() is not a parse error. A token sheet
      # can name a stop deleted two releases ago, every page still renders off
      # the consumer's fallback, and the sheet goes on stating a rule the tree
      # does not apply (#4122).
      - name: every var() in a token sheet resolves
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 ./scripts/check-css-vars.py

      # The two deck guards, whose subject is `website/public/presentations/`
      # but whose failing DIFF is usually a Rust one. deck-fit.yml runs
      # check-deck-paths on the other direction — an edit to a deck — and
      # triggers on the deck paths alone; this job is what sees the direction
      # that actually strands a citation, which is a module moving in
      # `crates/`. Neither needs a browser, so neither belongs in that
      # workflow's browser job (#3404, #3573).
      - name: the deck enumeration still walks recursively
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/test-deck-fit-all.sh

      - name: every path the decks cite still resolves
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 ./scripts/check-deck-paths.py

      # A question no compiler asks and this runner cannot fail on its own:
      # `AUX`, `CON`, `NUL` and friends are Windows device names, so git there
      # refuses to check the path out and the repository is unclonable — while
      # the name is perfectly legal Rust and perfectly legal POSIX. Two of them
      # sat in this tree for as long as their modules existed. windows-check.yml
      # does catch them, one per run, at checkout; this catches all of them at
      # once wherever they are, on the runner every PR already waits for.
      - name: no tracked path uses a Windows device name
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-reserved-paths.sh

      - name: no library crate returns Result<_, String>
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 ./scripts/check-typed-errors.py

      - name: every dead-code suppression says why
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: python3 ./scripts/check-dead-code-allows.py

      - name: every emitted diagnostic code is documented
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-diagnostic-codes.sh

      # Also toolchain-free. consumers.rs is explicit that a Behavioral row's
      # `site` string is unchecked prose for a reviewer (AGENTS.md invariant
      # 10) — #3881 verified all of them by hand, and nothing preserved that
      # once a symbol moves or is renamed (#4459).
      - name: every ConsumerPosture::Behavioral site points at live code
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-consumer-sites.sh

      - name: make bench-test runs every suite bench.yml runs
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-bench-suites.sh

      # The same shape one workflow over: `.githooks/pre-push` chooses between
      # `make guards-fast` and `make guards` on wire-schema.yml's `paths:`
      # filter, and used to carry its own copy of it under a comment naming the
      # hazard. A divergence there is silent and in the direction that
      # misleads — the cheap rung for a diff the workflow would have called
      # wire-touching (#3836).
      - name: the pre-push hook derives wire-schema.yml's paths filter
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        run: ./scripts/check-wire-paths.sh

      # Also toolchain-free (shellcheck ships preinstalled on ubuntu-latest).
      # install.sh is fetched over the network and piped into `sh` by
      # strangers before Stella is installed; the guard scripts are what the
      # rest of this gate's credibility rests on, and a quoting bug in one of
      # them fails open (#916).
      - name: shellcheck
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        # The file list lives in the Makefile target and nowhere else. It used
        # to be spelled out here as well, with a comment asking the next author
        # to keep the two copies matching — and they diverged anyway: #3353
        # taught the Makefile the `scripts/lib/*.sh` glob (shellcheck only
        # follows a sourced file it was handed, so without it every script
        # sourcing the help-header helper trips SC1091), this copy kept the old
        # list, and the step was red on every PR until #3372 repaired it.
        # `make` is available on ubuntu-latest and the target shells out to
        # shellcheck directly, so this step stays toolchain-free (#3375).
        run: make shellcheck

      # NOTE: despite the action's name, this job does not build on `stable`.
      # rust-toolchain.toml pins the repo to a concrete toolchain (1.97.0), and
      # rustup honors that file for every cargo invocation inside the checkout —
      # so this step exists to put *a* rustup on PATH, and the pinned toolchain
      # (with the clippy/rustfmt components rust-toolchain.toml declares) is
      # what actually runs fmt, clippy, doc, test and the release smoke below.
      # The `components:` here apply to stable and are effectively inert; they
      # are kept so the step still works if the pin is ever removed.
      # The declared MSRV floor (rust-version = 1.90) is exercised separately,
      # by msrv.yml.
      - name: Install Rust (rustup; the build uses the rust-toolchain.toml pin)
        id: rust
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: clippy, rustfmt

      - if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # Nothing else in this job passes `--locked`, so a PR that edits a
      # manifest without committing the regenerated Cargo.lock builds green
      # here and breaks the paths that DO pin: install.sh's
      # `cargo install --locked --git --tag`, the Homebrew formula's
      # `cargo install --locked`, release.yml's `cargo build --release
      # --locked`, docker-serve.yml, and msrv.yml. Those all fail at release
      # time instead of review time.
      #
      # `cargo metadata` rather than `--locked` on the build steps: it is a
      # sub-second resolve that reports the drift precisely, instead of making
      # every later step's failure mode ambiguous between "lock is stale" and
      # "code is broken".
      #
      # The command itself moved into scripts/check-lockfile-sync.sh so this job
      # and `make gate` cannot disagree about what "in sync" means, and so the
      # check reaches the pre-push hook — where it catches a stale lock before
      # the push rather than after review (#3332). This step stays because it is
      # the required job: the hook is advisory and bypassable.
      - name: Cargo.lock is in sync with the manifests
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: |
          ./scripts/check-lockfile-sync.sh \
            || { echo "::error::Cargo.lock is out of sync with the manifests. Run 'cargo check --workspace' and commit the updated Cargo.lock."; exit 1; }

      - name: cargo fmt --check
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo fmt --check

      # DELIBERATELY UNSCOPED, and it must stay that way (#1135).
      #
      # The pre-push hook narrows these same three tiers — clippy, rustdoc,
      # test — to the crates a diff can reach, via scripts/impacted-crates.sh.
      # That is safe precisely because THIS job does not: the local gate can
      # afford to be clever because something unclever still compiles the whole
      # tree before anything merges.
      #
      # Scoping here too would leave no run anywhere that builds every member
      # pre-merge, and would make a bug in the impact graph invisible until
      # `main` goes red — the failure mode this repo pays for most often. The
      # graph has real escape hatches to get wrong: `include_str!` across crate
      # boundaries, and tests that climb out of CARGO_MANIFEST_DIR to read
      # `website/` or `docs/wire/` at run time.
      #
      # The cost argument does not apply here either. Runner time is parallel
      # and rust-cache keeps it warm, so it is not what blocks an author; the
      # two minutes the hook used to burn on every push is.
      - name: cargo clippy -D warnings
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo clippy --workspace --all-targets -- -D warnings

      # docs/wire/ is generated from the types and committed, so it drifts the
      # moment `AgentEvent` changes — including its doc comments, which the
      # exporters carry into the schema verbatim (#971). This guard was the one
      # check-*.sh that no workflow ran: it lived only in `make gate`, so it
      # was enforced by the local pre-push hook and nothing else. A branch
      # pushed server-side never met it, which is how #1185 merged with a
      # rewritten `estimated_input_tokens` comment and stale artifacts. Needs
      # the toolchain — it runs the two exporters under `--features schema`.
      - name: docs/wire/ still matches the types
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: ./scripts/check-wire-schema.sh

      # Nothing gated rustdoc, so its warning count only grew — one crate's doc
      # link to a private fn had made `cargo doc` a hard failure, unnoticed
      # (#634). Gating is what stops it regrowing. `--document-private-items`
      # because rustdoc only checks links in items it documents, so without it
      # every broken link in a private or pub(crate) item is invisible (#2336);
      # `--keep-going` so one failing crate cannot mask the ones behind it.
      - name: cargo doc -D warnings
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --document-private-items --keep-going

      - name: cargo test
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo test --workspace

      # Context governance as a PR check (docs/context-pr.md section 12, #994):
      # when this repository publishes context records, every PR re-validates
      # them — truth probes, conflicts, and the promotion ledger's hash chain —
      # and fails on anything that must not steer. A workspace without records
      # skips in one stat call.
      - name: stella context validate
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: |
          if [ -d .stella/rules ] || [ -d .claude/rules ]; then
            cargo run -p stella-cli --quiet -- context validate
          else
            echo "no published context records — nothing to validate"
          fi

      - name: cargo build (release smoke, thin LTO)
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: cargo build --workspace --release --config 'profile.release.lto="thin"' --config 'profile.release.codegen-units=16'

      # Two guard self-tests that want the toolchain, so they sit here rather
      # than in guard-self-tests.yml with their twenty toolchain-free siblings
      # (#3820, #4427). This one is also a `GATE_STEPS` member that ran in no
      # workflow at all: it drives the real `stella` binary and builds one when
      # it cannot find it.
      - name: the self-driving control logic
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: ./scripts/test-self-driving.sh

      # The other one runs `cargo metadata` against a synthetic workspace a
      # dozen times, so it wants the toolchain too — and it wants ripgrep,
      # which ubuntu-latest does not ship. `scripts/impacted-crates.sh` answers
      # `--workspace` for anything it cannot narrow with confidence, and a
      # missing `rg` is one of those things, so without it every narrowing case
      # reads as a failure: 13 of 25 red, each `want=[-p leaf]
      # got=[--workspace]`, reporting the runner rather than the scoper.
      #
      # Installed rather than skipped. A `command -v rg || skip` would leave
      # this suite reporting green on every run while proving nothing, which is
      # the exact failure #3820 exists to end.
      - name: gate-scoping picks the right crates
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: |
          command -v rg >/dev/null 2>&1 || {
            sudo apt-get update -qq
            sudo apt-get install -y -qq ripgrep
          }
          ./scripts/test-impacted-crates.sh

      # Last main step in the job, so it runs before rust-cache's post step —
      # which is the whole point (#4149).
      #
      # `cargo test --workspace` above runs stella-diag's trybuild suite
      # (crates/stella-diag/tests/compile_fail.rs). trybuild builds its scratch
      # project under `${target_dir}/tests/trybuild` — hardcoded, with no
      # override short of moving the whole build (trybuild 1.0.118
      # src/cargo.rs:58-62) — so `target/tests` exists afterwards, with no
      # sibling `target/` inside it.
      #
      # rust-cache's post step then walks `target/` to prune it before saving.
      # At the SHA pinned above (and still on its master as of 2026-08-21),
      # src/cleanup.ts:20-24 classifies ANY directory named `tests` as a build
      # profile, and :45-50 calls `cleanTargetDir(<dir>/target)` *without
      # awaiting it*, inside a `try {} catch {}` that therefore cannot catch
      # the rejection. The ENOENT escapes to save.ts:8-11's `uncaughtException`
      # handler, which emits `core.error(e.message)` and `core.error(e.stack)`:
      # two failure-level annotations on a step that cannot fail the job. Every
      # green run of this job carried them, and an annotations panel that is
      # permanently red is one a reader stops reading — the same erosion the
      # main-red-hold reasoning names one layer down. Upstream fixed this same
      # bug class for the registry path (Swatinem/rust-cache#144) and left this
      # call site alone.
      #
      # Deleting the scratch tree removes the trigger at the one point we
      # control. It costs one cold trybuild rebuild per run (~5s, measured
      # locally) because that tree is no longer cached, and it keeps a fixture
      # cargo manifest out of the saved cache for the next tool that scans for
      # workspaces. #4177 tracks reporting it upstream and deleting this step
      # once the pin can be bumped past the fix.
      - name: drop the trybuild scratch tree before the cache is saved
        if: ${{ !cancelled() }}
        run: rm -rf target/tests

  supply-chain:
    # NOTE: name is pinned to main's branch-protection required-status-check
    # list (`cargo deny + cargo audit`) even though this job no longer runs
    # cargo-audit (#919 — cargo-deny with unmaintained="all"/yanked="deny" is
    # a strict superset of what cargo-audit contributed here, and two tools
    # reading advisory-suppression policy from two different files meant a
    # suppression added to deny.toml's `[advisories] ignore` never applied to
    # cargo-audit). Renaming it would make GitHub wait forever on a context
    # that never reports again — see bench/READINESS.md for the same failure
    # mode with a different check. Do not rename without updating branch
    # protection (repo admin, out of band) in the same change.
    name: cargo deny + cargo audit
    needs: changes
    # Same skip discipline as `check` above: report the required context as
    # skipped for a prose-only diff, and fail closed if `changes` failed.
    if: ${{ !cancelled() && needs.changes.outputs.rust != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2

      # Pinned by exact version, not just `--locked`: `--locked` fixes the
      # tool's own transitive graph but not the tool itself, so an unpinned
      # `cargo install` here resolves whatever cargo-deny is newest at run
      # time — the one job whose purpose is keeping untrusted code out is
      # also the only one fetching an unversioned executable from the
      # network (#915). Bump this deliberately, like the toolchain pin.
      - name: Install cargo-deny
        run: cargo install --locked cargo-deny@0.20.2

      # Real gate (no `|| true`): advisories + dependency bans + source
      # provenance + licenses, configured in deny.toml. The license check is a
      # hard gate because the workspace is AGPL-3.0-only and dual-licensed —
      # a dependency we cannot sublicense breaks both the AGPL distribution
      # and the commercial track (see deny.toml and LICENSING.md).
      - name: cargo deny check
        run: cargo deny check advisories bans sources licenses
