name: containment-posture

# Asserts, on a real GitHub Actions Linux runner, that the #2931 graded-tree
# write ban is actually Enforced -- not merely present in source (#2998).
#
# `crates/stella-tools/tests/graded_tree_containment.rs` calls
# `contain::posture()` and, by default, *skips* its two enforcement assertions
# on a host that is not `Enforced` -- correctly, since a developer's laptop or
# a restricted container has a real, permanent reason to be `Advisory` and
# must not fail an ordinary `cargo test`. That default also means the Linux
# mount-namespace recipe in `contain.rs::mount_script` was, until this
# workflow, proved by no test anywhere: CI's own required job runs on exactly
# such a host and stayed green whether or not the recipe held.
#
# `STELLA_REQUIRE_CONTAINMENT=1` flips those two assertions from "skip
# quietly" to "panic with the reason" -- see `enforced_or_skip` in that file.
# This job is where that flag gets set on the one kind of host it is honest to
# set it on: a Linux CI runner declaring it expects the mechanism to work.
#
# Deliberately its own workflow, not a job folded into ci.yml's required
# checks. The recipe took two rounds to hold and each round was a different
# refusal: the pre-#3010 form -- `unshare --mount --propagation private --`,
# no `--user` -- does not hold for a non-root process even with `util-linux`
# installed, because it never acquires CAP_SYS_ADMIN; #3010 added
# `--user --map-root-user` to acquire it, and this runner then refused *that*
# at the `/proc/self/uid_map` write, Ubuntu 24.04 restricting unprivileged
# user namespaces by default (#3011, and the sysctl step below). Making this
# job a required
# branch-protection context before a maintainer has seen it go green on an
# actual GitHub Actions VM (not a nested container, which the local
# reproduction could not fully stand in for) risks turning `main` red on
# every PR for a fact about the runner, not a regression in this PR's diff --
# exactly the trap #1863 and #1892 already paid down for the Rust gate. Once
# this job has run green here a few times, promoting it to required is a
# one-line branch-protection change plus a required-checks list update in
# ci.yml's own header comment.
on:
  pull_request:
    paths:
      - "crates/stella-tools/src/bash/contain.rs"
      - "crates/stella-tools/src/bash.rs"
      - "crates/stella-tools/tests/graded_tree_containment.rs"
      - ".github/workflows/containment-posture.yml"
  push:
    branches: [main]
    paths:
      - "crates/stella-tools/src/bash/contain.rs"
      - "crates/stella-tools/src/bash.rs"
      - "crates/stella-tools/tests/graded_tree_containment.rs"
      - ".github/workflows/containment-posture.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assert-enforced:
    name: graded-tree write ban is Enforced on this runner
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The runner denies the recipe for a reason that is about Ubuntu, not
      # about `contain.rs`: `kernel.apparmor_restrict_unprivileged_userns=1`
      # (Ubuntu 24.04's default) lets `unshare --user` create the namespace and
      # then refuses the `/proc/self/uid_map` write, so an unprivileged process
      # never reaches the `CAP_SYS_ADMIN` #3010 added `--map-root-user` to
      # obtain. Every one of the three unprivileged variants below failed that
      # way on `Linux 6.17.0-1022-azure` (#3011).
      #
      # Lowering it puts the runner in the configuration the Linux recipe is
      # written for -- an ordinary host where unprivileged user namespaces are
      # permitted -- which is the state a graded bench run executes in.
      #
      # Be exact about what this job then proves and what it does not. It
      # proves the recipe in `mount_script` holds on a real kernel when
      # unprivileged user namespaces are available. It does NOT prove Stella is
      # `Enforced` on a stock GitHub-hosted runner: there, `posture()` correctly
      # returns `Advisory(ProbeFailed)` and the post-hoc sealed-bytes detector
      # is the backstop, which is the degradation the functional probe exists to
      # report rather than paper over. Asserting a host fact we had to arrange
      # would be the trap this workflow's header already warns about; asserting
      # the recipe, on a host that permits it, is the thing under test.
      - name: permit unprivileged user namespaces (see comment)
        run: |
          set -eu
          before=$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo '<absent>')
          if [ "$before" != '<absent>' ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          echo "apparmor_restrict_unprivileged_userns: $before -> $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo '<absent>')"

      # A ProbeFailed posture means "the kernel refused the recipe" and says
      # nothing about which link refused it, because `probe_mechanism` collapses
      # every failure into one variant by design. This step runs the recipe by
      # hand so a red job carries the kernel's own message: without it, the only
      # way to learn why a runner refuses is to guess, push, and read the same
      # opaque line again -- which is how #3010 stayed open across two rounds.
      # Cheap (no build) and `always()`, so a green job records the host's
      # posture too, which is what makes the next regression legible.
      - name: why (host containment facts)
        if: always()
        run: |
          set -u
          echo "kernel: $(uname -srm)"
          unshare --version || true
          echo "unprivileged_userns_clone: $(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo '<absent>')"
          echo "apparmor_restrict_unprivileged_userns: $(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo '<absent>')"
          echo "uid=$(id -u) cap-eff=$(grep CapEff /proc/self/status | tr -d '\t')"

          probe() {
            label=$1
            shift
            dir=$(mktemp -d)
            mkdir -p "$dir/graded/.git"
            printf original > "$dir/graded/sentinel"
            script="mount --bind '$dir/graded' '$dir/graded' || exit 127
          mount -o remount,bind,ro '$dir/graded' || exit 126
          mount --bind '$dir/graded/.git' '$dir/graded/.git' || exit 125
          mount -o remount,bind,rw '$dir/graded/.git' || exit 124
          printf pwned > '$dir/graded/sentinel' 2>/dev/null
          printf ok > '$dir/graded/.git/exempt' 2>/dev/null
          exit 0"
            echo "--- $label"
            "$@" /bin/sh -c "$script" && rc=0 || rc=$?
            echo "    wrapper rc=$rc sentinel=$(cat "$dir/graded/sentinel") exempt=$([ -e "$dir/graded/.git/exempt" ] && echo present || echo absent)"
            rm -rf "$dir"
          }

          probe "mount only (the pre-#3017 recipe)" \
            unshare --mount --propagation private --
          probe "user+mount (the current recipe)" \
            unshare --user --map-root-user --mount --propagation private --
          probe "user+mount, no propagation change" \
            unshare --user --map-root-user --mount --
          probe "sudo, mount only" \
            sudo unshare --mount --propagation private --

      - name: install rust
        run: rustup show

      - name: cargo test graded_tree_containment (posture required)
        env:
          STELLA_REQUIRE_CONTAINMENT: "1"
        run: cargo test -p stella-tools --test graded_tree_containment -- --nocapture
