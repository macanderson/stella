name: msrv

# The declared MSRV (`rust-version` in Cargo.toml, 1.90) was never exercised
# by CI, so MSRV breakage shipped silently (#787). This checks the workspace
# compiles on exactly that toolchain.
#
# Originally weekly + manual only, on the theory that an MSRV break is rare
# and never urgent. In practice that meant a PR using a 1.91+ API merged
# green and the break was discovered up to 7 days and an unknown number of
# commits later, at which point bisecting it is someone's afternoon instead
# of a review comment (#917). Now also runs on `pull_request`, mirroring
# ci.yml's `paths-ignore` so a docs-only PR doesn't pay for it. It is not
# marked as a required status check in branch protection — that's a repo
# Settings change outside this file — so until it is, treat a red run here
# the same as any other non-required check: fix before merging, don't ignore.
on:
  pull_request:
    paths-ignore:
      - "website/**"
      - "docs/**"
      - "*.md"
      - ".github/ISSUE_TEMPLATE/**"
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: cargo check on the declared MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Read the floor from the manifest so this job can never drift from the
      # declaration it exists to test.
      - name: Resolve declared MSRV
        id: msrv
        run: |
          set -euo pipefail
          version="$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"
          [ -n "$version" ] || { echo "::error::no rust-version in Cargo.toml"; exit 1; }
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      # rust-toolchain.toml pins a NEWER toolchain for development; override it
      # so the check genuinely runs on the floor.
      #
      # This step once rewrote Cargo.toml in the checkout to dodge the
      # `cfg_select!` build failure (#1112). #1113 removed the need by holding
      # rusqlite at 0.39, and left the rewrite behind actively broken: its
      # `sed` matched `version = "0.40"`, so against the 0.39 pin it changed
      # nothing and its own guard failed the job on every PR. The dependency
      # is the right place to carry an MSRV constraint — see the rusqlite pin
      # in Cargo.toml. Keep this job a plain check of what actually ships.
      #
      # `--locked` is the point of the gate, not an extra: it proves the
      # COMMITTED lockfile builds on the floor. Without it cargo may resolve a
      # different graph than any contributor or release ever uses, which is
      # how a patch release of a transitive build script (libsqlite3-sys
      # 0.38.1) reached every open branch at once and went unnoticed.
      - name: cargo check --workspace
        run: cargo +${{ steps.msrv.outputs.version }} check --workspace --locked
