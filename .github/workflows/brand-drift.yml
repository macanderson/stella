name: brand-drift

# Fails when a file this repository copies from the Oxagen house kit
# (oxageninc/brand) differs from the kit's `main`.
#
# `scripts/sync-brand-assets.mjs --check` compares every file the sync writes:
# the marks, icons, spinners, social art, fonts, token files, the Observatory's
# marks, the branding skill stub, and the colour of each Stella token the house
# palette owns. It writes nothing and renders nothing.
#
# The same run reads the site's stylesheets (`GUARDED_CSS` in the script). It
# fails on a corner, shadow, type size, or page wrap written as a number where
# a house token should be, and on a token reference that no sheet declares.
# It reads the marketing pages' markup (`GUARDED_TSX`) too, and fails on a
# Tailwind size class such as `text-sm`, where a `text-m-*` class should be.
# Each line names the file, the line, and the token to use.
#
# The job checks out the kit's `main`, never a pinned commit, so the daily run
# goes red on the first day the kit moves ahead of this repository. The kit is
# a public repository, so the checkout needs no token.
# `scheduled-red.yml` turns that red run into an issue. The kit's fan-out
# workflow opens the pull request that runs the sync here.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brand-drift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  brand-drift:
    name: Brand drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check out the house kit at main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: oxageninc/brand
          ref: main
          path: .brand-kit
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Every synced file matches the kit
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if out=$(node scripts/sync-brand-assets.mjs --brand .brand-kit --check 2>&1); then echo "$out"; exit 0; fi
          echo "$out"
          # A finding fails a push to main, the daily run, and a manual run. A pull request fails
          # only when it changes a file the output names (one that differs from the kit, or a
          # stylesheet with a literal), the sync script, or this workflow. Any other pull request
          # passes with a warning: a kit change is not that pull request's doing, and the kit's
          # fan-out opens the sync pull request that fixes it (oxageninc/brand#53).
          if [ "$EVENT" = pull_request ]; then
            flat=" $(printf '%s' "$out" | tr '\n\t' '  ') "
            touched=""
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              case "$f" in scripts/sync-brand-assets.mjs|.github/workflows/brand-drift.yml) touched="$f"; break ;; esac
              case "$flat" in *" $f "*) touched="$f"; break ;; esac
            done < <(git diff --name-only HEAD^1 HEAD)
            if [ -z "$touched" ]; then
              echo "::warning::The brand check above names files this pull request does not change, so the check passes. For kit drift, the kit's fan-out opens the sync pull request."
              exit 0
            fi
            echo "::error::This pull request changes $touched, and the brand check above names a problem."
          fi
          echo "::error::For a file that differs from the kit, run node scripts/sync-brand-assets.mjs --brand <oxageninc/brand checkout> and commit the result. For a stylesheet line, use the token the line names."
          exit 1
