name: brand-drift

# Fails when a file this repository copies from the Oxagen house kit
# (oxageninc/brand) differs from the kit's `main`.
#
# `scripts/sync-brand-assets.mjs --check` compares every file the sync writes:
# the marks, icons, spinners, social art, fonts, token files, the Observatory's
# marks, the branding skill stub, and the colour of each Stella token the house
# palette owns. It writes nothing and renders nothing.
#
# The job checks out the kit's `main`, never a pinned commit, so the daily run
# goes red on the first day the kit moves ahead of this repository. The kit is
# a public repository, so the checkout needs no token.
# `scheduled-red.yml` turns that red run into an issue. The kit's fan-out
# workflow opens the pull request that runs the sync here.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brand-drift-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  brand-drift:
    name: Brand drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check out the house kit at main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: oxageninc/brand
          ref: main
          path: .brand-kit
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Every synced file matches the kit
        run: |
          if ! node scripts/sync-brand-assets.mjs --brand .brand-kit --check; then
            echo "::error::This repository has drifted from oxageninc/brand main. Run: node scripts/sync-brand-assets.mjs --brand <oxageninc/brand checkout>"
            exit 1
          fi
