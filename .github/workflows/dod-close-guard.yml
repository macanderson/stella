# DoD close guard (SCR-003) — caller stub.
#
# Reopens an issue closed as *completed* while its definition-of-done still
# has unchecked items. The merge gate in dod-check.yml carries the load; this
# covers the hand-closed path, after the fact, because GitHub has no pre-close
# hook to veto.
#
# Implementation lives once in oxagen — see ADR-039.
#
# oxageninc/product has been private since 2026-10-01. A public repository
# cannot call a private repository's workflow, so this caller fails before it
# starts a job. #6638 holds the decision on where the implementation moves.
name: dod-close-guard

on:
  issues:
    types: [closed]

# The shared workflow checks out its tooling, so it needs contents: read.
# A called workflow gets no permission that this file does not grant.
permissions:
  contents: read
  issues: write

jobs:
  guard:
    uses: oxageninc/product/.github/workflows/dod-close-guard.yml@c7226a6179e4866ea178ab8b6ba57a786ffa4dec # oxagen main, #5183
