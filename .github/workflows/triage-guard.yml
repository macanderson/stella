# Triage separation of duties (SCR-005): issue creators get exactly one
# label, `TRIAGE`. Priority labels come only from the triage identity.
# Invariant: every open issue carries a P-label or `TRIAGE`, never neither,
# never both.
#
# Label names compare without regard to case. An issue and an event carry
# each label in its stored spelling, so the guard must read `triage` and
# `TRIAGE` as one label while the labels are renamed.
name: triage-guard
on:
  issues:
    types: [opened, labeled]
permissions:
  issues: write
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Logins allowed to set P-labels. `macanderson` is the interim
          # triage authority until the dedicated triage-agent identity
          # stands up (SCR-005 §Exceptions) — remove it then.
          #
          # This is a list rather than one login because the exception is
          # part of the rule: SCR-005 says the maintainer holds the triage
          # authority *until* the bot exists, and the bot does not exist.
          # A guard naming only `triage-bot` does not enforce SCR-005 — it
          # locks every login out of a facet SCR-005 requires somebody to
          # set, which is how #5205 made the whole backlog unprioritisable.
          #
          # `github-actions[bot]` is the login a workflow posts under when it
          # authenticates with the run's own token, which is what
          # `triage-schedule.yml` does. That token raises no workflow event —
          # the rule AGENTS.md names for `auto-tag.yml` and `main-canary.yml` —
          # so the sweep's writes never reach this guard and the entry is inert
          # today. It starts mattering the day the sweep needs a PAT or an App
          # token, whose writes do raise events: without the entry the guard
          # would strip each priority the sweep wrote and put `TRIAGE` back,
          # and the next sweep would size the same issue again.
          TRIAGE_LOGINS: triage-bot macanderson github-actions[bot]
        with:
          script: |
            const issue = context.payload.issue;
            // Every level SCR-005's Directive names, `P4` included. A level the
            // label set has and this regex does not is a hole in both
            // directions: the guard never strips it from a non-triage login,
            // and an issue carrying only that label reads as unprioritised to
            // every query built on this pattern while reading as triaged to a
            // human (#5216).
            //
            // SCR-005 states the scheme; this is the one copy of it, because a
            // workflow cannot read a document as it runs. The two are held
            // together by scripts/check-priority-scheme.py, so editing one
            // without the other fails the gate rather than the backlog.
            const P = /^P[0-4]$/;
            const allowed = process.env.TRIAGE_LOGINS.split(/\s+/);
            const names = issue.labels.map(l => (typeof l === 'string' ? l : l.name));
            const isTriage = n => n.toLowerCase() === 'triage';
            if (context.payload.action === 'opened'
                && !names.some(isTriage)
                && !names.some(n => P.test(n))) {
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: issue.number, labels: ['TRIAGE'] });
            }
            if (context.payload.action === 'labeled'
                && P.test(context.payload.label.name)
                && !allowed.includes(context.payload.sender.login)) {
              await github.rest.issues.removeLabel({
                ...context.repo, issue_number: issue.number,
                name: context.payload.label.name });
              await github.rest.issues.addLabels({
                ...context.repo, issue_number: issue.number, labels: ['TRIAGE'] });
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: 'Priority labels are assigned only by the triage agent (SCR-005). Re-queued as `TRIAGE`.' });
            }
