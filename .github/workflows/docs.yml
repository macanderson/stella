name: docs

# The docs site's CI: lint, typecheck, and a production build of
# website/. Scoped to the paths that can affect the site, the mirror
# image of ci.yml's paths-ignore — every PR runs exactly one of the two
# (or both, when it genuinely touches both worlds).
on:
  pull_request:
    paths:
      - "website/**"
      # The brand kit is an INPUT to this workflow, not just a neighbour:
      # website/src/lib/brand-parity.test.ts reads docs/brand/ on both sides of
      # every assertion, so a change confined to the kit is precisely the one
      # that can break parity — and it used to start neither this workflow nor
      # ci.yml, which ignores docs/**. Same disjoint-paths reasoning that gave
      # wire-schema.yml its own trigger on the generated artefacts it checks.
      - "docs/brand/**"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "website/**"
      # The brand kit is an INPUT to this workflow, not just a neighbour:
      # website/src/lib/brand-parity.test.ts reads docs/brand/ on both sides of
      # every assertion, so a change confined to the kit is precisely the one
      # that can break parity — and it used to start neither this workflow nor
      # ci.yml, which ignores docs/**. Same disjoint-paths reasoning that gave
      # wire-schema.yml its own trigger on the generated artefacts it checks.
      - "docs/brand/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Typecheck + build for every trigger; the deploy job below additionally
# publishes to production on push-to-main / manual dispatch, holding only the
# same read permission (Vercel auth rides the VERCEL_* secrets, not the
# GITHUB_TOKEN).
permissions:
  contents: read

jobs:
  build:
    name: typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every step runs inside the package. The site's manifest, lockfile and
    # pnpm settings all live in `website/` now — there is no root package to
    # hop through, so the scripts are invoked where they are defined.
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          # `defaults.run.working-directory` does not apply to `uses:` steps,
          # so the action needs the manifest path spelled out to read
          # `packageManager` from it.
          package_json_file: website/package.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: pnpm
          # Likewise: the cache key is hashed from the lockfile, which no
          # longer sits at the repo root.
          cache-dependency-path: website/pnpm-lock.yaml

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm typecheck

      # `pnpm test` ran in no workflow at all until #3968. The site's 26 node
      # tests — the brand-parity matrix among them — existed, passed review,
      # and were then never executed by CI, so the one guard holding this site
      # to `docs/brand/` could go red and stay red with nothing to say so. It
      # did: #3673 reverted the investor deck to the gold identity and brought
      # back two values #3658's own retired list banned, and that break sat on
      # `main` undetected until someone ran the suite by hand. A test nobody
      # runs is documentation with a worse failure mode, because it reads as
      # coverage.
      #
      # It runs before `build` deliberately: it is seconds, and a palette that
      # has drifted should not have to wait on a full Next build to say so.
      - name: test
        run: pnpm test

      - name: build
        run: pnpm build

  # The production deploy (#561): how a merged docs change reaches
  # stella.oxagen.sh, in version control instead of only a hosting dashboard.
  # Gated on the GitHub `production` environment so each deployment is
  # auditable and revocable, and on three repo secrets (VERCEL_TOKEN,
  # VERCEL_ORG_ID, VERCEL_PROJECT_ID — a Vercel account token plus the ids
  # `vercel link` prints). Skips gracefully when they are not set, so a fork
  # or a repo mid-setup is never blocked on a deploy it cannot perform —
  # the same posture as release.yml's Homebrew publish.
  deploy:
    name: deploy stella.oxagen.sh
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Deploy to Vercel production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::warning::VERCEL_TOKEN is not set — skipping the production deploy." \
                 "One-time setup (token + org/project ids) is documented in website/README.md."
            exit 0
          fi
          # The Vercel project's Root Directory is `website`, so the CLI runs
          # from the repo root and the project settings pulled below scope the
          # build to that directory.
          npx --yes vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
