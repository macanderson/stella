name: guard-self-tests

# The server-side home for the guards nothing server-side was running (#3820,
# #4427).
#
# Two questions, one workflow, because both are answered by the same
# toolchain-free runner in seconds.
#
# **`gate-steps`** — `prose`, `hue-separation` and `transcript-surfaces` are
# `GATE_STEPS` members, and `rg 'check-prose|check-hue-separation|check-transcript-surfaces'
# .github/workflows/` was empty: ci.yml runs the guards individually rather
# than `make gate`, so those three ran only on a contributor's machine. The
# pre-push hook is advisory, per-clone and bypassable, and on the maintainer's
# laptop the gate is not run at all (CLAUDE.md, "CI builds and tests; this
# laptop does not") — so for these three there was no check to complement.
# `tokens` sat in the same hole from #4066 until #4086, red on `main` for
# twenty PRs that were all otherwise green. They live here rather than in
# ci.yml's guards job because that job is skipped for a prose-only diff, which
# is exactly the diff `prose` exists to judge.
#
# **`self-tests`** — the hermetic suites whose whole job is to prove a guard
# *can still fail*. file-size.yml states the argument and states it correctly:
# "A ratchet that has quietly become incapable of failing reports green
# forever, which is worse than not having one." That reasoning is not specific
# to the file-size ratchet, but until now only three of the twenty-seven
# suites ran anywhere automatic (file-size.yml, duplicate-claims.yml, and
# `test-deck-fit-all.sh` in ci.yml). #3750 is what that costs: the typed-errors
# writer path grandfathered a brand-new violation, silently and for as long as
# the guard existed, and nothing was in a position to notice.
#
# They stay out of `make gate` — that exclusion is deliberate and stands, since
# each builds throwaway git repositories and the gate is what a contributor
# runs before every push.
#
# **`canary-self-tests`** — one suite, in its own job because it is the one that
# compiles: scripts/main-canary.sh's `compile` row runs `cargo check`, and under
# `--manifest-dir` that is a throwaway one-function crate rather than this
# workspace. Every row of the canary honors `--manifest-dir` now, so a fixture
# run judges only the fixture — `check-prose.py` and `check-file-size.sh`
# included, which ran over the live tree on every one of the suite's ~38
# canary invocations while only `lockfile-sync` and `compile` were redirected.
# Measured 2026-08-30: 41.6s for the full suite on an M-series laptop, now 34
# cases including six moved back in from the file this fix retired — against
# 8m16s on this runner and 5m07s on the same laptop for 28 cases, measured
# 2026-08-28. This job stays separate from the `self-tests` job above for the
# reason that has not changed: it compiles, and that one is toolchain-free and
# seconds.
#
# No `paths:` filter, deliberately, and for a different reason than
# wire-schema.yml and docs-guards.yml have one. Those two narrow to escape a
# cost — a workspace build, a browser — that this workflow does not pay: the two
# jobs above are shell and Python over the tree, and the third compiles a
# fixture crate. Several suites also assert something about the *live* tree
# (`test-module-reachability.sh`'s R1 is "this repository is clean"), so a
# filter would make them blind in exactly the direction they exist to watch.
# file-size.yml made the same call for the same reason.

on:
  pull_request:
  merge_group:

# Reads the repository and nothing else.
permissions:
  contents: read

concurrency:
  group: guard-self-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate-steps:
    name: gate steps no other workflow runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Each step carries `!cancelled()` so a red one reports independently
      # instead of masking the next — ci.yml's guards job explains the trade at
      # length, and the three below are verdicts about disjoint subjects.
      - name: no content-free prose was added
        if: ${{ !cancelled() }}
        run: python3 ./scripts/check-prose.py

      - name: prose cites code by name, never by line number
        if: ${{ !cancelled() }}
        run: python3 ./scripts/check-line-citations.py

      - name: no two web semantic roles sit within 30° in OKLCH
        if: ${{ !cancelled() }}
        run: python3 ./scripts/check-hue-separation.py

      - name: every transcript surface declares how it draws
        if: ${{ !cancelled() }}
        run: python3 ./scripts/check-transcript-surfaces.py

      # The three steps above run here because this trigger carries no
      # `paths:` filter at all -- that is what lets them fire on a
      # scripts-only pull request. Nothing enforced that absence except a
      # comment, so this reads it back: at least one workflow must run each
      # of the three with an unfiltered `pull_request:` trigger, or a future
      # edit narrowing this one would silently reopen the gap (#5448).
      - name: each guard above still runs with no paths filter somewhere
        if: ${{ !cancelled() }}
        run: python3 ./scripts/check-guard-trigger-coverage.py

  self-tests:
    name: guard self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The suites missing from this list run elsewhere and are not duplicated
      # here: test-file-size.sh in file-size.yml, test-duplicate-claims.sh in
      # duplicate-claims.yml, and test-deck-fit-all.sh, test-self-driving.sh
      # and test-impacted-crates.sh in ci.yml. The last two want the toolchain:
      # one builds `stella`, and the other runs `cargo metadata` against a
      # synthetic workspace a dozen times. That one also wants ripgrep, which
      # ubuntu-latest does not ship — without it the scoper answers
      # `--workspace` for everything, which is its documented fall-back, and 13
      # of its 25 cases went red in this job before it moved.
      #
      # The deliberately unhosted ones are named in the Makefile's
      # `UNHOSTED_SELF_TESTS`, with the reason each is excluded;
      # scripts/check-gate-parity.sh fails when a suite is in neither place.
      # test-main-canary.sh is not among them any more — it wants a toolchain,
      # so it has the job below rather than a step here (#5356).
      - name: action-pins guard covers composite actions
        if: ${{ !cancelled() }}
        run: ./scripts/test-action-pins.sh

      - name: the ADR-numbering guard can still fail
        if: ${{ !cancelled() }}
        run: ./scripts/test-adr-numbering.sh

      - name: arena start/stop/reap/local scripts
        if: ${{ !cancelled() }}
        run: ./scripts/test-arena-scripts.sh

      - name: which PR the auto-merge nudge picks
        if: ${{ !cancelled() }}
        run: ./scripts/test-automerge-nudge.sh

      - name: CHANGELOG.md still has its 0.8.0 section
        if: ${{ !cancelled() }}
        run: ./scripts/test-changelog-0.8.0-section.sh

      - name: which releases get a CHANGELOG.md section
        if: ${{ !cancelled() }}
        run: ./scripts/test-changelog-roll.sh

      - name: which diffs run the Rust gate
        if: ${{ !cancelled() }}
        run: ./scripts/test-ci-rust-scope.sh

      - name: consumer-sites guard failure directions
        if: ${{ !cancelled() }}
        run: ./scripts/test-consumer-sites.sh

      - name: line-citation ratchet direction
        if: ${{ !cancelled() }}
        run: ./scripts/test-line-citations.sh

      - name: contrast ratchet direction
        if: ${{ !cancelled() }}
        run: ./scripts/test-contrast.sh

      - name: light-clamp guard directions
        if: ${{ !cancelled() }}
        run: ./scripts/test-light-clamp.sh

      - name: dead-code ratchet direction
        if: ${{ !cancelled() }}
        run: ./scripts/test-dead-code-allows.sh

      - name: deck path guard directions
        if: ${{ !cancelled() }}
        run: ./scripts/test-deck-paths.sh

      - name: The rendering-facts guard can still fail
        run: ./scripts/test-rendering-facts.sh

      - name: diagnostic-code registry failure directions
        if: ${{ !cancelled() }}
        run: ./scripts/test-diagnostic-codes.sh

      - name: deleted-tests guard reads a live PR body over a stale one
        if: ${{ !cancelled() }}
        run: ./scripts/test-deleted-tests.sh

      - name: dependabot pip directory guard catches an empty directory (#3459)
        if: ${{ !cancelled() }}
        run: ./scripts/test-dependabot-pip-dirs.sh

      # Was in UNHOSTED_SELF_TESTS until #4443: 14 of its 38 cases failed
      # everywhere, not just outside a Linux dev box as first suspected — the
      # fixture built a synthetic repo shaped `stella-core/src/`, and
      # setup-dev-env.sh's own workspace-shape check requires
      # `crates/stella-core/`. Needs the runner's preinstalled rustfmt for the
      # formatting-hook cases (H6/H6b); ubuntu-latest ships one, so this adds
      # no toolchain-install step the way test-guard-sigpipe.sh's
      # `cargo build` would — that is what keeps this job toolchain-free.
      - name: dev-env setup script and its fmt-file hook
        if: ${{ !cancelled() }}
        run: ./scripts/test-dev-env.sh

      - name: gate-parity guard failure directions
        if: ${{ !cancelled() }}
        run: ./scripts/test-gate-parity.sh

      - name: schema-tier-parity guard failure directions
        if: ${{ !cancelled() }}
        run: ./scripts/test-schema-tier-parity.sh

      - name: guard-trigger-coverage guard failure directions
        if: ${{ !cancelled() }}
        run: python3 ./scripts/test-guard-trigger-coverage.py

      - name: priority-scheme guard failure directions
        if: ${{ !cancelled() }}
        run: python3 ./scripts/test-priority-scheme.py

      - name: the zsh completion installer
        if: ${{ !cancelled() }}
        run: ./scripts/test-install-zsh-completions.sh

      - name: lockfile guard against skewed workspaces
        if: ${{ !cancelled() }}
        run: ./scripts/test-lockfile-sync.sh

      - name: the red-main hold, blocking branch included
        if: ${{ !cancelled() }}
        run: ./scripts/test-main-red-hold.sh

      - name: the red-main claim pre-flight, standing-down branch included
        if: ${{ !cancelled() }}
        run: ./scripts/test-main-red-claim.sh

      - name: the issue-claim pre-flight, standing-down branch included
        if: ${{ !cancelled() }}
        run: ./scripts/test-issue-claim.sh

      - name: the retired-hex ban in every notation, and the citation check
        if: ${{ !cancelled() }}
        run: ./scripts/test-tokens.sh

      - name: measured-constants guard failure directions
        if: ${{ !cancelled() }}
        run: ./scripts/test-measured-constants.sh

      - name: the module-reachability walker
        if: ${{ !cancelled() }}
        run: ./scripts/test-module-reachability.sh

      - name: the core-reachability walker and its ratchet direction
        if: ${{ !cancelled() }}
        run: ./scripts/test-core-reachability.sh

      - name: the unverified-main detector, and that it fails open
        if: ${{ !cancelled() }}
        run: ./scripts/test-main-verified.sh

      - name: the main-tip dispatcher, and that it starts nothing twice
        if: ${{ !cancelled() }}
        run: ./scripts/test-dispatch-main-verification.sh

      - name: the session-scratch boundary
        if: ${{ !cancelled() }}
        run: ./scripts/test-no-scratch.sh

      - name: prose ratchet direction
        if: ${{ !cancelled() }}
        run: ./scripts/test-prose-guard.sh

      - name: the demo recorder's raster and ladder arithmetic
        if: ${{ !cancelled() }}
        run: ./scripts/test-record-demo-size.sh

      - name: a release version stamp leaves Cargo.lock resolvable
        if: ${{ !cancelled() }}
        run: ./scripts/test-release-lockfile.sh

      - name: the tag/release reconciliation rule
        if: ${{ !cancelled() }}
        run: ./scripts/test-releases-published.sh

      - name: the Homebrew tap staleness rule
        if: ${{ !cancelled() }}
        run: ./scripts/test-tap-current.sh

      - name: the release fetch has no fixed count cap
        if: ${{ !cancelled() }}
        run: ./scripts/test-releases-published-pagination.sh

      - name: rebase-replay guard directions, and the hazard itself
        if: ${{ !cancelled() }}
        run: ./scripts/test-rebase-replay.sh

      - name: the shellcheck step's presence guard
        if: ${{ !cancelled() }}
        run: ./scripts/test-shellcheck-guard.sh

      - name: release-artifact smoke gate against broken artifacts
        if: ${{ !cancelled() }}
        run: ./scripts/test-smoke-artifact.sh

      - name: transcript-surface guard failure directions
        if: ${{ !cancelled() }}
        run: python3 ./scripts/test-transcript-surfaces.py

      - name: typed-errors ratchet direction
        if: ${{ !cancelled() }}
        run: ./scripts/test-typed-errors.sh

      - name: tool-error-class ratchet direction
        if: ${{ !cancelled() }}
        run: ./scripts/test-tool-error-class.sh

      - name: website-inputs guard failure directions
        if: ${{ !cancelled() }}
        run: ./scripts/test-website-inputs.sh

      - name: wire-path guard failure directions
        if: ${{ !cancelled() }}
        run: ./scripts/test-wire-paths.sh

  canary-self-tests:
    name: post-merge canary self-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # rust-toolchain.toml pins the repo to 1.97.0 and rustup honours it for
      # every cargo invocation inside the checkout, so this step exists to put
      # *a* rustup on PATH; the pin is installed by the first cargo call. The
      # canary runs from the repo root even when checking a fixture, which is
      # what brings the pin into it.
      - name: Install Rust (rustup; the pin comes from rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      # Not cached: the fixture workspaces are built in $TMPDIR and thrown away,
      # so there is no `target/` for Swatinem/rust-cache to carry between runs,
      # and no dependency to fetch — the fixture crate has none.
      - name: the canary opens, refreshes and explains a main-red issue
        run: ./scripts/test-main-canary.sh
