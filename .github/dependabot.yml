# Automated dependency + security updates.
# https://docs.github.com/code-security/dependabot
version: 2
updates:
  # Rust workspace.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      cargo:
        update-types: [minor, patch]

  # GitHub Actions are pinned to full commit SHAs in every workflow, with the
  # human-readable tag kept as a trailing comment. Dependabot reads that
  # comment to know what the pin means and rewrites both halves together, so
  # an update still arrives as a reviewable version bump rather than an
  # opaque SHA change.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Python benchmark harness + Harbor adapter.
  - package-ecosystem: pip
    directory: /bench
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /bench/harbor_adapter
    schedule:
      interval: weekly
