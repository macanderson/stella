[package]
name = "stella-serve"
description = "Headless engine server: drives the Stella engine over a wire protocol so a host (e.g. Oxagen) runs the Rust core under the hood. Every model and tool call is remoted back to the host — the engine holds no ambient authority."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish.workspace = true

[[bin]]
name = "export-serve-schema"
path = "src/bin/export_serve_schema.rs"
# Only built when the wire contract is being regenerated, so a default build of
# the workspace never compiles it or `schemars`.
required-features = ["schema"]

[features]
# OFF by default, mirroring stella-protocol's own `schema` feature and for the
# same reason: it adds the `schemars` derives that let `export-serve-schema`
# emit docs/wire/serveframe.schema.json and its TypeScript twin, and a default
# build of the shipping binary must never pay for describing the wire format.
schema = ["dep:schemars", "stella-protocol/schema"]

[dependencies]
schemars = { workspace = true, optional = true }
stella-protocol = { path = "../stella-protocol" }
stella-core = { path = "../stella-core" }
# The step-scoped facade (#971 phase 1). `stella-serve` drives `run_step`
# rather than `Engine::run_turn` so a turn can be cancelled at a step
# boundary and checkpointed between steps (#1129).
stella-engine = { path = "../stella-engine" }
# The verification pipeline (#1288): `pipeline` on `POST /v1/turns` drives a
# turn through `stella_pipeline::Pipeline::run` instead of a bare engine step
# loop, over the same remoted ports every other turn uses.
stella-pipeline = { path = "../stella-pipeline" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
async-trait.workspace = true
# Turn ids must be unguessable, not merely unique: a sequential id makes every
# other live turn addressable to anyone who sees one in a log. Already a
# workspace dependency (stella-core, stella-store, stella-tools, stella-mcp).
rand.workspace = true
# `signal` is what makes the SIGTERM drain possible (#1131); without it a
# redeploy hard-kills whatever turns happen to be in flight.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "signal"] }

[dev-dependencies]
# `test-util` gives the paused clock, which is what makes the 30s read deadline
# assertable in microseconds instead of thirty real seconds of CI time.
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "sync", "time", "macros", "net", "io-util", "signal", "test-util"] }
# Already in `[workspace.dependencies]` and already built for other crates, so
# this adds no crate to the graph. Needed for the one property that matters
# here: every connection produces exactly one record. The original bug this
# guards against is always a path nobody enumerated, so hand-listed cases are
# precisely how it would be missed.
proptest.workspace = true
# The `FileCheckpointStore` tests need a real directory to write into, and a
# temp one keeps them from fighting each other or the developer's tree.
# Already a workspace dependency (stella-cli, stella-store), so no crate joins
# the graph.
tempfile.workspace = true
