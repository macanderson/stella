# stella-selfdriving — the consent document for the perpetual delivery loop.
#
# `doc:pipeline-as-plugins` §10 settles what this is: self-driving is a HOST,
# not a wrapper (option 2). It does not participate in a turn; it DRIVES
# Stella from outside. That is why `[loop] participation` is `none` below and
# why there is no `[runtime]`, no `[oracle]` and no `[wrapper]`: none of them
# would be true.
#
# Stella starts it. `[driver.process]` at the foot of this file names
# `main.py`, and `stella plugin drive stella-selfdriving` opens one session
# against it (#3783, #6063). The program asks for the capabilities listed in
# `[driver] calls` and gets exactly those; anything else comes back refused,
# and Stella performs what it does serve as this plugin rather than as you.
#
# WHAT THIS FILE IS FOR. The run playbook's D-3 settles the authority
# question: making the loop a plugin RELOCATES the authority it already holds
# as a shell script running as you, and grants nothing new. The requirement
# D-3 places on us is narrower and is the whole reason this file exists — the
# grant must be EXPRESSIBLE in the manifest vocabulary and SHOWABLE to a human
# BEFORE install. Run it and read it:
#
#     stella plugin install plugins/stella-selfdriving
#
# It prints the full rendering of everything below and then asks. With no
# terminal attached it prints the same text and refuses rather than assuming
# an answer.
#
# WHAT THIS FILE IS NOT. It is not the whole extraction yet.
# `scripts/self-driving.sh` is still the working driver and is deliberately
# untouched — §10's rule is that the shell driver is not deleted until its
# replacement is proven, and `main.py` gets as far as reading the ranked queue
# and asking to claim the top of it. Everything after that is still the shell
# script's, running as you.
#
# WHAT THE HOST NOW DOES WITH THIS LIST. Installing it builds a rule from it.
# The loader turns each entry below into an `AuthzGate` rule
# (`crates/stella-cli/src/plugin_authz.rs`, bound by `agent/tool_stack.rs`'s
# `session_gate`), so a tool call Stella attributes to this plugin is refused
# unless this list allows it, at a grade this list allows. The rule is asked:
# when `main.py` asks Stella to read the tracker, Stella checks this list for
# `bash` — the capability that shells out to `gh` — as
# `Principal::Plugin("stella-selfdriving")`, and refuses the read if the list
# does not carry it. Read the capability list as "what this loop does to your
# machine today, written down", because that is exactly what it is.
#
# The grades below are read off `scripts/self-driving.sh` itself, and
# `crates/stella-cli/tests/self_driving_consent.rs` fails if a power named
# here stops appearing in that script or a power the script uses stops being
# named here.

name = "stella-selfdriving"
description = "The perpetual delivery loop: sizes a cycle to your machine, fixes a batch of defects, audits what is left, files what it cannot fix, benchmarks, ships, and repeats. It does not terminate."

# A host, not a participant. `none` is the honest grade: this plugin never
# runs inside a turn, holds no hook, answers no wrapper point, and cannot
# refuse to let a turn end. Everything it does, it does from outside — which
# is precisely why the capability list below is the entire risk.
[loop]
participation = "none"

# ---------------------------------------------------------------------------
# The grant. One entry per tool, because two entries for one tool make the
# effective grant the union of two lines a user read separately.
#
# `scope` is the PLUGIN'S OWN CLAIM about how it will use a capability, and
# the consent prompt says so in those words. Stella enforces the tool and the
# grade; it does not verify the claim.
# ---------------------------------------------------------------------------

[[capabilities]]
tool = "bash"
risk = "destructive"
purpose = "run every external program a delivery cycle needs — the defect queue, the branch, the gate, the benchmark, and the release install"
scope = [
  "`gh` — read the defect queue, file findings as issues, open and read pull requests",
  "`git` and `make`/`cargo` inside the workspace it was started in",
  "`brew tap macanderson/tap` and `brew install|upgrade macanderson/tap/stella` — the tap-qualified name only, because homebrew-core's `stella` is an Atari 2600 emulator and installing it exits 0 — plus `brew untap macanderson/stella`, which is a second name for the same repo and leaves a machine with two taps that fetch independently",
  "`aws ec2 start-instances`/`stop-instances` on the benchmark rig named by SELF_DRIVING_RIG_INSTANCE — it bills $45.56/day for as long as it is running",
  "`ssh`/`scp` to that rig, with the key at ~/.stella/keys/, to run the head-to-head match",
]

[[capabilities]]
tool = "write_file"
risk = "destructive"
purpose = "keep `stella` resolving to the release build across upgrades, install its slash commands, and remember what every past cycle learned"
scope = [
  "the single dev-build PATH line in your login shell's rc file (SELF_DRIVING_RC, ~/.zshrc by default) — matched byte-for-byte, backed up first, and commented out rather than deleted",
  "~/.claude/commands/self-driving* — the judgement half of the loop, written into ANOTHER agent product's command directory so that product will run it",
  "~/.stella/self-driving/<repo>/ — the ledger, the seen-finding set, the aperture and the learned ceilings",
]

[[capabilities]]
tool = "process_spawn"
risk = "high"
purpose = "outlive the terminal that started it, and spend money running a cycle unattended"
scope = [
  "re-executing its own `daemon loop` under nohup, writing to a log under the state directory",
  "`stella run` once per cycle with the cycle prompt on stdin, under SELF_DRIVING_BUDGET_USD (default $10) per cycle — it does not ask before each one",
  "killing that cycle's whole process group on stop, so a `daemon stop` actually stops the spending",
]

# ---------------------------------------------------------------------------
# THE DRIVER GRANT — what this plugin may ask Stella to do while driving it.
#
# Everything above is a capability this plugin exercises ITSELF, as a process
# on your machine holding your credentials. Everything below is the opposite
# shape and the whole point of the driver channel: a capability Stella
# performs ON REQUEST, having first checked this list. The plugin holds no
# provider, no forge token and no worktree of its own — it asks, and it may
# never reach (`doc:backlog-self-driving` §3.0, #3599 B0).
#
# This block is NOT a `[loop]` grade. Driving is a different axis from
# in-turn influence: `participation = "none"` above stays the honest answer,
# because this plugin still never runs inside a turn. It starts them.
#
# FIVE OF THESE ARE SERVED. `backlog_next` reads the tracker through the same
# `IssueProvider` port the `stella self-driving` verbs use. `backlog_claim`
# takes the same lease `stella self-driving drive` takes. The three `work`
# verbs run one issue through one bounded `stella run`, in a checkout of its
# own.
#
# Every other verb below comes back `unsupported` until the phase that builds
# it lands. The loop degrades; it does not die. All of them are declared now
# because a grant is a consent document. Read the whole shape of what this loop
# may do before any of it works.
#
# WHAT IS DELIBERATELY ABSENT, and why each is a decision rather than an
# oversight:
#   - `curate_accept` — this repository's governance mode is `regulated`, so a
#     human stays on context-record promotion (§7). The loop may PROPOSE any
#     authority and grant itself none.
#   - any release verb — a release is the one action here that is
#     irreversible, externally visible, and not fixable by another cycle
#     (§6.4). It stays human by default and is not on the channel at all.
[driver]
calls = [
  # backlog — the ranked queue, the claim, and filing what a cycle could not
  # fix. This replaces three hardcoded `gh` call sites, which is why it is the
  # first family built.
  "backlog_next",
  "backlog_claim",
  "backlog_file",
  "backlog_close",
  "backlog_link",
  # work — one issue through Stella's own turn loop, in an isolated worktree.
  #
  # NOT through a built-in verification pipeline: there is no longer one to run.
  # The staged pipeline was deleted from this workspace (#3852/#3865) and
  # `--pipeline classic` is refused outright, so a turn gets exactly the
  # verification the INSTALLED PLUGINS provide and no more. With no verification
  # plugin installed, that is none, and the honest reading of a `work` outcome
  # is "the turn finished", not "the change is proven".
  #
  # This block said "the staged pipeline" and "the pipeline's verdict as the
  # definition of done" until #3599 B2. Both were false by then, and this file
  # is a consent document — a human reads it to decide what to grant, so a
  # promise here that nothing keeps is worse than no promise at all. What makes
  # an autonomous merge safe is `deliver` below, which gates on CI observed on
  # the forge, not on any claim made about the work stage.
  "work_start",
  "work_status",
  "work_abandon",
  # deliver — the PR rhythm, and the whole of what makes an autonomous merge
  # safe now that no built-in verification stage exists (see `work` above).
  # `deliver_merge` is emitted only by the pure machine in
  # `stella_autonomy::deliver_next`, and only from `Approved` — which requires
  # CI observed GREEN ON THE FORGE, a mergeability the forge has actually
  # computed, and, unless the operator turned it off in policy, a human
  # approval. Never on the loop's own opinion of its work.
  #
  # A red build that reproduces on the base branch is `BaseBroken`, not
  # `CiRed`: the loop waits rather than spending this PR's budget fixing
  # somebody else's breakage.
  "deliver_open",
  "deliver_observe",
  "deliver_next",
  "deliver_merge",
  # sweep — where the next question comes from when the queue runs dry.
  "sweep_audit",
  "sweep_regress",
  "sweep_meta",
  # curate — proposals only. See the note above on `curate_accept`.
  "curate_propose",
  "curate_list",
]

# How Stella starts the program. A list, never a shell string; `${plugin_dir}`
# interpolation is the host's job.
#
# `[driver.process]` rather than `[runtime]`, because the two are different
# consents: `[runtime]` is the process a plugin is INSIDE a turn, and the
# manifest refuses it below `participation = "observer"`. A driver is never
# invoked inside a turn by construction, so `none` above stays the right grade
# and this block is where its process is named.
[driver.process]
argv = ["python3", "${plugin_dir}/main.py"]
# A session now includes the work, because `work_start` is served. The host
# cuts a checkout and runs one turn in it while this program waits. A turn on a
# real issue takes minutes. A one-minute backstop would have killed every
# session that got as far as doing something. An hour is a backstop against a
# child that wedges. It is not a work budget: `stella plugin drive
# --spend-limit` is the number that decides what a session may cost.
timeout_secs = 3600
# Default-deny, and `PATH` is the whole list — it is here so the host can find
# `python3`. This program reaches for no file, no forge token and no provider
# key: everything it needs, it asks for above, and the socket withholds a model
# credential from every child the host spawns whatever a manifest asks for.
env = ["PATH"]
